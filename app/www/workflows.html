<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Studio — Workflow Manager</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  /* ── Header ── */
  header {
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: var(--display);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    line-height: 1;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }
  .logo small {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-left: 14px;
    font-weight: 400;
  }
  .header-actions { display: flex; gap: 12px; align-items: center; }

  /* ── Main ── */
  main { padding: 32px 40px 64px; }

  /* ── Workflow Card Grid ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    gap: 16px;
  }

  .wf-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
    position: relative;
  }
  .wf-card.ready {
    border-color: var(--success);
    box-shadow: 0 0 16px rgba(68, 255, 136, 0.06);
  }
  .wf-card.models-missing {
    border-color: var(--queued);
    box-shadow: 0 0 16px rgba(255, 170, 68, 0.06);
  }
  .wf-card.nodes-missing {
    border-color: var(--error);
    box-shadow: 0 0 16px rgba(255, 68, 102, 0.06);
  }

  .wf-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .wf-card-info { flex: 1; min-width: 0; }

  .wf-badge {
    display: inline-block;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 12px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .wf-badge.t2i { background: #e8ff47; color: #0a0a0f; }
  .wf-badge.i2v { background: #47c8ff; color: #0a0a0f; }
  .wf-badge.i2i { background: #ff8f47; color: #0a0a0f; }
  .wf-badge.ipa { background: #c47aff; color: #0a0a0f; }

  .wf-card-name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 4px;
    line-height: 1.3;
    word-break: break-word;
  }

  .wf-card-version {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    white-space: nowrap;
    align-self: flex-start;
  }

  .wf-card-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .wf-card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── Dependency Bars ── */
  .wf-deps { display: flex; flex-direction: column; gap: 8px; }

  .dep-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
  }
  .dep-label {
    color: var(--muted);
    min-width: 52px;
    flex-shrink: 0;
  }
  .dep-dots {
    display: flex;
    gap: 3px;
    align-items: center;
    flex-shrink: 0;
  }
  .dep-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }
  .dep-dot.filled { background: var(--success); }
  .dep-dot.missing-dot { background: var(--border); }

  .dep-count {
    color: var(--muted);
    white-space: nowrap;
  }
  .dep-count.all-good { color: var(--success); }
  .dep-count.has-missing { color: var(--queued); }

  .dep-action { margin-left: auto; flex-shrink: 0; }

  /* ── Card Actions ── */
  .wf-type-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid;
  }
  .wf-type-badge.static { color: var(--muted); border-color: var(--border); background: var(--bg); }
  .wf-type-badge.dynamic { color: var(--accent); border-color: var(--accent); background: rgba(232,255,71,0.1); }

  .wf-card-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: auto;
    padding-top: 4px;
  }

  /* ── Details Expand ── */
  .wf-details {
    display: none;
    flex-direction: column;
    gap: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .wf-details.visible { display: flex; }

  .detail-section-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .detail-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .detail-item {
    padding: 3px 10px;
    font-family: var(--mono);
    font-size: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .detail-item.present { border-color: var(--success); color: var(--success); }
  .detail-item.missing { border-color: var(--border); color: var(--muted); }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    header { padding: 20px 20px; }
    main { padding: 20px 20px 48px; }
    .card-grid { grid-template-columns: 1fr; }
    .logo { font-size: 18px; }
    .logo small { display: block; margin-left: 0; margin-top: 4px; }
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="main-nav">
  <a href="/home" class="nav-link">Home</a>
  <a href="/admin/nodes" class="nav-link">Nodes</a>
  <a href="/admin/models" class="nav-link">Models</a>
  <a href="/admin/loras" class="nav-link">LoRAs</a>
  <a href="/admin/workflows" class="nav-link active">Workflows</a>
  <a href="/admin/queue" class="nav-link">Queue</a>
  <a href="/admin/history" class="nav-link">History</a>
  <a href="/admin/assets" class="nav-link">Assets</a>
  <a href="/admin/llm" class="nav-link">LLM</a>
  <a href="/admin/settings" class="nav-link"><svg width="13" height="13" viewBox="0 0 512 512" fill="currentColor" style="vertical-align:-1px;"><path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.4-28.2 19-44.1 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.9-6.4-30.7-15-44.1-25.4L83.1 339.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.4 28.2-19 44.1-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.9 6.4 30.7 15 44.1 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/></svg></a>
  <a href="#" class="nav-link nav-activity" id="activityToggle" onclick="event.preventDefault()"><svg width="14" height="14" viewBox="0 0 448 512" fill="currentColor"><path d="M224 0c-17.7 0-32 14.3-32 32V49.9C119.5 61.4 64 124.2 64 200v33.4c0 45.4-15.5 89.5-43.8 124.9L5.3 377c-5.8 7.2-6.9 17.1-2.9 25.4S14.8 416 24 416H424c9.2 0 17.6-5.3 21.6-13.6s2.9-18.2-2.9-25.4l-14.9-18.6C399.5 322.9 384 278.8 384 233.4V200c0-75.8-55.5-138.6-128-150.1V32c0-17.7-14.3-32-32-32zm0 512c26.5 0 48.4-16.2 57.7-38.8c3.4-8.2-1.2-17.5-9.7-20.3c-2-.6-4-.9-6-.9H182c-2 0-4 .3-6 .9c-8.5 2.8-13.1 12.1-9.7 20.3c9.3 22.6 31.2 38.8 57.7 38.8z"/></svg><span class="activity-dot" id="activityDot"></span></a>
  <a href="#" class="nav-link nav-logout" onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>window.location='/login')">Logout</a>
</nav>

<!-- Activity Panel -->
<div class="activity-panel" id="activityPanel">
  <div class="activity-panel-inner">
    <div class="activity-panel-header">
      <span class="activity-panel-title">Activity</span>
      <button class="activity-panel-close" id="activityClose">&times;</button>
    </div>
    <div class="activity-list" id="activityList"></div>
  </div>
</div>

<!-- Confirm Dialog -->
<dialog class="studio-dialog" id="studioDialog">
  <div class="studio-dialog-body" id="studioDialogMsg"></div>
  <div class="studio-dialog-actions">
    <button class="studio-dialog-btn" id="studioDialogNo">Cancel</button>
    <button class="studio-dialog-btn primary" id="studioDialogYes">Confirm</button>
  </div>
</dialog>

<!-- Header -->
<header>
  <div class="logo">ComfyUI <span class="studio-word">Studio<span class="beta-badge">BETA</span></span> <small>Workflow Manager</small></div>
  <div class="header-actions"></div>
</header>

<!-- Main content -->
<main id="mainContent">
  <div class="loading-state" id="loadingState">
    <span class="spinner"></span>
    Loading workflows...
  </div>
  <div class="card-grid" id="cardGrid" style="display:none;"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <p>No workflows found. Click Sync to scan for workflow manifests.</p>
  </div>
</main>

<script>
(function() {
  'use strict';

  // ── State ──
  let workflows = [];


  // ── DOM refs ──
  const $main         = document.getElementById('mainContent');
  const $loading      = document.getElementById('loadingState');
  const $cardGrid     = document.getElementById('cardGrid');
  const $emptyState   = document.getElementById('emptyState');

  // ── Utilities ──
  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function apiFetch(url, opts = {}) {
    if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
      opts.headers = {...(opts.headers||{}), 'Content-Type': 'application/json'};
      opts.body = JSON.stringify(opts.body);
    }
    const resp = await fetch(url, opts);
    if (resp.status === 401) { window.location = '/login'; throw new Error('auth'); }
    return resp;
  }

  // ── Toast + Confirm helpers ──
  var _toastStack = [];
  function _layoutToasts() {
    var top = 24;
    for (var i = _toastStack.length - 1; i >= 0; i--) {
      var t = _toastStack[i];
      if (!t.parentElement) { _toastStack.splice(i, 1); continue; }
      t.style.top = top + 'px';
      top += t.offsetHeight + 8;
    }
  }
  function showToast(msg, duration, type) {
    var toast = document.createElement('div');
    toast.className = 'studio-toast' + (type ? ' ' + type : '');
    toast.innerHTML = msg + '<button class="toast-close" onclick="this.parentElement.remove()">&times;</button>';
    if (duration) {
      var bar = document.createElement('div');
      bar.className = 'toast-bar';
      bar.style.transition = 'transform ' + duration + 'ms linear';
      toast.appendChild(bar);
      requestAnimationFrame(function() { bar.style.transform = 'scaleX(0)'; });
      setTimeout(function() {
        toast.style.opacity = '0';
        setTimeout(function() { toast.remove(); _layoutToasts(); }, 300);
      }, duration);
    }
    _toastStack.push(toast);
    document.body.appendChild(toast);
    _layoutToasts();
    var obs = new MutationObserver(function() { if (!toast.parentElement) { obs.disconnect(); _layoutToasts(); } });
    obs.observe(document.body, { childList: true });
    return toast;
  }

  var _dialogResolve = null;
  function studioConfirm(msg, opts) {
    opts = opts || {};
    return new Promise(function(resolve) {
      var dlg = document.getElementById('studioDialog');
      document.getElementById('studioDialogMsg').textContent = msg;
      var yesBtn = document.getElementById('studioDialogYes');
      var noBtn = document.getElementById('studioDialogNo');
      yesBtn.textContent = opts.yes || 'Confirm';
      yesBtn.className = 'studio-dialog-btn ' + (opts.danger ? 'danger' : 'primary');
      noBtn.textContent = opts.no || 'Cancel';
      _dialogResolve = resolve;
      dlg.showModal();
      yesBtn.onclick = function() { dlg.close(); resolve(true); };
      noBtn.onclick = function() { dlg.close(); resolve(false); };
      dlg.addEventListener('close', function handler() { dlg.removeEventListener('close', handler); resolve(false); });
    });
  }

  // ── Initial load ──
  async function initialLoad() {
    try {
      const resp = await apiFetch('/api/admin/workflows');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const data = await resp.json();
      handleWorkflowData(data);
      $loading.style.display = 'none';
    } catch (e) {
      if (e.message !== 'auth') {
        console.error('Initial load error:', e);
      }
    }
  }

  // ── Data handling ──
  function handleWorkflowData(data) {
    workflows = Array.isArray(data) ? data : (data.workflows || []);
    renderCards();
  }

  function renderCards() {
    $cardGrid.innerHTML = '';

    if (workflows.length === 0) {
      $cardGrid.style.display = 'none';
      $emptyState.style.display = '';
      return;
    }

    $emptyState.style.display = 'none';
    $cardGrid.style.display = '';

    workflows.forEach(wf => {
      $cardGrid.appendChild(createWorkflowCard(wf));
    });
  }

  function createWorkflowCard(wf) {
    const card = document.createElement('div');
    card.className = 'wf-card';

    // Build model/node arrays from the API's status structure
    const ms = wf.models_status || {};
    const ns = wf.nodes_status || {};
    const modelsPresent = ms.present || 0;
    const modelsTotal = ms.total || 0;
    const nodesPresent = ns.installed || 0;
    const nodesTotal = ns.total || 0;

    // Build detail arrays: all required models with present/missing status
    const missingModels = new Set(ms.missing || []);
    const allRequiredModels = (wf.required_models || []).length > 0
      ? wf.required_models
      : [...(ms.missing || [])];
    const models = allRequiredModels.map(f => ({
      name: f,
      status: missingModels.has(f) ? 'missing' : 'present'
    }));

    const missingNodes = new Set(ns.missing || []);
    const allRequiredNodes = (wf.required_nodes || []).length > 0
      ? wf.required_nodes
      : [...(ns.missing || [])];
    const nodes = allRequiredNodes.map(n => ({
      name: n,
      installed: !missingNodes.has(n)
    }));

    const allModelsOk = modelsPresent === modelsTotal;
    const allNodesOk = nodesPresent === nodesTotal;

    if (!allNodesOk) {
      card.classList.add('nodes-missing');
    } else if (!allModelsOk) {
      card.classList.add('models-missing');
    } else {
      card.classList.add('ready');
    }

    const version = wf.version ? 'v' + wf.version : '';
    const date = wf.updated_at || wf.created_at || '';
    const author = wf.author || '';
    const dateStr = date ? date.substring(0, 10) : '';
    const metaParts = [dateStr, author ? 'by ' + author : ''].filter(Boolean).join(' \u00b7 ');
    const desc = wf.description || '';

    // Model dots (max 12 displayed)
    const modelDotsMax = Math.min(modelsTotal, 12);
    let modelDotsHtml = '';
    for (let i = 0; i < modelDotsMax; i++) {
      const filled = i < modelsPresent;
      modelDotsHtml += '<span class="dep-dot ' + (filled ? 'filled' : 'missing-dot') + '"></span>';
    }
    if (modelsTotal > 12) modelDotsHtml += '<span style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:2px;">...</span>';

    // Node dots (max 12 displayed)
    const nodeDotsMax = Math.min(nodesTotal, 12);
    let nodeDotsHtml = '';
    for (let i = 0; i < nodeDotsMax; i++) {
      const filled = i < nodesPresent;
      nodeDotsHtml += '<span class="dep-dot ' + (filled ? 'filled' : 'missing-dot') + '"></span>';
    }
    if (nodesTotal > 12) nodeDotsHtml += '<span style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:2px;">...</span>';

    const modelCountClass = allModelsOk ? 'all-good' : 'has-missing';
    const nodeCountClass = allNodesOk ? 'all-good' : 'has-missing';

    const installBtn = !allModelsOk
      ? '<button class="btn btn--sm dep-action" data-install="' + escHtml(wf.id) + '">Install Missing</button>'
      : '';

    card.innerHTML =
      '<div class="wf-card-top">' +
        '<div class="wf-card-info">' +
          (wf.category ? '<span class="wf-badge ' + escHtml(wf.category) + '">' + escHtml(wf.category) + '</span>' : '') +
          '<div class="wf-card-name" style="display:inline;">' + escHtml(wf.name || wf.id) + '</div>' +
          '<div class="wf-card-meta">' + escHtml(metaParts) + '</div>' +
        '</div>' +
        (version ? '<span class="wf-card-version">' + escHtml(version) + '</span>' : '') +
      '</div>' +
      (desc ? '<div class="wf-card-desc">' + escHtml(desc) + '</div>' : '') +
      '<div class="wf-deps">' +
        '<div class="dep-row">' +
          '<span class="dep-label">Models</span>' +
          '<span class="dep-count ' + modelCountClass + '">' + modelsPresent + '/' + modelsTotal + '</span>' +
          installBtn +
        '</div>' +
        '<div class="dep-row">' +
          '<span class="dep-label">Nodes</span>' +
          '<span class="dep-count ' + nodeCountClass + '">' + nodesPresent + '/' + nodesTotal + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="wf-card-actions">' +
        '<button class="btn btn--sm" data-run="' + escHtml(wf.id) + '"' + ((!allModelsOk || !allNodesOk) ? ' disabled title="All dependencies must be installed"' : '') + '">&#9654; Run</button>' +
        '<button class="btn btn--sm" data-details="' + escHtml(wf.id) + '" style="border-color:var(--border);color:var(--muted);">Details</button>' +
      '</div>' +
      '<div class="wf-details" data-details-panel="' + escHtml(wf.id) + '">' +
        buildDetailSection('Models', models) +
        buildDetailSection('Nodes', nodes) +
      '</div>' +
      '<span class="wf-type-badge ' + (wf.type === 'dynamic' ? 'dynamic' : 'static') + '">' + (wf.type === 'dynamic' ? 'Dynamic' : 'Static') + '</span>';

    // Event: Install Missing
    const installBtnEl = card.querySelector('[data-install]');
    if (installBtnEl) {
      installBtnEl.addEventListener('click', () => installMissingModels(wf.id, installBtnEl));
    }

    // Event: Run
    const runBtnEl = card.querySelector('[data-run]');
    runBtnEl.addEventListener('click', () => {
      window.location.href = '/run/' + encodeURIComponent(wf.id);
    });

    // Event: Details toggle
    const detailsBtnEl = card.querySelector('[data-details]');
    const detailsPanel = card.querySelector('[data-details-panel]');
    detailsBtnEl.addEventListener('click', (e) => {
      e.stopPropagation();
      const isVisible = detailsPanel.classList.contains('visible');
      detailsPanel.classList.toggle('visible');
      detailsBtnEl.textContent = isVisible ? 'Details' : 'Hide';
    });
    detailsPanel.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    return card;
  }

  function buildDetailSection(title, items) {
    if (!items || items.length === 0) return '';
    const itemsHtml = items.map(item => {
      const name = item.name || item.file || item.class_name || item.id || 'unknown';
      const isPresent = item.status === 'present' || item.installed;
      return '<span class="detail-item ' + (isPresent ? 'present' : 'missing') + '">' + escHtml(name) + '</span>';
    }).join('');
    return '<div>' +
      '<div class="detail-section-title">' + escHtml(title) + '</div>' +
      '<div class="detail-list">' + itemsHtml + '</div>' +
    '</div>';
  }

  // ── Actions ──
  async function installMissingModels(workflowId, btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm"></span> Installing...';
    try {
      const resp = await apiFetch('/api/admin/workflows/' + encodeURIComponent(workflowId) + '/install-models', {
        method: 'POST'
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showToast('Install error: ' + (err.detail || err.error || resp.status), 5000, 'error');
        btn.disabled = false;
        btn.textContent = 'Install Missing';
      } else {
        btn.textContent = 'Queued';
      }
    } catch (e) {
      if (e.message !== 'auth') {
        showToast('Error: ' + e.message, 5000, 'error');
        btn.disabled = false;
        btn.textContent = 'Install Missing';
      }
    }
  }



  // ── Activity Panel ──
  var $actPanel = document.getElementById('activityPanel');
  var $actList = document.getElementById('activityList');
  var $actDot = document.getElementById('activityDot');
  var _actOpen = false;
  var _actWs = null;

  function escHtmlAct(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function renderEvent(evt) {
    var ts = (evt.timestamp || '').substring(11, 19);
    return '<div class="activity-item">' +
      '<span class="activity-severity ' + (evt.severity || 'info') + '"></span>' +
      '<span class="activity-time">' + ts + '</span>' +
      '<span class="activity-msg">' + escHtmlAct(evt.message || '') + '</span>' +
    '</div>';
  }

  async function loadActivityHistory() {
    try {
      var resp = await fetch('/api/admin/events?limit=50', {credentials: 'include'});
      if (!resp.ok) return;
      var events = await resp.json();
      if (!events.length) {
        $actList.innerHTML = '<div class="activity-empty">No activity yet</div>';
        return;
      }
      $actList.innerHTML = events.map(renderEvent).join('');
      $actList.scrollTop = $actList.scrollHeight;
    } catch (_) {}
  }

  function connectActivityWS() {
    if (_actWs && _actWs.readyState <= 1) return;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    _actWs = new WebSocket(proto + '//' + location.host + '/api/run/ws');
    _actWs.onopen = function() { $actDot.classList.add('connected'); };
    _actWs.onmessage = function(e) {
      if (typeof e.data !== 'string') return;
      try {
        var msg = JSON.parse(e.data);
        if (!msg.type || msg.type.indexOf('.') < 0) return;
        if (_actOpen) {
          $actList.insertAdjacentHTML('beforeend', renderEvent(msg));
          $actList.scrollTop = $actList.scrollHeight;
        } else {
          $actDot.classList.add('has-new');
        }
      } catch (_) {}
    };
    _actWs.onclose = function() { _actWs = null; $actDot.classList.remove('connected'); setTimeout(connectActivityWS, 3000); };
  }

  document.getElementById('activityToggle').addEventListener('click', function() {
    _actOpen = !_actOpen;
    $actPanel.classList.toggle('open', _actOpen);
    $actDot.classList.remove('has-new');
    if (_actOpen) loadActivityHistory();
  });
  document.getElementById('activityClose').addEventListener('click', function() {
    _actOpen = false;
    $actPanel.classList.remove('open');
  });
  document.addEventListener('click', function(e) {
    if (_actOpen && !$actPanel.contains(e.target) && !document.getElementById('activityToggle').contains(e.target)) {
      _actOpen = false;
      $actPanel.classList.remove('open');
    }
  });

  connectActivityWS();

  // ── Boot ──
  initialLoad();

})();
</script>
</body>
</html>
