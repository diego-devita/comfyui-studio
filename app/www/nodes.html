<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Studio — Node Manager</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  /* ── Header ── */
  header {
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: var(--display);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    line-height: 1;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }
  .logo small {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-left: 14px;
    font-weight: 400;
  }
  .header-actions { display: flex; gap: 12px; align-items: center; }

  /* ── Main ── */
  main { padding: 32px 40px 64px; }

  /* ── Search Bar ── */
  .search-bar {
    margin-bottom: 24px;
  }
  .search-bar .search-input {
    width: 100%;
  }

  /* ── Package Card ── */
  .pkg-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .pkg-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 20px 24px;
    transition: border-color 0.25s ease;
  }
  .pkg-card:hover {
    border-color: #3a3a4a;
  }

  .pkg-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
  }
  .pkg-header-left {
    flex: 1;
    min-width: 0;
  }

  .pkg-name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    line-height: 1.3;
    word-break: break-word;
  }
  .pkg-name.core { color: var(--accent); }

  .pkg-url {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    word-break: break-all;
  }
  .pkg-url:hover { color: var(--text); }

  .pkg-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .pkg-chevron {
    font-size: 12px;
    color: var(--muted);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .pkg-chevron.open { transform: rotate(90deg); }

  /* ── Node List ── */
  .pkg-nodes {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .pkg-nodes.visible { display: flex; }

  .node-pill {
    padding: 3px 12px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.3px;
    border-radius: 12px;
    background: #1e1e2e;
    color: var(--muted);
    border: 1px solid var(--border);
    transition: all 0.15s;
  }
  .node-pill.highlight {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232, 255, 71, 0.06);
  }
  .node-pill.search-match {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(232, 255, 71, 0.08);
  }

  /* ── Install Modal ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 15, 0.9);
    z-index: 5000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.hidden { display: none; }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 32px;
    width: 480px;
    max-width: 90vw;
  }
  .modal-box h3 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 8px;
  }
  .modal-box p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .modal-box label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .modal-input {
    display: block;
    width: 100%;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-input::placeholder { color: var(--muted); }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .modal-error {
    color: var(--error);
    font-size: 12px;
    margin-bottom: 12px;
    display: none;
  }

  /* ── Restart Banner ── */
  .restart-banner {
    display: none;
    background: rgba(232, 255, 71, 0.08);
    border: 1px solid var(--accent);
    border-radius: var(--radius-card);
    padding: 14px 20px;
    margin-bottom: 24px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    align-items: center;
    gap: 10px;
  }
  .restart-banner.visible { display: flex; }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    header { padding: 20px 20px; }
    main { padding: 20px 20px 48px; }
    .logo { font-size: 18px; }
    .logo small { display: block; margin-left: 0; margin-top: 4px; }
  }
</style>
</head>
<body>

<!-- Install Custom Node Modal -->
<div class="modal-overlay hidden" id="installModal">
  <div class="modal-box">
    <h3>Install Custom Node</h3>
    <p>Enter the Git repository URL for the custom node package.</p>
    <label for="repoUrl">Repository URL</label>
    <input type="text" class="modal-input" id="repoUrl" placeholder="https://github.com/user/ComfyUI-CustomNode">
    <div class="modal-error" id="installError"></div>
    <div class="modal-actions">
      <button class="btn" id="cancelInstallBtn" style="border-color:var(--border);color:var(--muted);">Cancel</button>
      <button class="btn" id="confirmInstallBtn">Install</button>
    </div>
  </div>
</div>

<!-- Navigation -->
<nav class="main-nav">
  <a href="/home" class="nav-link">Home</a>
  <a href="/admin/nodes" class="nav-link active">Nodes</a>
  <a href="/admin/models" class="nav-link">Models</a>
  <a href="/admin/loras" class="nav-link">LoRAs</a>
  <a href="/admin/workflows" class="nav-link">Workflows</a>
  <a href="/admin/queue" class="nav-link">Queue</a>
  <a href="/admin/history" class="nav-link">History</a>
  <a href="/admin/assets" class="nav-link">Assets</a>
  <span class="nav-activity" id="activityToggle" title="Activity"><svg width="14" height="14" viewBox="0 0 448 512" fill="currentColor"><path d="M224 0c-17.7 0-32 14.3-32 32V49.9C119.5 61.4 64 124.2 64 200v33.4c0 45.4-15.5 89.5-43.8 124.9L5.3 377c-5.8 7.2-6.9 17.1-2.9 25.4S14.8 416 24 416H424c9.2 0 17.6-5.3 21.6-13.6s2.9-18.2-2.9-25.4l-14.9-18.6C399.5 322.9 384 278.8 384 233.4V200c0-75.8-55.5-138.6-128-150.1V32c0-17.7-14.3-32-32-32zm0 512c26.5 0 48.4-16.2 57.7-38.8c3.4-8.2-1.2-17.5-9.7-20.3c-2-.6-4-.9-6-.9H182c-2 0-4 .3-6 .9c-8.5 2.8-13.1 12.1-9.7 20.3c9.3 22.6 31.2 38.8 57.7 38.8z"/></svg><span class="activity-dot" id="activityDot"></span></span>
  <a href="#" class="nav-link nav-logout" onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>window.location='/login')">Logout</a>
</nav>

<!-- Activity Panel -->
<div class="activity-panel" id="activityPanel">
  <div class="activity-panel-inner">
    <div class="activity-panel-header">
      <span class="activity-panel-title">Activity</span>
      <button class="activity-panel-close" id="activityClose">&times;</button>
    </div>
    <div class="activity-list" id="activityList"></div>
  </div>
</div>

<!-- Header -->
<header>
  <div class="logo">ComfyUI <span class="studio-word">Studio<span class="beta-badge">BETA</span></span> <small>Node Manager</small></div>
  <div class="header-actions">
    <button class="btn" id="installNodeBtn">Install Custom Node</button>
  </div>
</header>

<!-- Main content -->
<main id="mainContent">
  <div class="restart-banner" id="restartBanner">
    A restart of ComfyUI is required for newly installed nodes to take effect.
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="Search nodes...">
  </div>

  <div class="loading-state" id="loadingState">
    <span class="spinner"></span>
    Loading nodes...
  </div>

  <div class="pkg-list" id="pkgList" style="display:none;"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <p>No node packages found.</p>
  </div>
</main>

<script>
(function() {
  'use strict';

  // ── State ──
  let packages = [];
  let searchQuery = '';

  // ── DOM refs ──
  const $loading      = document.getElementById('loadingState');
  const $pkgList      = document.getElementById('pkgList');
  const $emptyState   = document.getElementById('emptyState');
  const $searchInput  = document.getElementById('searchInput');
  const $installNodeBtn = document.getElementById('installNodeBtn');
  const $installModal = document.getElementById('installModal');
  const $repoUrl      = document.getElementById('repoUrl');
  const $installError = document.getElementById('installError');
  const $cancelInstallBtn = document.getElementById('cancelInstallBtn');
  const $confirmInstallBtn = document.getElementById('confirmInstallBtn');
  const $restartBanner = document.getElementById('restartBanner');

  // ── Utilities ──
  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function apiFetch(url, opts = {}) {
    if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
      opts.headers = {...(opts.headers||{}), 'Content-Type': 'application/json'};
      opts.body = JSON.stringify(opts.body);
    }
    const resp = await fetch(url, opts);
    if (resp.status === 401) { window.location = '/login'; throw new Error('auth'); }
    return resp;
  }

  // ── Initial load ──
  async function initialLoad() {
    try {
      const resp = await apiFetch('/api/admin/nodes');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const data = await resp.json();
      handleNodeData(data);
      $loading.style.display = 'none';
    } catch (e) {
      if (e.message !== 'auth') {
        console.error('Initial load error:', e);
      }
    }
  }

  // ── Data handling ──
  function handleNodeData(data) {
    packages = Array.isArray(data) ? data : (data.packages || []);
    // Sort: core first, then alphabetical
    packages.sort((a, b) => {
      const aCore = (a.name || '').toLowerCase().includes('comfyui core') || a.is_core;
      const bCore = (b.name || '').toLowerCase().includes('comfyui core') || b.is_core;
      if (aCore && !bCore) return -1;
      if (!aCore && bCore) return 1;
      return (a.name || '').localeCompare(b.name || '');
    });
    renderPackages();
  }

  function renderPackages() {
    $pkgList.innerHTML = '';

    const filteredPackages = getFilteredPackages();

    if (filteredPackages.length === 0) {
      $pkgList.style.display = 'none';
      $emptyState.style.display = '';
      $emptyState.querySelector('p').textContent = searchQuery
        ? 'No nodes matching "' + searchQuery + '".'
        : 'No node packages found.';
      return;
    }

    $emptyState.style.display = 'none';
    $pkgList.style.display = '';

    filteredPackages.forEach(entry => {
      $pkgList.appendChild(createPackageCard(entry.pkg, entry.matchingNodes));
    });
  }

  function getFilteredPackages() {
    if (!searchQuery) {
      return packages.map(pkg => ({ pkg, matchingNodes: null }));
    }
    const results = [];
    for (const pkg of packages) {
      const nodes = pkg.nodes || [];
      const matchingNodes = nodes.filter(n => {
        const name = (typeof n === 'string' ? n : (n.name || n.class_name || '')).toLowerCase();
        return name.includes(searchQuery);
      });
      const pkgNameMatch = (pkg.name || '').toLowerCase().includes(searchQuery);
      if (matchingNodes.length > 0 || pkgNameMatch) {
        results.push({ pkg, matchingNodes: matchingNodes.length > 0 ? matchingNodes : null });
      }
    }
    return results;
  }

  function createPackageCard(pkg, matchingNodes) {
    const card = document.createElement('div');
    card.className = 'pkg-card';

    const nodes = pkg.nodes || [];
    const nodeCount = nodes.length;
    const isCore = (pkg.name || '').toLowerCase().includes('comfyui core') || pkg.is_core;
    const repoUrl = pkg.url || pkg.repo_url || '';

    const nameClass = isCore ? 'pkg-name core' : 'pkg-name';

    card.innerHTML =
      '<div class="pkg-header">' +
        '<div class="pkg-header-left">' +
          '<div class="' + nameClass + '">' + escHtml(pkg.name || pkg.id || 'Unknown Package') + '</div>' +
          (repoUrl ? '<a class="pkg-url" href="' + escHtml(repoUrl) + '" target="_blank" rel="noopener" onclick="event.stopPropagation();">' + escHtml(repoUrl) + '</a>' : '') +
        '</div>' +
        '<span class="pkg-count">' + nodeCount + ' node' + (nodeCount !== 1 ? 's' : '') + '</span>' +
        '<span class="pkg-chevron">&#9654;</span>' +
      '</div>' +
      '<div class="pkg-nodes">' +
        buildNodePills(nodes, matchingNodes) +
      '</div>';

    const header = card.querySelector('.pkg-header');
    const nodesPanel = card.querySelector('.pkg-nodes');
    const chevron = card.querySelector('.pkg-chevron');

    // Auto-expand if there are search matches
    if (matchingNodes && matchingNodes.length > 0) {
      nodesPanel.classList.add('visible');
      chevron.classList.add('open');
    }

    header.addEventListener('click', () => {
      const isVisible = nodesPanel.classList.contains('visible');
      nodesPanel.classList.toggle('visible');
      chevron.classList.toggle('open');
    });

    return card;
  }

  function buildNodePills(nodes, matchingNodes) {
    const matchSet = matchingNodes ? new Set(matchingNodes.map(n => typeof n === 'string' ? n : (n.name || n.class_name))) : null;
    return nodes.map(n => {
      const name = typeof n === 'string' ? n : (n.name || n.class_name || 'unknown');
      const isMatch = matchSet && matchSet.has(name);
      const cls = isMatch ? 'node-pill search-match' : 'node-pill';
      return '<span class="' + cls + '">' + escHtml(name) + '</span>';
    }).join('');
  }

  // ── Search ──
  $searchInput.addEventListener('input', () => {
    searchQuery = $searchInput.value.trim().toLowerCase();
    renderPackages();
  });

  // ── Install Custom Node ──
  $installNodeBtn.addEventListener('click', () => {
    $installModal.classList.remove('hidden');
    $repoUrl.value = '';
    $installError.style.display = 'none';
    $repoUrl.focus();
  });

  $cancelInstallBtn.addEventListener('click', () => {
    $installModal.classList.add('hidden');
  });

  $installModal.addEventListener('click', (e) => {
    if (e.target === $installModal) {
      $installModal.classList.add('hidden');
    }
  });

  $repoUrl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doInstall();
  });

  $confirmInstallBtn.addEventListener('click', doInstall);

  async function doInstall() {
    const url = $repoUrl.value.trim();
    if (!url) {
      $installError.textContent = 'Please enter a repository URL.';
      $installError.style.display = 'block';
      return;
    }

    $confirmInstallBtn.disabled = true;
    $confirmInstallBtn.innerHTML = '<span class="spinner sm"></span> Installing...';
    $installError.style.display = 'none';

    try {
      const resp = await apiFetch('/api/admin/nodes/install', {
        method: 'POST',
        body: { url: url }
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        $installError.textContent = err.detail || err.error || 'Install failed (HTTP ' + resp.status + ')';
        $installError.style.display = 'block';
        $confirmInstallBtn.disabled = false;
        $confirmInstallBtn.textContent = 'Install';
        return;
      }

      $installModal.classList.add('hidden');
      $confirmInstallBtn.disabled = false;
      $confirmInstallBtn.textContent = 'Install';

      // Show restart banner
      $restartBanner.classList.add('visible');

      // Refresh node list
      try {
        const nodesResp = await apiFetch('/api/admin/nodes');
        if (nodesResp.ok) {
          const data = await nodesResp.json();
          handleNodeData(data);
        }
      } catch (_) { /* ignore refresh error */ }

    } catch (e) {
      if (e.message !== 'auth') {
        $installError.textContent = 'Error: ' + e.message;
        $installError.style.display = 'block';
      }
      $confirmInstallBtn.disabled = false;
      $confirmInstallBtn.textContent = 'Install';
    }
  }

  // ── Activity Panel ──
  var $actPanel = document.getElementById('activityPanel');
  var $actList = document.getElementById('activityList');
  var $actDot = document.getElementById('activityDot');
  var _actOpen = false;
  var _actWs = null;

  function escHtmlAct(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function renderEvent(evt) {
    var ts = (evt.timestamp || '').substring(11, 19);
    return '<div class="activity-item">' +
      '<span class="activity-severity ' + (evt.severity || 'info') + '"></span>' +
      '<span class="activity-time">' + ts + '</span>' +
      '<span class="activity-msg">' + escHtmlAct(evt.message || '') + '</span>' +
    '</div>';
  }

  async function loadActivityHistory() {
    try {
      var resp = await fetch('/api/admin/events?limit=50', {credentials: 'include'});
      if (!resp.ok) return;
      var events = await resp.json();
      if (!events.length) {
        $actList.innerHTML = '<div class="activity-empty">No activity yet</div>';
        return;
      }
      $actList.innerHTML = events.map(renderEvent).join('');
      $actList.scrollTop = $actList.scrollHeight;
    } catch (_) {}
  }

  function connectActivityWS() {
    if (_actWs && _actWs.readyState <= 1) return;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    _actWs = new WebSocket(proto + '//' + location.host + '/api/run/ws');
    _actWs.onmessage = function(e) {
      if (typeof e.data !== 'string') return;
      try {
        var msg = JSON.parse(e.data);
        if (!msg.type || msg.type.indexOf('.') < 0) return;
        if (_actOpen) {
          $actList.insertAdjacentHTML('beforeend', renderEvent(msg));
          $actList.scrollTop = $actList.scrollHeight;
        } else {
          $actDot.classList.add('has-new');
        }
      } catch (_) {}
    };
    _actWs.onclose = function() { _actWs = null; setTimeout(connectActivityWS, 3000); };
  }

  document.getElementById('activityToggle').addEventListener('click', function() {
    _actOpen = !_actOpen;
    $actPanel.classList.toggle('open', _actOpen);
    $actDot.classList.remove('has-new');
    if (_actOpen) loadActivityHistory();
  });
  document.getElementById('activityClose').addEventListener('click', function() {
    _actOpen = false;
    $actPanel.classList.remove('open');
  });
  document.addEventListener('click', function(e) {
    if (_actOpen && !$actPanel.contains(e.target) && !document.getElementById('activityToggle').contains(e.target)) {
      _actOpen = false;
      $actPanel.classList.remove('open');
    }
  });

  connectActivityWS();

  // ── Boot ──
  initialLoad();

})();
</script>
</body>
</html>
