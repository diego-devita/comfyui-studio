<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Studio — Settings</title>
<!-- Icons: Font Awesome Free (fontawesome.com) · CC BY 4.0 -->
<link rel="stylesheet" href="/static/styles.css">
<style>
  header {
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: var(--display);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    line-height: 1;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); }
  .logo small {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-left: 14px;
    font-weight: 400;
  }

  main { padding: 32px 40px 64px; max-width: 800px; margin: 0 auto; }

  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .env-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    overflow: hidden;
    margin-bottom: 32px;
  }
  .env-table th,
  .env-table td {
    padding: 10px 16px;
    text-align: left;
    font-family: var(--mono);
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  .env-table th {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(20, 20, 32, 0.8);
  }
  .env-table tr:last-child td { border-bottom: none; }
  .env-key { color: var(--text); font-weight: 700; }
  .env-value { color: var(--text); word-break: break-all; }
  .env-value.masked { color: var(--muted); }
  .env-value.not-set { color: var(--muted); font-style: italic; }
  .env-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
  }
  .env-dot.set { background: var(--success); }
  .env-dot.unset { background: var(--muted); }
</style>
</head>
<body>

<nav class="main-nav">
  <a href="/home" class="nav-link">Home</a>
  <a href="/admin/nodes" class="nav-link">Nodes</a>
  <a href="/admin/models" class="nav-link">Models</a>
  <a href="/admin/loras" class="nav-link">LoRAs</a>
  <a href="/admin/workflows" class="nav-link">Workflows</a>
  <a href="/admin/queue" class="nav-link">Queue</a>
  <a href="/admin/history" class="nav-link">History</a>
  <a href="/admin/assets" class="nav-link">Assets</a>
  <a href="/admin/settings" class="nav-link active"><svg width="13" height="13" viewBox="0 0 512 512" fill="currentColor" style="vertical-align:-1px;"><path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.4-28.2 19-44.1 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.9-6.4-30.7-15-44.1-25.4L83.1 339.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.4 28.2-19 44.1-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.9 6.4 30.7 15 44.1 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/></svg></a>
  <a href="#" class="nav-link nav-activity" id="activityToggle" onclick="event.preventDefault()"><svg width="14" height="14" viewBox="0 0 448 512" fill="currentColor"><path d="M224 0c-17.7 0-32 14.3-32 32V49.9C119.5 61.4 64 124.2 64 200v33.4c0 45.4-15.5 89.5-43.8 124.9L5.3 377c-5.8 7.2-6.9 17.1-2.9 25.4S14.8 416 24 416H424c9.2 0 17.6-5.3 21.6-13.6s2.9-18.2-2.9-25.4l-14.9-18.6C399.5 322.9 384 278.8 384 233.4V200c0-75.8-55.5-138.6-128-150.1V32c0-17.7-14.3-32-32-32zm0 512c26.5 0 48.4-16.2 57.7-38.8c3.4-8.2-1.2-17.5-9.7-20.3c-2-.6-4-.9-6-.9H182c-2 0-4 .3-6 .9c-8.5 2.8-13.1 12.1-9.7 20.3c9.3 22.6 31.2 38.8 57.7 38.8z"/></svg><span class="activity-dot" id="activityDot"></span></a>
  <a href="#" class="nav-link nav-logout" onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>window.location='/login')">Logout</a>
</nav>

<!-- Activity Panel -->
<div class="activity-panel" id="activityPanel">
  <div class="activity-panel-inner">
    <div class="activity-panel-header">
      <span class="activity-panel-title">Activity</span>
      <button class="activity-panel-close" id="activityClose">&times;</button>
    </div>
    <div class="activity-list" id="activityList"></div>
  </div>
</div>

<!-- Confirm Dialog -->
<dialog class="studio-dialog" id="studioDialog">
  <div class="studio-dialog-body" id="studioDialogMsg"></div>
  <div class="studio-dialog-actions">
    <button class="studio-dialog-btn" id="studioDialogNo">Cancel</button>
    <button class="studio-dialog-btn primary" id="studioDialogYes">Confirm</button>
  </div>
</dialog>

<header>
  <div class="logo">ComfyUI <span class="studio-word">Studio<span class="beta-badge">BETA</span></span> <small>Settings</small></div>
</header>

<main>
  <div class="section-title">Environment Variables</div>
  <table class="env-table" id="envTable">
    <thead>
      <tr>
        <th>Variable</th>
        <th>Value</th>
      </tr>
    </thead>
    <tbody id="envBody">
      <tr><td colspan="2" style="color:var(--muted);">Loading...</td></tr>
    </tbody>
  </table>
</main>

<script>
(function() {
  'use strict';

  function apiFetch(url, opts) {
    opts = opts || {};
    opts.credentials = 'include';
    return fetch(url, opts).then(function(r) {
      if (r.status === 401 || r.status === 403) { window.location = '/login'; throw new Error('auth'); }
      return r;
    });
  }

  function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ── Toast + Confirm helpers ──
  var _toastStack = [];
  function _layoutToasts() {
    var top = 24;
    for (var i = _toastStack.length - 1; i >= 0; i--) {
      var t = _toastStack[i];
      if (!t.parentElement) { _toastStack.splice(i, 1); continue; }
      t.style.top = top + 'px';
      top += t.offsetHeight + 8;
    }
  }
  function showToast(msg, duration, type) {
    var toast = document.createElement('div');
    toast.className = 'studio-toast' + (type ? ' ' + type : '');
    toast.innerHTML = msg + '<button class="toast-close" onclick="this.parentElement.remove()">&times;</button>';
    if (duration) {
      var bar = document.createElement('div');
      bar.className = 'toast-bar';
      bar.style.transition = 'transform ' + duration + 'ms linear';
      toast.appendChild(bar);
      requestAnimationFrame(function() { bar.style.transform = 'scaleX(0)'; });
      setTimeout(function() { toast.style.opacity = '0'; setTimeout(function() { toast.remove(); _layoutToasts(); }, 300); }, duration);
    }
    _toastStack.push(toast);
    document.body.appendChild(toast);
    _layoutToasts();
    return toast;
  }

  // ── Load env vars ──
  var $envBody = document.getElementById('envBody');

  async function loadEnv() {
    try {
      var resp = await apiFetch('/api/admin/settings/env');
      if (!resp.ok) return;
      var vars = await resp.json();
      $envBody.innerHTML = '';
      vars.forEach(function(v) {
        var row = document.createElement('tr');
        var valClass = !v.set ? 'env-value not-set' : (v.sensitive ? 'env-value masked' : 'env-value');
        var valText = !v.set ? '(not set)' : v.value;
        var dotClass = v.set ? 'env-dot set' : 'env-dot unset';
        row.innerHTML =
          '<td><span class="' + dotClass + '"></span><span class="env-key">' + escHtml(v.key) + '</span></td>' +
          '<td class="' + valClass + '">' + escHtml(valText) + '</td>';
        $envBody.appendChild(row);
      });
    } catch (e) {
      if (e.message !== 'auth') $envBody.innerHTML = '<tr><td colspan="2" style="color:var(--error);">Failed to load</td></tr>';
    }
  }

  // ── Activity Panel ──
  var $actPanel = document.getElementById('activityPanel');
  var $actList = document.getElementById('activityList');
  var $actDot = document.getElementById('activityDot');
  var _actOpen = false;
  var _actWs = null;

  function escHtmlAct(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function renderEvent(evt) {
    var ts = (evt.timestamp || '').substring(11, 19);
    return '<div class="activity-item">' +
      '<span class="activity-severity ' + (evt.severity || 'info') + '"></span>' +
      '<span class="activity-time">' + ts + '</span>' +
      '<span class="activity-msg">' + escHtmlAct(evt.message || '') + '</span>' +
    '</div>';
  }

  async function loadActivityHistory() {
    try {
      var resp = await fetch('/api/admin/events?limit=50', {credentials: 'include'});
      if (!resp.ok) return;
      var events = await resp.json();
      if (!events.length) {
        $actList.innerHTML = '<div class="activity-empty">No activity yet</div>';
        return;
      }
      $actList.innerHTML = events.map(renderEvent).join('');
      $actList.scrollTop = $actList.scrollHeight;
    } catch (_) {}
  }

  function connectActivityWS() {
    if (_actWs && _actWs.readyState <= 1) return;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    _actWs = new WebSocket(proto + '//' + location.host + '/api/run/ws');
    _actWs.onopen = function() { $actDot.classList.add('connected'); };
    _actWs.onmessage = function(e) {
      if (typeof e.data !== 'string') return;
      try {
        var msg = JSON.parse(e.data);
        if (!msg.type || msg.type.indexOf('.') < 0) return;
        if (_actOpen) {
          $actList.insertAdjacentHTML('beforeend', renderEvent(msg));
          $actList.scrollTop = $actList.scrollHeight;
        } else {
          $actDot.classList.add('has-new');
        }
      } catch (_) {}
    };
    _actWs.onclose = function() { _actWs = null; $actDot.classList.remove('connected'); setTimeout(connectActivityWS, 3000); };
  }

  document.getElementById('activityToggle').addEventListener('click', function() {
    _actOpen = !_actOpen;
    $actPanel.classList.toggle('open', _actOpen);
    $actDot.classList.remove('has-new');
    if (_actOpen) loadActivityHistory();
  });
  document.getElementById('activityClose').addEventListener('click', function() {
    _actOpen = false;
    $actPanel.classList.remove('open');
  });
  document.addEventListener('click', function(e) {
    if (_actOpen && !$actPanel.contains(e.target) && !document.getElementById('activityToggle').contains(e.target)) {
      _actOpen = false;
      $actPanel.classList.remove('open');
    }
  });

  connectActivityWS();

  // ── Boot ──
  loadEnv();
})();
</script>
</body>
</html>
