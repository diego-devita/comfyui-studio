id: wan22-svi-dynamic
category: i2v
name: "WAN 2.2 SVI Pro Multi-Scene"
version: 9
date: "2026-03-23 01:40"
type: dynamic
description: "Multi-scene I2V using SVI Pro technique. Configurable scene count, per-scene prompts, durations and seeds, LoRA picker. GGUF Q8 models, LightX2V + SVI Pro LoRAs, RIFE 2x interpolation to 32fps."
author: ""

base_model: "wan-i2v-14b"

blocks_dir: "blocks"

pipeline:
  - block: setup
    file: "setup.json"
  - block: scene_first
    file: "scene_first.json"
    repeat: 1
  - block: scene_extend
    file: "scene_extend.json"
    repeat_variable: "extra_scenes"
  - block: output
    file: "output.json"

connections:
  setup_to_scenes:
    model_high: "setup.model_high"
    model_low: "setup.model_low"
    clip: "setup.clip"
    vae: "setup.vae"
    sampler: "setup.sampler"
    sigmas_high: "setup.sigmas_high"
    sigmas_low: "setup.sigmas_low"
    anchor_samples: "setup.anchor_samples"
  scene_chain:
    prev_samples: "prev_scene.samples"
    prev_images: "prev_scene.images"
  last_scene_to_output:
    final_images: "last_scene.images"

defaults:
  negative_prompt: "Overexposure, static, blurred details, subtitles, paintings, pictures, still, overall gray, worst quality, low quality, JPEG compression residue, ugly, mutilated, redundant fingers, poorly painted hands, poorly painted faces, deformed, disfigured, deformed limbs, fused fingers, cluttered background, three legs, a lot of people in the background, upside down"
  steps: 6
  split_step: 3
  lora_accelerator: "Wan21_I2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors"
  lora_accelerator_strength_high: 3
  lora_accelerator_strength_low: 1.5

inputs:
  - id: input_image
    name: "Input Image"
    type: image
    required: true
    tooltip: "The first frame that starts your multi-scene video. Each subsequent scene continues from the last frame of the previous one, so this image sets the visual foundation for the entire sequence."

  - id: scenes
    name: "Scenes"
    type: scene_list
    tooltip: "Build your video scene by scene. Each scene generates a clip that continues from where the previous one ended — the last frame becomes the next scene's input. Add scenes to create longer, multi-part narratives with different actions or camera angles."
    per_scene:
      - id: prompt
        name: "Prompt"
        type: text
        required: true
        tooltip: "Describe the motion for this specific scene. Each scene gets its own prompt, so you can change the action between scenes (e.g. scene 1: 'she walks forward', scene 2: 'she turns and smiles'). Focus on what changes, not what stays the same."
      - id: duration
        name: "Duration (seconds)"
        type: select
        options:
          - {label: "3 seconds", value: 3}
          - {label: "5 seconds", value: 5}
          - {label: "6 seconds", value: 6}
          - {label: "8 seconds", value: 8}
          - {label: "10 seconds", value: 10}
        default: 5
        tooltip: "Length of this individual scene clip. SVI Pro blends scenes with overlap frames for smooth transitions. Shorter scenes (3-5s) keep the motion coherent; longer scenes (8-10s) allow more complex actions."
      - id: seed
        name: "Seed"
        type: seed
        default: -1
        tooltip: "Seed for this specific scene. Use -1 for random. Setting different seeds per scene varies the motion style; using the same seed across scenes creates more consistent movement patterns."

  - id: loras
    name: "LoRAs"
    type: lora_picker
    base_model: "wan-i2v-14b"
    max_loras: 3
    tooltip: "Select up to 3 LoRA pairs compatible with WAN I2V 14B. LoRAs come in high/low noise pairs — both are applied automatically at different sampling stages. The LightX2V accelerator LoRA is always included; pick additional style or motion LoRAs here."

outputs:
  - id: video
    name: "Output Video"
    type: video

required_models:
  - "wan2.2_i2v_high_noise_14B_Q8_0.gguf"
  - "wan2.2_i2v_low_noise_14B_Q8_0.gguf"
  - "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
  - "wanvideo/Wan2_1_VAE_bf16.safetensors"
  - "Wan21_I2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors"
  - "SVI_v2_PRO_Wan2.2-I2V-A14B_HIGH_lora_rank_128_fp16.safetensors"
  - "SVI_v2_PRO_Wan2.2-I2V-A14B_LOW_lora_rank_128_fp16.safetensors"

required_nodes:
  - "CLIPLoader"
  - "VAELoader"
  - "VAEEncode"
  - "VAEDecode"
  - "LoadImage"
  - "CLIPTextEncode"
  - "UnetLoaderGGUF"
  - "wanBlockSwap"
  - "Power Lora Loader (rgthree)"
  - "ModelSamplingSD3"
  - "BasicScheduler"
  - "KSamplerSelect"
  - "SplitSigmas"
  - "SamplerCustomAdvanced"
  - "ScheduledCFGGuidance"
  - "DisableNoise"
  - "RandomNoise"
  - "WanImageToVideoSVIPro"
  - "ImageBatchExtendWithOverlap"
  - "ImageScaleToTotalPixels"
  - "RIFE VFI"
  - "VHS_VideoCombine"
