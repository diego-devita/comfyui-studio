id: wan22-i2v-fp8
category: i2v
name: "WAN 2.2 Image to Video (FP8 Fast)"
version: 4
date: "2026-03-23 01:40"
description: "Image to video with WAN 2.2 14B FP8 models, dual-pass sampling (high+low noise), 4-step LightX2V LoRA acceleration, auto aspect ratio from input image, Lanczos upscale, RIFE 4x frame interpolation to 60fps."
author: ""
group: "original"

workflow_file: "workflow.json"

inputs:
  - id: input_image
    name: "Input Image"
    type: image
    node_id: "1"
    field: "image"
    required: true
    tooltip: "The first frame of your video. Use a clear, well-composed image — the model will animate from this starting point. FP8 quantization may lose fine details, so high-contrast images work best."

  - id: positive_prompt
    name: "Positive Prompt"
    type: text
    node_id: "2"
    field: "text"
    required: true
    default: ""
    placeholder: "Describe what happens in the video..."
    tooltip: "Describe the motion and action you want, not just appearance. WAN responds well to verbs and camera directions (e.g. 'the woman slowly turns her head, camera pans right'). Keep it concise — 1-2 sentences work better than long descriptions."

  - id: negative_prompt
    name: "Negative Prompt"
    type: text
    node_id: "3"
    field: "text"
    required: false
    default: "Overexposure, static, blurred details, subtitles, paintings, pictures, still, overall gray, worst quality, low quality, JPEG compression residue, ugly, mutilated, redundant fingers, poorly painted hands, poorly painted faces, deformed, disfigured, deformed limbs, fused fingers, cluttered background, three legs, a lot of people in the background, upside down"
    tooltip: "Things to avoid in the output. The default covers common artifacts. Add motion-specific negatives like 'jittery, flickering, morphing' if needed. With FP8 at low CFG, negative prompts have less influence — the default is usually sufficient."

  - id: duration
    name: "Duration"
    type: select
    node_id: "4"
    field: "value"
    options:
      - label: "5 seconds"
        value: 81
      - label: "10 seconds"
        value: 161
      - label: "15 seconds"
        value: 241
      - label: "20 seconds"
        value: 321
    default: 81
    tooltip: "Video length before frame interpolation. FP8 is fast — 5s generates in ~2 min on an A40. Longer durations use more VRAM and may lose coherence after 10s. The final output is upscaled and interpolated to 60fps."

  - id: cfg
    name: "CFG Scale"
    type: float
    node_id: "5"
    field: "Number"
    min: 1.0
    max: 5.0
    step: 0.1
    default: 1.5
    tooltip: "How closely the model follows the prompt. FP8 with LightX2V acceleration works best at very low CFG (1.0-2.0). Higher values increase prompt adherence but may introduce artifacts. Default 1.5 is the sweet spot for this workflow."

  - id: seed
    name: "Seed"
    type: seed
    node_id: "21"
    field: "noise_seed"
    default: -1
    tooltip: "Controls generation randomness. Use -1 for a random seed each time. Set a specific number to reproduce the same video — useful for iterating on prompts while keeping the same motion pattern."

  - id: upscale
    name: "Upscale Factor"
    type: float
    node_id: "6"
    field: "Number"
    min: 1.0
    max: 2.5
    step: 0.5
    default: 1.5
    tooltip: "Lanczos upscale applied before RIFE frame interpolation. 1.0 = no upscale (native ~480p), 1.5 = ~720p, 2.0 = ~960p. Higher values increase output quality but also processing time and file size."

outputs:
  - id: video
    name: "Output Video"
    type: video
    node_id: "28"

technical_notes:
  pipeline: "LoadImage → auto-scale to 480p (snap 16px) → WanImageToVideo encode → dual UNET FP8 (high+low noise) + LightX2V 4-step LoRA → ModelSamplingSD3 shift=8 → dual-pass KSamplerAdvanced (steps 0-4 high, 4-8 low) → VAEDecode → Lanczos upscale → RIFE 4x → h264 MP4"
  model_loading:
    unet: "2x FP8 quantized (wan2.2 high+low noise 14B), ~14GB each"
    clip: "umt5_xxl FP8 scaled"
    vae: "WAN 2.1 FP32"
    lora: "LightX2V 4-step accelerator (high+low), strength 1.0"
    strategy: "All models loaded to GPU simultaneously"
  sampling:
    method: "Dual-pass — high noise model handles coarse structure (steps 0-4), low noise model refines details (steps 4-8)"
    sampler: "euler"
    scheduler: "simple"
    total_steps: 8
    split_at: 4
    shift: 8
    cfg: "Not directly exposed (wired in graph)"
    acceleration: "LightX2V LoRA reduces 20-30 native steps to 4-8"
  post_processing:
    upscale_method: "Lanczos"
    upscale_factor: "User-configurable 1.0-2.0x (default 1.5)"
    frame_interpolation: "RIFE 4x (rife49, ensemble mode, float32)"
    frame_rate_in: 16
    frame_rate_out: 60
  output:
    format: "h264 MP4"
    crf: 19
    resolution: "~720p (depends on upscale factor, 480p base)"
    framerate: "60fps"
  resources:
    vram_peak: "~18GB"
    vram_notes: "FP8 halves memory vs FP16. Both UNETs loaded simultaneously."
    speed_notes: "Fastest of the three — 4-step LoRA + FP8 + no neural upscale"
  notes:
    - "FP8 quantization halves VRAM but may introduce subtle color/detail artifacts vs FP16"
    - "shift=8 controls noise schedule scaling — higher = more aggressive early denoising, tuned for FP8 WAN weights"
    - "Lanczos upscale is fast but softer than neural upscale (Remacri). Good for speed, not max quality."
    - "RIFE ensemble mode gives higher quality interpolation at ~2x slower than fast mode"
    - "480p generation base matches WAN training resolution — going higher causes artifacts"
    - "Split sampling: high noise model captures motion/structure, low noise model adds fine detail and coherence"

required_models:
  - "wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors"
  - "wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors"
  - "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
  - "wan_2.1_vae.safetensors"
  - "wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors"
  - "wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors"

required_nodes:
  - "LoadImage"
  - "CLIPTextEncode"
  - "CLIPLoader"
  - "UNETLoader"
  - "LoraLoaderModelOnly"
  - "ModelSamplingSD3"
  - "VAELoader"
  - "VAEDecode"
  - "WanImageToVideo"
  - "KSamplerAdvanced"
  - "ImageScale"
  - "RIFE VFI"
  - "VHS_VideoCombine"
  - "SimpleMath+"
  - "GetImageSize+"
  - "Float"
  - "PrimitiveInt"
