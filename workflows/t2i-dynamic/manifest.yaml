id: t2i-dynamic
category: t2i
name: "Text to Image"
version: 4
date: "2026-03-23 01:05"
type: dynamic
description: "Configurable text-to-image with checkpoint selection, LoRA stack, hires fix, face detailer, and batch generation."
author: ""

blocks_dir: "blocks"

pipeline:
  - block: setup
    file: "setup.json"
  - block: generate
    file: "generate.json"
    repeat_variable: "batch_count"
  - block: hires
    file: "hires.json"
    optional: true
    condition: "hires_enabled"
  - block: face_fix
    file: "face_fix.json"
    optional: true
    condition: "facefix_enabled"
  - block: output
    file: "output.json"

inputs:
  - id: checkpoint
    name: "Checkpoint"
    type: checkpoint_picker
    required: true
    tooltip: "The base model that defines the visual style. This is the advanced T2I workflow with optional hires fix and face detailer — use the simpler T2I Batch if you don't need those."

  - id: loras
    name: "LoRAs"
    type: lora_picker_dynamic
    max_loras: 5
    tooltip: "Optional style/concept LoRAs. Stack up to 5 with individual strength control. Include trigger words in your prompt."

  - id: vae_override
    name: "VAE Override"
    type: vae_picker
    required: false
    tooltip: "Override the checkpoint's built-in VAE. Most checkpoints have a good VAE baked in — only override if you see color issues or know a specific VAE works better (e.g. ft-mse-840000 for SD 1.5)."

  - id: positive_prompt
    name: "Positive Prompt"
    type: text
    required: true
    default: ""
    placeholder: "Describe what you want to generate..."
    tooltip: "Describes the image to generate. Quality tags first, then subject, then details. Include LoRA trigger words."

  - id: negative_prompt
    name: "Negative Prompt"
    type: text
    required: false
    default: "ugly, deformed, noisy, blurry, low quality, worst quality, bad anatomy, bad hands, missing fingers, extra fingers"
    tooltip: "What to avoid. This default covers common artifacts — add specifics as needed."

  - id: resolution
    name: "Resolution"
    type: resolution_picker
    presets:
      sd15: [{label: "512x512", w: 512, h: 512}, {label: "512x768", w: 512, h: 768}, {label: "768x512", w: 768, h: 512}]
      sdxl: [{label: "1024x1024", w: 1024, h: 1024}, {label: "832x1216", w: 832, h: 1216}, {label: "1216x832", w: 1216, h: 832}]
      pony: [{label: "1024x1024", w: 1024, h: 1024}, {label: "832x1216", w: 832, h: 1216}, {label: "1216x832", w: 1216, h: 832}]
      flux: [{label: "1024x1024", w: 1024, h: 1024}, {label: "768x1344", w: 768, h: 1344}, {label: "1344x768", w: 1344, h: 768}]
    default: {w: 1024, h: 1024}
    tooltip: "Output size. Must match checkpoint training resolution. If using hires fix, generate at native resolution and let hires upscale — don't set a resolution above the model's native."

  - id: steps
    name: "Steps"
    type: int
    min: 1
    max: 100
    default: 25
    tooltip: "Denoising steps. 20-30 is recommended for this workflow since it can include hires and face fix passes."

  - id: cfg
    name: "CFG Scale"
    type: float
    min: 1.0
    max: 30.0
    step: 0.5
    default: 7.0
    tooltip: "Prompt adherence. This workflow defaults to 7.0 (balanced). Lower for Pony/Illustrious (3-5), keep at 7-9 for SD 1.5."

  - id: sampler_name
    name: "Sampler"
    type: select
    options:
      - {label: "Euler", value: "euler"}
      - {label: "Euler Ancestral", value: "euler_ancestral"}
      - {label: "DPM++ 2M", value: "dpmpp_2m"}
      - {label: "DPM++ 2M Karras", value: "dpmpp_2m"}
      - {label: "DPM++ SDE", value: "dpmpp_sde"}
      - {label: "DPM++ 2M SDE", value: "dpmpp_2m_sde"}
      - {label: "UniPC", value: "uni_pc"}
      - {label: "LMS", value: "lms"}
    default: "euler"
    tooltip: "Denoising algorithm. Euler is clean and fast. Euler Ancestral adds variety. DPM++ 2M converges well with Karras scheduler."

  - id: scheduler
    name: "Scheduler"
    type: select
    options:
      - {label: "Normal", value: "normal"}
      - {label: "Karras", value: "karras"}
      - {label: "Exponential", value: "exponential"}
      - {label: "SGM Uniform", value: "sgm_uniform"}
      - {label: "Simple", value: "simple"}
    default: "normal"
    tooltip: "Noise schedule. Normal or Karras are the standard choices."

  - id: seed
    name: "Seed"
    type: seed
    default: -1
    tooltip: "-1 = random. Set a number to reproduce results. With batch_count > 1, each batch gets seed + increment."

  - id: batch_count
    name: "Batch Count"
    type: int
    min: 1
    max: 10
    default: 1
    tooltip: "Number of images to generate sequentially. Each runs a full KSampler pass with a different seed. Unlike batch_size (parallel), this is sequential — slower but uses less VRAM. Hires and face fix apply to each image."

  - id: hires_enabled
    name: "Hires Fix"
    type: boolean
    default: false
    tooltip: "Upscales the image and re-runs KSampler at higher resolution. Produces sharper, more detailed output than generating at high resolution directly. Enable if you want print-quality images."

  - id: hires_scale
    name: "Hires Scale"
    type: float
    min: 1.0
    max: 2.5
    step: 0.1
    default: 1.5
    tooltip: "Upscale factor. 1.5x = 50% larger (e.g. 1024 -> 1536). 2.0x = double. Higher uses more VRAM and takes longer. 1.5x is a safe default that noticeably improves detail."

  - id: hires_steps
    name: "Hires Steps"
    type: int
    min: 1
    max: 50
    default: 15
    tooltip: "KSampler steps for the hires pass. Fewer than the initial pass is fine — 10-20 is enough since it's refining, not generating from scratch."

  - id: hires_denoise
    name: "Hires Denoise"
    type: float
    min: 0.1
    max: 1.0
    step: 0.05
    default: 0.5
    tooltip: "How much to regenerate during hires. 0.3-0.4 = preserve composition, add detail. 0.5-0.6 = moderate rework, more detail but may shift composition. 0.7+ = heavy rework, can change the image significantly."

  - id: facefix_enabled
    name: "Face Fix"
    type: boolean
    default: false
    tooltip: "Detects faces and re-generates them at higher detail. Fixes common face artifacts (malformed eyes, asymmetry). Uses the ONNX face detector from Impact Pack. Only useful if your image contains faces."

  - id: facefix_steps
    name: "Face Fix Steps"
    type: int
    min: 1
    max: 50
    default: 20
    tooltip: "KSampler steps for face inpainting. 15-25 is usually enough. The face region is small so it's fast regardless."

  - id: facefix_denoise
    name: "Face Fix Denoise"
    type: float
    min: 0.1
    max: 1.0
    step: 0.05
    default: 0.4
    tooltip: "How much to regenerate the face. 0.3-0.4 = fix artifacts while keeping the face. 0.5-0.6 = more aggressive fix, face may change slightly. 0.7+ = full face regeneration."

outputs:
  - id: image
    name: "Output Image"
    type: image

required_models: []

required_nodes:
  - "CheckpointLoaderSimple"
  - "CLIPTextEncode"
  - "EmptyLatentImage"
  - "KSampler"
  - "VAEDecode"
  - "SaveImage"
  - "ONNXDetectorProvider"
  - "FaceDetailer"
