id: wan22-i2v-lightx2v
category: i2v
name: "WAN 2.2 Image to Video (LightX2V)"
version: 8
date: "2026-03-23 15:43"
description: "Image to video with WAN 2.2 14B LightX2V models, dual-pass sampling (high+low noise), 20 steps, Lanczos upscale 1.5x, RIFE 4x frame interpolation to 60fps. Proven workflow from wan22-b200."
author: ""
group: "original"

workflow_file: "workflow.json"

inputs:
  - id: input_image
    name: "Input Image"
    type: image
    node_id: "218"
    field: "image"
    required: true
    tooltip: "The first frame of your video. Use a clear, well-composed image with good lighting. LightX2V uses full-precision distilled models, so fine details and textures are preserved well from the input."

  - id: positive_prompt
    name: "Positive Prompt"
    type: text
    node_id: "243"
    field: "text"
    required: true
    default: ""
    placeholder: "Describe what happens in the video..."
    tooltip: "Describe the motion and action you want, not just appearance. WAN responds well to verbs and camera directions (e.g. 'the woman slowly turns her head, camera pans right'). LightX2V's distilled models handle complex motion descriptions well — be specific about what should move."

  - id: negative_prompt
    name: "Negative Prompt"
    type: text
    node_id: "244"
    field: "text"
    required: false
    default: "Overexposure, static, blurred details, subtitles, paintings, pictures, still, overall gray, worst quality, low quality, JPEG compression residue, ugly, mutilated, redundant fingers, poorly painted hands, poorly painted faces, deformed, disfigured, deformed limbs, fused fingers, cluttered background, three legs, a lot of people in the background, upside down"
    tooltip: "Things to avoid in the output. The default covers common artifacts. LightX2V at higher CFG (3.5) is more responsive to negatives than FP8 workflows — add 'jittery, flickering, morphing' if you notice temporal instability."

  - id: duration
    name: "Duration"
    type: select
    node_id: "319"
    field: "value"
    options:
      - label: "5 seconds"
        value: 81
      - label: "10 seconds"
        value: 161
      - label: "15 seconds"
        value: 241
      - label: "20 seconds"
        value: 321
    default: 81
    tooltip: "Video length before frame interpolation. Full-precision LightX2V models use more VRAM than FP8 — longer durations may be slower. The final output is upscaled with Remacri and interpolated to 60fps via RIFE."

  - id: cfg
    name: "CFG Scale"
    type: float
    node_id: "304"
    field: "cfg"
    min: 1.0
    max: 10.0
    step: 0.5
    default: 3.5
    tooltip: "How closely the model follows the prompt. LightX2V's full-precision models tolerate higher CFG than FP8. Default 3.5 balances prompt adherence with natural motion. Go lower (2.0) for more fluid, organic movement or higher (5.0) for stronger prompt control."

  - id: seed
    name: "Seed"
    type: seed
    node_id: "304"
    field: "noise_seed"
    default: -1
    tooltip: "Controls generation randomness. Use -1 for a random seed each time. Set a specific number to reproduce the same video — useful for iterating on prompts while keeping the same motion pattern."

  - id: upscale
    name: "Upscale Factor"
    type: float
    node_id: "305"
    field: "Number"
    min: 1.0
    max: 2.5
    step: 0.5
    default: 1.5
    tooltip: "Upscale using Remacri 4x model before RIFE frame interpolation. 1.0 = no upscale (native ~480p), 1.5 = ~720p, 2.0 = ~960p. Remacri produces sharper results than Lanczos but takes longer to process."

outputs:
  - id: video
    name: "Output Video"
    type: video
    node_id: "94"

technical_notes:
  pipeline: "LoadImage → auto-scale (snap 16px) → WanImageToVideo encode (240x416 base) → dual UNET FP16 full precision (dedicated LightX2V weights, high+low noise) → ModelSamplingSD3 shift=11 → dual-pass KSamplerAdvanced (euler/simple, split at half) → VAEDecode → Remacri 4x neural upscale → Lanczos resize (1.5x) → RIFE 4x (16fps→60fps) → h264 MP4"
  model_loading:
    unet: "2x FP16 full precision (wan2.2_i2v_A14b_high/low_noise_lightx2v), ~28GB each. LightX2V-specific weights — no separate LoRA needed."
    clip: "umt5_xxl FP32 (full precision for best text understanding)"
    vae: "WAN 2.1 FP32"
    lora: "None — acceleration is baked into the LightX2V model weights"
    strategy: "All models loaded to GPU simultaneously. Requires 32GB+ VRAM."
  sampling:
    method: "Dual-pass — high noise model with noise enabled (returns leftover noise), low noise model without added noise (runs to completion)"
    sampler: "euler"
    scheduler: "simple"
    total_steps: "User-configurable, split in half automatically"
    split_at: "auto (total_steps / 2)"
    shift: 11
    cfg: 3.5
    acceleration: "Baked into LightX2V weights — no LoRA overhead, native fast generation"
  post_processing:
    upscale_method: "Remacri 4x (4x_foolhardy_Remacri.pth neural upscaler) → Lanczos resize to 1.5x of input dimensions"
    upscale_factor: "4x neural then 1.5x Lanczos (user-configurable)"
    frame_interpolation: "RIFE 4x (rife49, ensemble mode, float32)"
    frame_rate_in: 16
    frame_rate_out: 60
  output:
    format: "h264 MP4"
    crf: 19
    resolution: "~1080p+ (240x416 base → 4x Remacri → 1.5x Lanczos)"
    framerate: "60fps"
  resources:
    vram_peak: "~32GB+"
    vram_notes: "FP16 full precision UNETs + FP32 CLIP + FP32 VAE + Remacri upscale model all in VRAM. Requires A100 or equivalent."
    speed_notes: "Medium speed — fast generation (baked LightX2V) but heavy post-processing (4x neural upscale + 4x RIFE on high-res frames)"
  notes:
    - "shift=11 (vs 8 in FP8/Kijai): more aggressive early denoising, tuned specifically for LightX2V full-precision weights"
    - "CFG 3.5 on both passes (higher than FP8's wired CFG): stronger prompt adherence at cost of slightly less natural motion"
    - "240x416 generation base (very small latent): all quality comes from post-processing upscale chain, not from sampling resolution"
    - "Remacri 4x neural upscale: sharper and more detailed than Lanczos, adds real texture detail. Slow but highest quality."
    - "Post-processing chain: VAEDecode → ImageFromBatch (extract frames) → ImageListToImageBatch → Remacri 4x → Lanczos 1.5x → RIFE 4x"
    - "FP32 CLIP and VAE (not FP8): maximum text encoding and decode quality at cost of memory"
    - "Anything Everywhere / Prompts Everywhere nodes: broadcast model/clip/vae without spaghetti connections (utility only, no functional impact)"
    - "No separate LoRA loading: LightX2V acceleration is baked into the UNET weights themselves, avoiding LoRA merge overhead"

required_models:
  - "wan2.2_i2v_A14b_high_noise_lightx2v.safetensors"
  - "wan2.2_i2v_A14b_low_noise_lightx2v.safetensors"
  - "wan21UMT5XxlFP32_fp32.safetensors"
  - "Wan2_1_VAE_fp32.safetensors"
  - "4x_foolhardy_Remacri.pth"

required_nodes:
  - "LoadImage"
  - "CLIPTextEncode"
  - "CLIPLoader"
  - "UNETLoader"
  - "ModelSamplingSD3"
  - "VAELoader"
  - "VAEDecode"
  - "WanImageToVideo"
  - "KSamplerAdvanced"
  - "ImageScale"
  - "RIFE VFI"
  - "VHS_VideoCombine"
  - "SimpleMath+"
  - "GetImageSize+"
  - "ImageFromBatch+"
  - "ImageListToImageBatch"
  - "Float"
  - "PrimitiveInt"
  - "UpscaleModelLoader"
  - "Anything Everywhere"
  - "Prompts Everywhere"
