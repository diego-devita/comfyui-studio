id: wan22-svi-pro
category: i2v
name: "WAN 2.2 SVI Pro 5 Scenes"
version: 4
date: "2026-03-23 01:40"
description: "Multi-scene I2V using SVI Pro technique. 5 concatenated clips with per-scene prompts, overlap blending, GGUF Q8 models, LightX2V + SVI Pro LoRAs, RIFE 2x interpolation to 32fps."
author: ""

workflow_file: "workflow.json"

inputs:
  - id: input_image
    name: "Input Image"
    type: image
    node_id: "97"
    field: "image"
    required: true
    tooltip: "The first frame of your 5-scene video. SVI Pro generates each clip starting from the last frame of the previous one, so this image sets the visual tone for all 5 scenes. Clear, well-lit images with distinct subjects work best."

  - id: prompt_clip1
    name: "Prompt (Clip 1)"
    type: text
    node_id: "193:262"
    field: "text"
    required: true
    default: ""
    placeholder: "Describe clip 1..."
    tooltip: "The first scene starts from your input image. Describe the initial motion or action. This is the only required prompt — leave clips 2-5 empty to reuse this prompt for all scenes, or fill them in for a multi-scene narrative."

  - id: prompt_clip2
    name: "Prompt (Clip 2)"
    type: text
    node_id: "181:152"
    field: "text"
    required: false
    default: ""
    placeholder: "Describe clip 2..."
    tooltip: "Optional second scene prompt. Continues from the last frame of clip 1. If left empty, clip 1's prompt is reused. Use this to introduce a change in action (e.g. a new camera angle or different movement)."

  - id: prompt_clip3
    name: "Prompt (Clip 3)"
    type: text
    node_id: "203:272"
    field: "text"
    required: false
    default: ""
    placeholder: "Describe clip 3..."
    tooltip: "Optional third scene prompt. Continues from the last frame of clip 2. SVI Pro blends overlapping frames between clips for smooth transitions. Good for the middle of a story arc."

  - id: prompt_clip4
    name: "Prompt (Clip 4)"
    type: text
    node_id: "236:282"
    field: "text"
    required: false
    default: ""
    placeholder: "Describe clip 4..."
    tooltip: "Optional fourth scene prompt. Continues from the last frame of clip 3. By this point, the video may drift from the original image — keep prompts grounded in what the model can realistically maintain."

  - id: prompt_clip5
    name: "Prompt (Clip 5)"
    type: text
    node_id: "250:292"
    field: "text"
    required: false
    default: ""
    placeholder: "Describe clip 5..."
    tooltip: "Optional fifth and final scene prompt. This is the last clip in the sequence.  LoRA helps maintain visual consistency across all 5 scenes. The final output is interpolated to 32fps via RIFE."

  - id: seed
    name: "Seed"
    type: seed
    node_id: "189"
    field: "noise_seed"
    default: -1
    tooltip: "Controls generation randomness for all 5 scenes. Use -1 for a random seed. Setting a specific seed makes all clips reproducible — useful for refining prompts across the multi-scene sequence."

outputs:
  - id: video
    name: "Output Video"
    type: video
    node_id: "214"

required_models:
  - "wan2.2_i2v_high_noise_14B_Q8_0.gguf"
  - "wan2.2_i2v_low_noise_14B_Q8_0.gguf"
  - "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
  - "wanvideo/Wan2_1_VAE_bf16.safetensors"
  - "Wan21_I2V_14B_lightx2v_cfg_step_distill_lora_rank64.safetensors"
  - "SVI_v2_PRO_Wan2.2-I2V-A14B_HIGH_lora_rank_128_fp16.safetensors"
  - "SVI_v2_PRO_Wan2.2-I2V-A14B_LOW_lora_rank_128_fp16.safetensors"
  - ""
  - ""

required_nodes:
  - "CLIPLoader"
  - "VAELoader"
  - "VAEEncode"
  - "VAEDecode"
  - "LoadImage"
  - "CLIPTextEncode"
  - "UnetLoaderGGUF"
  - "wanBlockSwap"
  - "Power Lora Loader (rgthree)"
  - "ModelSamplingSD3"
  - "BasicScheduler"
  - "KSamplerSelect"
  - "SplitSigmas"
  - "SamplerCustomAdvanced"
  - "ScheduledCFGGuidance"
  - "DisableNoise"
  - "RandomNoise"
  - "WanImageToVideoSVIPro"
  - "ImageBatchExtendWithOverlap"
  - "ImageScaleToTotalPixels"
  - "MathExpression|pysssss"
  - "mxSlider"
  - "RIFE VFI"
  - "VHS_VideoCombine"
  - "Int"
