id: wan22-i2v-kijai
category: i2v
name: "WAN 2.2 Image to Video (Kijai Wrapper)"
version: 8
date: "2026-03-23 01:40"
description: "Image to video using Kijai's WanVideoWrapper nodes with FP8 models, SageAttention, torch compile, block swap for VRAM management, LightX2V LoRA, dual-pass sampling (6 steps split 3+3), CFG scheduling. Output at 16fps native resolution."
author: ""
group: "original"

workflow_file: "workflow.json"

inputs:
  - id: input_image
    name: "Input Image"
    type: image
    node_id: "67"
    field: "image"
    required: true
    tooltip: "The first frame of your video. Kijai's wrapper auto-resizes the image, so any resolution works — but a clear, well-composed image produces better results. The model animates outward from this starting frame."

  - id: positive_prompt
    name: "Positive Prompt"
    type: text
    node_id: "16"
    field: "positive_prompt"
    required: true
    default: ""
    placeholder: "Describe what happens in the video..."
    tooltip: "Describe the motion and action you want, not just appearance. WAN responds well to verbs and camera directions (e.g. 'the woman slowly turns her head, camera pans right'). Kijai's wrapper uses a combined text encoder — prompts may feel slightly different from other WAN workflows."

  - id: negative_prompt
    name: "Negative Prompt"
    type: text
    node_id: "16"
    field: "negative_prompt"
    required: false
    default: "Overexposure, static, blurred details, subtitles, paintings, pictures, still, overall gray, worst quality, low quality, JPEG compression residue, ugly, mutilated, redundant fingers, poorly painted hands, poorly painted faces, deformed, disfigured, deformed limbs, fused fingers, cluttered background, three legs, a lot of people in the background, upside down"
    tooltip: "Things to avoid in the output. The default covers common artifacts. Add motion-specific negatives like 'jittery, flickering, morphing' if you see those issues. Kijai's CFG scheduling reduces the need for heavy negatives."

  - id: duration
    name: "Duration"
    type: select
    node_id: "89"
    field: "num_frames"
    options:
      - label: "5 seconds"
        value: 81
      - label: "10 seconds"
        value: 161
      - label: "15 seconds"
        value: 241
      - label: "20 seconds"
        value: 321
    default: 81
    tooltip: "Video length at native 16fps (no frame interpolation in this workflow). Kijai's block swap keeps VRAM usage stable even for longer clips. Output is 16fps — good for previewing motion before running higher-quality workflows."

  - id: cfg
    name: "CFG Scale"
    type: float
    node_id: "95"
    field: "cfg_scale_start"
    min: 1.0
    max: 10.0
    step: 0.5
    default: 2.0
    tooltip: "Starting CFG value for Kijai's scheduled CFG. This is the initial strength — it decreases during sampling via the CFG schedule. WAN works best at low CFG (1.5-3.0). Going above 4.0 often causes oversaturation and artifacts."

  - id: seed
    name: "Seed"
    type: seed
    node_id: "27"
    field: "seed"
    default: -1
    tooltip: "Controls generation randomness. Use -1 for a random seed each time. Set a specific number to reproduce the same video — useful for comparing prompt changes while keeping the same motion pattern."

outputs:
  - id: video
    name: "Output Video"
    type: video
    node_id: "60"

technical_notes:
  pipeline: "LoadImage → ImageResizeKJ (720x720 max, lanczos, center crop, divisible by 32) → WanVideoImageToVideoEncode (81 frames) → dual WanVideoModelLoader FP8 Kijai format (high+low noise) → WanVideoBlockSwap (20 blocks to CPU) → LightX2V LoRA (high: strength 3, low: strength 1) → WanVideoSampler dual-pass (6 steps, split at 3, dpm++_sde) → WanVideoDecode → h264 MP4"
  model_loading:
    unet: "2x FP8 Kijai format (Wan2_2-I2V-A14B HIGH+LOW), fp16_fast base + fp8_e4m3fn_scaled quant"
    clip: "umt5-xxl BF16, loaded to offload_device with force_offload"
    vae: "WAN 2.1 BF16, no tiling"
    lora: "LightX2V accelerator BF16 — strength 3 on high noise, strength 1 on low noise"
    strategy: "Models loaded to offload_device (CPU), swapped to GPU per-block during inference. SageAttention enabled."
  sampling:
    method: "Dual-pass — high noise model (steps 0-3), low noise model (steps 3-6)"
    sampler: "dpm++_sde"
    scheduler: "CreateCFGScheduleFloatList"
    total_steps: 6
    split_at: 3
    shift: 8
    cfg: "Flat 2.0 applied only to first 1% of steps (effectively CFG-free generation)"
    acceleration: "LightX2V LoRA with asymmetric strengths (3 high / 1 low) for aggressive coarse-pass acceleration"
  post_processing:
    upscale_method: "None"
    upscale_factor: "N/A"
    frame_interpolation: "None"
    frame_rate_in: 16
    frame_rate_out: 16
  output:
    format: "h264 MP4"
    crf: 19
    resolution: "~480p native (720px max input resize)"
    framerate: "16fps (native, no interpolation)"
  resources:
    vram_peak: "~12-14GB"
    vram_notes: "Block swap offloads 20 transformer blocks to CPU. Drastically reduces VRAM at cost of speed (PCIe transfer overhead per step)."
    speed_notes: "Slowest of the three — block swap CPU↔GPU transfers add 2-3x overhead. Trade-off for low VRAM."
  notes:
    - "Block swap (20 blocks): enables running on GPUs with ~16GB VRAM by offloading most of the model to system RAM"
    - "SageAttention: optimized attention kernel, faster than default PyTorch attention"
    - "Torch compile available but not active by default (inductor backend configured). Speeds up repeated runs."
    - "dpm++_sde sampler (vs euler in FP8/LightX2V): slightly different noise character, may produce smoother motion"
    - "CFG schedule flat 2.0 at 1% then off: near-zero classifier-free guidance, relies on model quality alone"
    - "Asymmetric LoRA strengths (3/1): high noise pass gets aggressive acceleration, low noise pass gets gentle refinement"
    - "No frame interpolation or upscale: output is raw 480p 16fps. Add RIFE + upscale externally if needed."
    - "720px max resize with center crop and divisible-by-32 constraint: matches Kijai wrapper's requirements"

required_models:
  - "WanVideo/2_2/Wan2_2-I2V-A14B-HIGH_fp8_e4m3fn_scaled_KJ.safetensors"
  - "WanVideo/2_2/Wan2_2-I2V-A14B-LOW_fp8_e4m3fn_scaled_KJ.safetensors"
  - "wanvideo/Wan2_1_VAE_bf16.safetensors"
  - "umt5-xxl-enc-bf16.safetensors"
  - "WanVideo/Lightx2v/lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors"

required_nodes:
  - "WanVideoModelLoader"
  - "WanVideoSampler"
  - "WanVideoDecode"
  - "WanVideoVAELoader"
  - "WanVideoTextEncode"
  - "WanVideoImageToVideoEncode"
  - "WanVideoSetBlockSwap"
  - "WanVideoBlockSwap"
  - "WanVideoSetLoRAs"
  - "WanVideoLoraSelect"
  - "WanVideoTorchCompileSettings"
  - "LoadWanVideoT5TextEncoder"
  - "LoadImage"
  - "ImageResizeKJv2"
  - "GetImageSizeAndCount"
  - "VHS_VideoCombine"
  - "INTConstant"
  - "CreateCFGScheduleFloatList"
