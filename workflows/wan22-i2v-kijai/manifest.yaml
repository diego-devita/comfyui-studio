id: wan22-i2v-kijai
category: i2v
name: "WAN 2.2 Image to Video (Kijai Wrapper)"
version: 8
date: "2026-03-23 01:40"
description: "Image to video using Kijai's WanVideoWrapper nodes with FP8 models, SageAttention, torch compile, block swap for VRAM management, LightX2V LoRA, dual-pass sampling (6 steps split 3+3), CFG scheduling. Output at 16fps native resolution."
author: ""
group: "original"

workflow_file: "workflow.json"

inputs:
  - id: input_image
    name: "Input Image"
    type: image
    node_id: "67"
    field: "image"
    required: true
    tooltip: "The first frame of your video. Kijai's wrapper auto-resizes the image, so any resolution works — but a clear, well-composed image produces better results. The model animates outward from this starting frame."

  - id: positive_prompt
    name: "Positive Prompt"
    type: text
    node_id: "16"
    field: "positive_prompt"
    required: true
    default: ""
    placeholder: "Describe what happens in the video..."
    tooltip: "Describe the motion and action you want, not just appearance. WAN responds well to verbs and camera directions (e.g. 'the woman slowly turns her head, camera pans right'). Kijai's wrapper uses a combined text encoder — prompts may feel slightly different from other WAN workflows."

  - id: negative_prompt
    name: "Negative Prompt"
    type: text
    node_id: "16"
    field: "negative_prompt"
    required: false
    default: "Overexposure, static, blurred details, subtitles, paintings, pictures, still, overall gray, worst quality, low quality, JPEG compression residue, ugly, mutilated, redundant fingers, poorly painted hands, poorly painted faces, deformed, disfigured, deformed limbs, fused fingers, cluttered background, three legs, a lot of people in the background, upside down"
    tooltip: "Things to avoid in the output. The default covers common artifacts. Add motion-specific negatives like 'jittery, flickering, morphing' if you see those issues. Kijai's CFG scheduling reduces the need for heavy negatives."

  - id: duration
    name: "Duration"
    type: select
    node_id: "89"
    field: "num_frames"
    options:
      - label: "5 seconds"
        value: 81
      - label: "10 seconds"
        value: 161
      - label: "15 seconds"
        value: 241
      - label: "20 seconds"
        value: 321
    default: 81
    tooltip: "Video length at native 16fps (no frame interpolation in this workflow). Kijai's block swap keeps VRAM usage stable even for longer clips. Output is 16fps — good for previewing motion before running higher-quality workflows."

  - id: cfg
    name: "CFG Scale"
    type: float
    node_id: "95"
    field: "cfg_scale_start"
    min: 1.0
    max: 10.0
    step: 0.5
    default: 2.0
    tooltip: "Starting CFG value for Kijai's scheduled CFG. This is the initial strength — it decreases during sampling via the CFG schedule. WAN works best at low CFG (1.5-3.0). Going above 4.0 often causes oversaturation and artifacts."

  - id: seed
    name: "Seed"
    type: seed
    node_id: "27"
    field: "seed"
    default: -1
    tooltip: "Controls generation randomness. Use -1 for a random seed each time. Set a specific number to reproduce the same video — useful for comparing prompt changes while keeping the same motion pattern."

outputs:
  - id: video
    name: "Output Video"
    type: video
    node_id: "60"

required_models:
  - "WanVideo/2_2/Wan2_2-I2V-A14B-HIGH_fp8_e4m3fn_scaled_KJ.safetensors"
  - "WanVideo/2_2/Wan2_2-I2V-A14B-LOW_fp8_e4m3fn_scaled_KJ.safetensors"
  - "wanvideo/Wan2_1_VAE_bf16.safetensors"
  - "umt5-xxl-enc-bf16.safetensors"
  - "WanVideo/Lightx2v/lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors"

required_nodes:
  - "WanVideoModelLoader"
  - "WanVideoSampler"
  - "WanVideoDecode"
  - "WanVideoVAELoader"
  - "WanVideoTextEncode"
  - "WanVideoImageToVideoEncode"
  - "WanVideoSetBlockSwap"
  - "WanVideoBlockSwap"
  - "WanVideoSetLoRAs"
  - "WanVideoLoraSelect"
  - "WanVideoTorchCompileSettings"
  - "LoadWanVideoT5TextEncoder"
  - "LoadImage"
  - "ImageResizeKJv2"
  - "GetImageSizeAndCount"
  - "VHS_VideoCombine"
  - "INTConstant"
  - "CreateCFGScheduleFloatList"
