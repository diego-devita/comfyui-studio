<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Studio — LLM</title>
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/icons.css">
<style>
  main { max-width: 1060px; margin: 0 auto; }
  /* telemetry uses shared .telemetry-panel / .gauge-* from styles.css */
  .help-tip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--border); color: var(--muted);
    font-size: 9px; font-weight: 700; font-style: normal;
    cursor: help; vertical-align: middle; margin-left: 4px;
  }
  .help-tip:hover { background: var(--accent); color: var(--bg); }

  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Model Catalog ── */
  .model-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 32px;
  }
  .llm-model-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 14px 20px;
    transition: border-color 0.15s;
  }
  .llm-model-card:hover { border-color: #3a3a4a; }
  .model-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    flex: 1;
  }
  .model-name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-meta {
    display: flex;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .model-tag {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }
  .model-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .model-badge.present {
    color: var(--success);
    border: 1px solid var(--success);
  }
  .model-badge.missing {
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .model-badge.downloading {
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .model-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* ── Launch Config ── */
  .config-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 20px;
    margin-bottom: 32px;
  }
  .config-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .config-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1 1 140px;
  }
  .config-field label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .config-field select,
  .config-field input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .config-field select:focus,
  .config-field input:focus {
    border-color: var(--accent);
  }
  .config-field .range-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 36px; /* match input field height */
  }
  .config-field input[type="range"] {
    flex: 1;
    padding: 0;
    background: transparent;
    border: none;
    accent-color: var(--accent);
  }
  .config-field .range-val {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    min-width: 28px;
    text-align: right;
  }

  /* ── Running Instances ── */
  .instances-section {
    margin-bottom: 32px;
  }
  .instances-empty {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 24px 0;
  }
  .instances-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .instance-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 16px 20px;
  }
  .instance-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .instance-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .instance-model-name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .instance-id-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .health-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .health-dot.ok { background: var(--success); }
  .health-dot.loading { background: var(--queued); animation: livePulse 2s ease-in-out infinite; }
  .health-dot.unreachable { background: var(--error); }
  .health-dot.exited { background: var(--muted); }
  .instance-card.exited { opacity: 0.6; }
  .instance-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .instance-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .port-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .proxy-link {
    font-family: var(--mono);
    font-size: 10px;
    color: #666;
    text-decoration: none;
    word-break: break-all;
  }
  .proxy-link:hover { color: var(--accent); }
  .log-toggle {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .log-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .log-toggle.active { border-color: var(--accent); color: var(--accent); }

  /* ── Log Console ── */
  .log-console {
    background: #0a0a0f;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    margin-top: 10px;
    display: none;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .log-console.visible { display: block; }

  /* ── Chat Panel ── */
  .chat-section {
    margin-bottom: 32px;
  }
  .chat-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 20px;
  }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .chat-model-select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
  }
  .chat-model-select:focus { border-color: var(--accent); }
  .chat-clear-btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .chat-clear-btn:hover { border-color: var(--error); color: var(--error); }
  .chat-fullscreen-btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: auto;
  }
  .chat-fullscreen-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Fullscreen overlay ── */
  .chat-section.fullscreen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999;
    background: var(--bg);
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-section.fullscreen .section-title { display: none; }
  .chat-section.fullscreen .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    border: none;
    border-radius: 0;
    padding: 0;
  }
  .chat-section.fullscreen .chat-messages {
    flex: 1;
    max-height: none;
  }

  .chat-messages {
    min-height: 120px;
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .chat-msg {
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }
  .chat-msg.user {
    background: rgba(232, 255, 71, 0.08);
    border: 1px solid rgba(232, 255, 71, 0.2);
    color: var(--text);
  }
  .chat-msg.assistant {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .chat-msg.error {
    background: rgba(255, 80, 80, 0.08);
    border: 1px solid rgba(255, 80, 80, 0.2);
    color: var(--error);
  }
  .chat-empty {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 32px 0;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
  }
  .chat-input-row textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 12px;
    resize: vertical;
    min-height: 40px;
    max-height: 200px;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
  }
  .chat-input-row textarea:focus {
    border-color: var(--accent);
  }
  .chat-input-row .btn {
    align-self: flex-end;
  }

  @media (max-width: 768px) {
    .config-panel { padding: 16px; }
    .config-row { flex-direction: column; gap: 12px; }
    .config-field { flex: none; width: 100%; }
    .llm-model-card { flex-direction: column; align-items: flex-start; padding: 14px 16px; }
    .model-actions { width: 100%; }
    .instance-header { flex-direction: column; align-items: flex-start; }
    .chat-header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<nav class="main-nav">
  <a href="/home" class="nav-link">Home</a>
  <a href="/admin/nodes" class="nav-link">Nodes</a>
  <a href="/admin/models" class="nav-link">Models</a>

<header>
  <div class="logo">ComfyUI <span class="studio-word">Studio<span class="beta-badge">BETA</span></span> <small>LLM</small></div>
</header>

<main>
  <!-- Telemetry -->
  <div class="telemetry-panel" id="telemetryPanel"></div>

  <!-- Section 1: Model Catalog (collapsible) -->
  <div class="section-title" style="cursor:pointer;user-select:none;" id="catalogToggle">
    <span id="catalogArrow">▸</span> Model Catalog
  </div>
  <div id="catalogBody" style="display:none;">
    <div class="model-list" id="modelList">
      <div style="font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;padding:24px 0;">Loading models...</div>
    </div>
  </div>

  <!-- Section 2: Launch Configuration -->
  <div class="section-title">Launch Configuration</div>
  <div class="config-panel">
    <div class="config-row">
      <div class="config-field">
        <label>Model</label>
        <select id="launchModel">
          <option value="">-- select a downloaded model --</option>
        </select>
      </div>
      <div class="config-field">
        <label>Context Size <span class="help-tip" title="How many tokens the model can 'see' in a conversation. 1 token ≈ 0.75 words. Larger = more conversation memory but more VRAM. 4096 ≈ 3000 words, 8192 ≈ 6000 words, 32768 ≈ 24000 words. Maximum depends on the model (e.g. Qwen 2.5 supports up to 128k). Set at launch — requires restart to change.">?</span></label>
        <input type="number" id="ctxSize" value="8192" min="512" max="131072" step="512">
      </div>
      <div class="config-field">
        <label>GPU Layers <span class="help-tip" title="How many transformer layers to load into GPU VRAM. -1 or 99 = all layers in GPU (fastest). Lower values offload layers to CPU RAM (slower). With 192GB VRAM you should always use -1. Set at launch — requires restart to change.">?</span></label>
        <input type="number" id="gpuLayers" value="99" min="-1" max="200" step="1">
      </div>
    </div>
    <div class="config-row" style="margin-top:12px;">
      <div class="config-field">
        <label>Temperature <span class="help-tip" title="Controls response randomness/creativity. 0.0 = deterministic (always same answer). 0.3-0.5 = focused, good for code/facts. 0.7 = balanced (default). 1.0+ = creative but may hallucinate. This is the default for this instance — can be overridden per-message in the chat panel.">?</span></label>
        <div class="range-wrap">
          <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
          <span class="range-val" id="tempVal">0.7</span>
        </div>
      </div>
      <div class="config-field">
        <label>Threads <span class="help-tip" title="CPU threads for non-GPU operations (tokenization, sampling). Default 4 is fine for most cases. More threads help slightly with concurrent requests but the GPU does most of the work. Set at launch — requires restart to change.">?</span></label>
        <input type="number" id="threads" value="4" min="1" max="32" step="1">
      </div>
      <div class="config-field">
        <label>&nbsp;</label>
        <button class="btn" id="launchBtn" style="height:36px;">Launch Instance</button>
      </div>
    </div>
  </div>

  <!-- Section 3: Running Instances -->
  <div class="section-title">Running Instances</div>
  <div class="instances-section">
    <div id="instancesList">
      <div class="instances-empty">No instances running.</div>
    </div>
  </div>

  <!-- Section 4: Chat -->
  <div class="chat-section" id="chatSection" style="display:none;">
    <div class="section-title">Chat</div>
    <div class="chat-area">
      <div class="chat-header">
        <select class="chat-model-select" id="chatInstanceSelect">
          <option value="">-- select a running instance --</option>
        </select>
        <button class="chat-clear-btn" id="chatClearBtn">Clear</button>
        <button class="chat-fullscreen-btn" id="chatFullscreenBtn" title="Toggle fullscreen">&#x26F6;</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">Select a running instance and send a message to start chatting.</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <label style="font-size:10px;color:var(--muted);white-space:nowrap;">Temperature <span class="help-tip" title="Override temperature for this message. Lower = more focused, higher = more creative.">?</span></label>
        <input type="range" id="chatTemp" min="0" max="2" step="0.1" value="0.7" style="flex:1;max-width:150px;">
        <span id="chatTempVal" style="font-family:var(--mono);font-size:11px;color:var(--muted);min-width:24px;">0.7</span>
      </div>
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Type a message..." rows="2"></textarea>
        <button class="btn" id="chatSendBtn">Send</button>
      </div>
    </div>
  </div>
</main>

<script src="/static/js/shared.js"></script>
<script>
(function() {
  'use strict';

  // ── Catalog accordion ──
  var $catalogToggle = document.getElementById('catalogToggle');
  var $catalogBody = document.getElementById('catalogBody');
  var $catalogArrow = document.getElementById('catalogArrow');
  $catalogToggle.addEventListener('click', function() {
    var open = $catalogBody.style.display !== 'none';
    $catalogBody.style.display = open ? 'none' : '';
    $catalogArrow.textContent = open ? '▸' : '▾';
  });

  // ── Telemetry (gauge circles, same as home page) ──
  var $telemetryPanel = document.getElementById('telemetryPanel');

  function fmtGB(bytes) {
    if (!bytes && bytes !== 0) return '--';
    return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
  }

  function makeGauge(id, label) {
    return '<div class="gauge-card" id="' + id + '">' +
      '<div class="gauge-ring">' +
        '<svg viewBox="0 0 80 80"><circle class="gauge-bg" /><circle class="gauge-fill" /></svg>' +
        '<div class="gauge-value">--</div>' +
      '</div>' +
      '<div class="gauge-label">' + label + '</div>' +
      '<div class="gauge-sub">&nbsp;</div>' +
    '</div>';
  }

  function updateGauge(id, pct, sub) {
    var card = document.getElementById(id);
    if (!card) return;
    var fill = card.querySelector('.gauge-fill');
    var val = card.querySelector('.gauge-value');
    var subEl = card.querySelector('.gauge-sub');
    var p = Math.max(0, Math.min(100, pct || 0));
    var offset = 213.6 - (213.6 * p / 100);
    fill.style.strokeDashoffset = offset;
    fill.classList.remove('warn', 'crit');
    if (p > 85) fill.classList.add('crit');
    else if (p > 65) fill.classList.add('warn');
    val.textContent = Math.round(p) + '%';
    if (sub) subEl.textContent = sub;
  }

  async function pollTelemetry() {
    try {
      var resp = await apiFetch('/api/admin/telemetry');
      if (!resp.ok) return;
      var d = await resp.json();

      $telemetryPanel.style.background = 'rgba(232, 255, 71, 0.03)';
      setTimeout(function() { $telemetryPanel.style.background = ''; }, 300);

      if (!$telemetryPanel.innerHTML) {
        $telemetryPanel.innerHTML =
          makeGauge('gGpu', 'GPU Load') +
          makeGauge('gVram', 'VRAM') +
          makeGauge('gRam', 'System RAM') +
          makeGauge('gCpu', 'CPU') +
          makeGauge('gDisk', 'Disk');
      }

      if (d.gpu) {
        updateGauge('gGpu', d.gpu.util_percent, d.gpu.name + (d.gpu.temp_c ? ' \u00b7 ' + d.gpu.temp_c + '\u00b0C' : ''));
        updateGauge('gVram', d.gpu.vram_percent, fmtGB(d.gpu.vram_used) + ' / ' + fmtGB(d.gpu.vram_total));
      }
      updateGauge('gRam', d.ram_percent, fmtGB(d.ram_used) + ' / ' + fmtGB(d.ram_total));
      updateGauge('gCpu', d.cpu_percent, 'load');
      if (d.disk_total > 0) {
        updateGauge('gDisk', d.disk_percent, fmtGB(d.disk_used) + ' / ' + fmtGB(d.disk_total));
      }
    } catch (_) {}
  }
  pollTelemetry();
  setInterval(pollTelemetry, 5000);

  // ── DOM refs ──
  var $modelList = document.getElementById('modelList');
  var $launchModel = document.getElementById('launchModel');
  var $ctxSize = document.getElementById('ctxSize');
  var $gpuLayers = document.getElementById('gpuLayers');
  var $temperature = document.getElementById('temperature');
  var $tempVal = document.getElementById('tempVal');
  var $threads = document.getElementById('threads');
  var $launchBtn = document.getElementById('launchBtn');
  var $instancesList = document.getElementById('instancesList');
  var $chatSection = document.getElementById('chatSection');
  var $chatInstanceSelect = document.getElementById('chatInstanceSelect');
  var $chatClearBtn = document.getElementById('chatClearBtn');
  var $chatMessages = document.getElementById('chatMessages');
  var $chatInput = document.getElementById('chatInput');
  var $chatSendBtn = document.getElementById('chatSendBtn');

  var _models = [];
  var _runningInstances = {};  // instance_id -> {model, port, started_at, health, config, proxy_base_path}
  var _chatHistories = {};     // instance_id -> [{role, content}]
  var _expandedLogs = {};      // instance_id -> true/false
  var _logTimers = {};         // instance_id -> intervalId
  var _statusTimer = null;
  var _downloadPollTimer = null;
  var _streaming = false;      // true while a streaming response is in progress

  // ── Temperature sliders ──
  $temperature.addEventListener('input', function() {
    $tempVal.textContent = this.value;
  });
  var $chatTemp = document.getElementById('chatTemp');
  var $chatTempVal = document.getElementById('chatTempVal');
  $chatTemp.addEventListener('input', function() {
    $chatTempVal.textContent = this.value;
  });

  // ── Load Models ──
  async function loadModels() {
    try {
      var resp = await apiFetch('/api/admin/llm/models');
      if (!resp.ok) return;
      var data = await resp.json();
      _models = [];
      (data.categories || []).forEach(function(cat) {
        (cat.models || []).forEach(function(m) { _models.push(m); });
      });
      renderModels();
      updateLaunchModelSelect();
    } catch (e) {
      if (e.message !== 'auth') {
        $modelList.innerHTML = '<div style="font-family:var(--mono);font-size:12px;color:var(--error);text-align:center;padding:24px 0;">Failed to load models</div>';
      }
    }
  }

  function renderModels() {
    if (!_models.length) {
      $modelList.innerHTML = '<div style="font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;padding:24px 0;">No models configured</div>';
      return;
    }
    var html = '';
    _models.forEach(function(m) {
      var name = m.name || m.filename || '--';
      var size = m.size ? formatSize(m.size) : '';
      var quant = m.quant || '';
      var status = m.status || 'missing';
      var tags = m.tags || [];
      var progress = m.download_progress || null;

      var badgeClass, badgeText;
      if (status === 'downloading') {
        badgeClass = 'downloading';
        badgeText = progress != null ? 'Downloading ' + progress + '%' : 'Downloading';
      } else if (status === 'present') {
        badgeClass = 'present';
        badgeText = 'Downloaded';
      } else {
        badgeClass = 'missing';
        badgeText = 'Missing';
      }

      var tagsHtml = '';
      tags.forEach(function(t) { tagsHtml += '<span class="model-tag">' + escHtml(t) + '</span>'; });

      var metaParts = [];
      if (size) metaParts.push(size);
      if (quant) metaParts.push(quant);
      if (m.context_max) metaParts.push('ctx ' + (m.context_max >= 1024 ? Math.round(m.context_max/1024) + 'k' : m.context_max));

      var fileEsc = escHtml(m.file).replace(/'/g, '&#39;');
      var actionHtml = '';

      if (status === 'present') {
        actionHtml = '<button class="btn btn--sm btn--danger" onclick="window._llmDeleteModel(\'' + fileEsc + '\')">Delete</button>';
      } else if (status === 'downloading') {
        actionHtml = '<span class="spinner sm"></span>';
      } else {
        actionHtml = '<button class="btn btn--sm" onclick="window._llmDownloadModel(\'' + fileEsc + '\')">Download</button>';
      }

      html +=
        '<div class="llm-model-card">' +
          '<div class="model-info">' +
            '<div class="model-name">' + escHtml(name) +
              (m.hf_repo ? ' <a href="https://huggingface.co/' + m.hf_repo + '" target="_blank" style="text-decoration:none;color:#666;" title="View on HuggingFace"><span class="icon icon-external-link icon-sm"></span></a>' : '') +
            '</div>' +
            '<div class="model-meta">' +
              (metaParts.length ? '<span>' + escHtml(metaParts.join(' / ')) + '</span>' : '') +
              tagsHtml +
            '</div>' +
          '</div>' +
          '<span class="model-badge ' + badgeClass + '">' + escHtml(badgeText) + '</span>' +
          '<div class="model-actions">' + actionHtml + '</div>' +
        '</div>';
    });
    $modelList.innerHTML = html;
  }

  function formatSize(bytes) {
    if (!bytes || bytes <= 0) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
  }

  // ── Launch Model Select ──
  function updateLaunchModelSelect() {
    var current = $launchModel.value;
    $launchModel.innerHTML = '<option value="">-- select a downloaded model --</option>';
    _models.forEach(function(m) {
      if (m.status === 'present') {
        var opt = document.createElement('option');
        opt.value = m.file;
        opt.textContent = m.name || m.file;
        $launchModel.appendChild(opt);
      }
    });
    if (current) $launchModel.value = current;
  }

  // ── Launch Instance ──
  $launchBtn.addEventListener('click', async function() {
    var modelFile = $launchModel.value;
    if (!modelFile) {
      showToast('Select a model to launch', 3000, 'error');
      return;
    }
    $launchBtn.disabled = true;
    $launchBtn.innerHTML = '<span class="spinner sm"></span> Launching...';
    try {
      var resp = await apiFetch('/api/admin/llm/start', {
        method: 'POST',
        body: {
          model: modelFile,
          ctx_size: parseInt($ctxSize.value) || 8192,
          n_gpu_layers: parseInt($gpuLayers.value),
          threads: parseInt($threads.value) || 4,
        }
      });
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        showToast('Launch failed: ' + (err.detail || err.error || resp.status), 5000, 'error');
        return;
      }
      var data = await resp.json();
      showToast('Launched ' + modelFile + ' on port ' + data.port + ' (id: ' + data.instance_id + ')', 3000);
      setTimeout(loadStatus, 1500);
    } catch (e) {
      if (e.message !== 'auth') showToast('Launch error: ' + e.message, 5000, 'error');
    } finally {
      $launchBtn.disabled = false;
      $launchBtn.textContent = 'Launch Instance';
    }
  });

  // ── Download / Delete ──
  window._llmDownloadModel = async function(name) {
    try {
      var resp = await apiFetch('/api/admin/llm/models/download/' + encodeURIComponent(name), {method: 'POST'});
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        showToast('Download failed: ' + (err.detail || err.error || resp.status), 5000, 'error');
        return;
      }
      showToast('Download started: ' + name, 3000);
      startDownloadPoll();
    } catch (e) {
      if (e.message !== 'auth') showToast('Download error: ' + e.message, 5000, 'error');
    }
  };

  window._llmDeleteModel = async function(name) {
    var ok = await studioConfirm('Delete model "' + name + '"?', {yes: 'Delete', danger: true});
    if (!ok) return;
    try {
      var resp = await apiFetch('/api/admin/llm/models/' + encodeURIComponent(name), {method: 'DELETE'});
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        showToast('Delete failed: ' + (err.detail || err.error || resp.status), 5000, 'error');
        return;
      }
      showToast('Deleted: ' + name, 3000);
      loadModels();
    } catch (e) {
      if (e.message !== 'auth') showToast('Delete error: ' + e.message, 5000, 'error');
    }
  };

  // ── Stop Instance ──
  window._llmStopInstance = async function(instanceId) {
    var ok = await studioConfirm('Stop instance "' + instanceId + '"?');
    if (!ok) return;
    try {
      var resp = await apiFetch('/api/admin/llm/stop', {
        method: 'POST',
        body: { instance_id: instanceId }
      });
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        showToast('Stop failed: ' + (err.detail || err.error || resp.status), 5000, 'error');
        return;
      }
      showToast('Stopped: ' + instanceId, 3000);
      // Clean up log polling for this instance
      if (_logTimers[instanceId]) {
        clearInterval(_logTimers[instanceId]);
        delete _logTimers[instanceId];
      }
      delete _expandedLogs[instanceId];
      setTimeout(loadStatus, 500);
    } catch (e) {
      if (e.message !== 'auth') showToast('Stop error: ' + e.message, 5000, 'error');
    }
  };

  // ── Dismiss exited Instance ──
  window._llmDismissInstance = async function(instanceId) {
    try {
      await apiFetch('/api/admin/llm/dismiss', {
        method: 'POST',
        body: { instance_id: instanceId }
      });
    } catch (_) {}
    if (_logTimers[instanceId]) {
      clearInterval(_logTimers[instanceId]);
      delete _logTimers[instanceId];
    }
    delete _expandedLogs[instanceId];
    loadStatus();
  };

  function startDownloadPoll() {
    if (_downloadPollTimer) return;
    _downloadPollTimer = setInterval(function() {
      loadModels().then(function() {
        var downloading = _models.some(function(m) { return m.status === 'downloading'; });
        if (!downloading && _downloadPollTimer) {
          clearInterval(_downloadPollTimer);
          _downloadPollTimer = null;
        }
      });
    }, 3000);
  }

  // ── Load Status (running instances) ──
  async function loadStatus() {
    try {
      var resp = await apiFetch('/api/admin/llm/status');
      if (!resp.ok) return;
      var data = await resp.json();

      // Build running map keyed by instance_id
      _runningInstances = {};
      (data.instances || []).forEach(function(inst) {
        _runningInstances[inst.instance_id] = inst;
      });

      renderInstances(data.instances || []);
      updateChatInstanceSelect();

      // Show/hide chat section
      var hasRunning = Object.keys(_runningInstances).length > 0;
      $chatSection.style.display = hasRunning ? '' : 'none';
    } catch (e) {
      // silent
    }
  }

  function renderInstances(instances) {
    if (!instances.length) {
      $instancesList.innerHTML = '<div class="instances-empty">No instances running.</div>';
      return;
    }

    var html = '<div class="instances-list">';
    instances.forEach(function(inst) {
      var healthClass = inst.health || 'unreachable';
      var logExpanded = !!_expandedLogs[inst.instance_id];
      var iidEsc = escHtml(inst.instance_id).replace(/'/g, '&#39;');
      var proxyUrl = window.location.origin + (inst.proxy_base_path || '/api/admin/llm/' + encodeURIComponent(inst.instance_id) + '/api/');

      // Config summary
      var configParts = [];
      if (inst.config) {
        if (inst.config.ctx_size) configParts.push('ctx=' + inst.config.ctx_size);
        if (inst.config.n_gpu_layers !== undefined) configParts.push('gpu=' + inst.config.n_gpu_layers);
        if (inst.config.temp !== undefined) configParts.push('temp=' + inst.config.temp);
        if (inst.config.threads) configParts.push('threads=' + inst.config.threads);
      }

      var isExited = healthClass === 'exited';

      html +=
        '<div class="instance-card' + (isExited ? ' exited' : '') + '" data-instance="' + escHtml(inst.instance_id) + '">' +
          '<div class="instance-header">' +
            '<div class="instance-info">' +
              '<span class="health-dot ' + healthClass + '" title="' + healthClass + '"></span>' +
              '<span class="instance-model-name">' + escHtml(inst.model) + (isExited ? ' <span style="color:var(--error);font-size:10px;font-weight:400;">(exited)</span>' : '') + '</span>' +
              '<span class="port-label">:' + inst.port + '</span>' +
              '<span class="instance-id-label">' + escHtml(inst.instance_id) + '</span>' +
            '</div>' +
            '<div class="instance-actions">' +
              '<button class="log-toggle' + (logExpanded ? ' active' : '') + '" onclick="window._llmToggleLog(\'' + iidEsc + '\')">Log</button>' +
              (isExited
                ? '<button class="btn btn--sm" onclick="window._llmDismissInstance(\'' + iidEsc + '\')">Dismiss</button>'
                : '<button class="btn btn--sm" onclick="window._llmChatWith(\'' + iidEsc + '\')">Chat</button>' +
                  '<button class="btn btn--sm btn--danger" onclick="window._llmStopInstance(\'' + iidEsc + '\')">Stop</button>'
              ) +
            '</div>' +
          '</div>' +
          '<div class="instance-meta">' +
            '<span>Started: ' + escHtml(inst.started_at || '--') + '</span>' +
            (configParts.length ? '<span>' + escHtml(configParts.join(', ')) + '</span>' : '') +
          '</div>' +
          '<div style="margin-top:4px;"><a class="proxy-link" href="' + escHtml(proxyUrl) + '" target="_blank" title="OpenAI-compatible API">' + escHtml(proxyUrl) + '</a></div>' +
          '<div class="log-console' + (logExpanded ? ' visible' : '') + '" id="log-' + escHtml(inst.instance_id).replace(/:/g, '_') + '"></div>' +
        '</div>';
    });
    html += '</div>';
    $instancesList.innerHTML = html;

    // Restore log content for expanded logs
    instances.forEach(function(inst) {
      if (_expandedLogs[inst.instance_id]) {
        fetchLog(inst.instance_id);
      }
    });
  }

  // ── Log Toggle & Fetch ──
  window._llmToggleLog = function(instanceId) {
    var elId = 'log-' + instanceId.replace(/:/g, '_');
    if (_expandedLogs[instanceId]) {
      _expandedLogs[instanceId] = false;
      if (_logTimers[instanceId]) {
        clearInterval(_logTimers[instanceId]);
        delete _logTimers[instanceId];
      }
      var el = document.getElementById(elId);
      if (el) el.classList.remove('visible');
      var card = document.querySelector('.instance-card[data-instance="' + instanceId + '"]');
      if (card) {
        var btn = card.querySelector('.log-toggle');
        if (btn) btn.classList.remove('active');
      }
    } else {
      _expandedLogs[instanceId] = true;
      var el = document.getElementById(elId);
      if (el) el.classList.add('visible');
      var card = document.querySelector('.instance-card[data-instance="' + instanceId + '"]');
      if (card) {
        var btn = card.querySelector('.log-toggle');
        if (btn) btn.classList.add('active');
      }
      fetchLog(instanceId);
      if (!_logTimers[instanceId]) {
        _logTimers[instanceId] = setInterval(function() {
          if (_expandedLogs[instanceId]) {
            fetchLog(instanceId);
          }
        }, 3000);
      }
    }
  };

  async function fetchLog(instanceId) {
    try {
      var resp = await apiFetch('/api/admin/llm/log/' + encodeURIComponent(instanceId));
      if (!resp.ok) return;
      var data = await resp.json();
      var elId = 'log-' + instanceId.replace(/:/g, '_');
      var el = document.getElementById(elId);
      if (el) {
        var wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 20;
        el.textContent = data.log || '(no log output)';
        if (wasAtBottom) {
          el.scrollTop = el.scrollHeight;
        }
      }
    } catch (e) {
      // silent
    }
  }

  // ── Chat ──
  window._llmChatWith = function(instanceId) {
    $chatSection.style.display = '';
    $chatInstanceSelect.value = instanceId;
    switchChatInstance(instanceId);
    $chatSection.scrollIntoView({behavior: 'smooth'});
  };

  function updateChatInstanceSelect() {
    var current = $chatInstanceSelect.value;
    $chatInstanceSelect.innerHTML = '<option value="">-- select a running instance --</option>';
    Object.keys(_runningInstances).forEach(function(iid) {
      var inst = _runningInstances[iid];
      var opt = document.createElement('option');
      opt.value = iid;
      opt.textContent = inst.model + ' (:' + inst.port + ')';
      $chatInstanceSelect.appendChild(opt);
    });
    // Restore selection if still running
    if (current && _runningInstances[current]) {
      $chatInstanceSelect.value = current;
    }
  }

  $chatInstanceSelect.addEventListener('change', function() {
    switchChatInstance(this.value);
  });

  function switchChatInstance(instanceId) {
    renderChatMessages(instanceId);
  }

  function renderChatMessages(instanceId) {
    var history = instanceId ? (_chatHistories[instanceId] || []) : [];
    if (!history.length) {
      $chatMessages.innerHTML = '<div class="chat-empty">Send a message to start chatting.</div>';
      return;
    }
    $chatMessages.innerHTML = '';
    history.forEach(function(msg) {
      var div = document.createElement('div');
      div.className = 'chat-msg ' + msg.role;
      div.textContent = msg.content;
      $chatMessages.appendChild(div);
    });
    $chatMessages.scrollTop = $chatMessages.scrollHeight;
  }

  function appendChatMsg(instanceId, role, text) {
    if (!_chatHistories[instanceId]) _chatHistories[instanceId] = [];
    _chatHistories[instanceId].push({role: role, content: text});

    // Only render if this instance is selected
    if ($chatInstanceSelect.value !== instanceId) return null;

    var empty = $chatMessages.querySelector('.chat-empty');
    if (empty) empty.remove();
    var div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    $chatMessages.appendChild(div);
    $chatMessages.scrollTop = $chatMessages.scrollHeight;
    return div;
  }

  $chatClearBtn.addEventListener('click', function() {
    var instanceId = $chatInstanceSelect.value;
    if (instanceId) {
      _chatHistories[instanceId] = [];
    }
    renderChatMessages(instanceId);
  });

  // ── Fullscreen toggle ──
  var $chatFullscreenBtn = document.getElementById('chatFullscreenBtn');
  $chatFullscreenBtn.addEventListener('click', function() {
    $chatSection.classList.toggle('fullscreen');
    var isFull = $chatSection.classList.contains('fullscreen');
    this.innerHTML = isFull ? '&#x2716;' : '&#x26F6;';
    this.title = isFull ? 'Exit fullscreen' : 'Toggle fullscreen';
    $chatMessages.scrollTop = $chatMessages.scrollHeight;
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && $chatSection.classList.contains('fullscreen')) {
      $chatSection.classList.remove('fullscreen');
      $chatFullscreenBtn.innerHTML = '&#x26F6;';
      $chatFullscreenBtn.title = 'Toggle fullscreen';
    }
  });

  $chatSendBtn.addEventListener('click', sendChat);
  $chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  async function sendChat() {
    var text = $chatInput.value.trim();
    var instanceId = $chatInstanceSelect.value;
    if (!text || !instanceId || _streaming) return;

    if (!_runningInstances[instanceId]) {
      showToast('Instance is not running', 3000, 'error');
      return;
    }

    $chatInput.value = '';
    appendChatMsg(instanceId, 'user', text);

    if (!_chatHistories[instanceId]) _chatHistories[instanceId] = [];
    var messages = _chatHistories[instanceId]
      .filter(function(m) { return m.role === 'user' || m.role === 'assistant'; })
      .map(function(m) { return {role: m.role, content: m.content}; });

    $chatSendBtn.disabled = true;
    $chatSendBtn.innerHTML = '<span class="spinner sm"></span>';
    _streaming = true;

    try {
      var resp = await apiFetch('/api/admin/llm/chat', {
        method: 'POST',
        body: {
          instance_id: instanceId,
          messages: messages,
          temperature: parseFloat($chatTemp.value) || 0.7,
          stream: true,
        },
        raw: true,
      });

      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        appendChatMsg(instanceId, 'error', 'Error: ' + (err.detail || err.error || resp.status));
        // Remove last user message from history since it failed
        if (_chatHistories[instanceId]) _chatHistories[instanceId].pop();
        _streaming = false;
        $chatSendBtn.disabled = false;
        $chatSendBtn.textContent = 'Send';
        return;
      }

      // Create assistant message element for streaming
      var empty = $chatMessages.querySelector('.chat-empty');
      if (empty) empty.remove();
      var assistantDiv = document.createElement('div');
      assistantDiv.className = 'chat-msg assistant';
      assistantDiv.textContent = '';
      if ($chatInstanceSelect.value === instanceId) {
        $chatMessages.appendChild(assistantDiv);
      }

      var fullContent = '';
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';

      while (true) {
        var result = await reader.read();
        if (result.done) break;

        buffer += decoder.decode(result.value, {stream: true});
        var lines = buffer.split('\n');
        buffer = lines.pop();  // keep incomplete line in buffer

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line || !line.startsWith('data:')) continue;
          var payload = line.substring(5).trim();
          if (payload === '[DONE]') continue;

          try {
            var chunk = JSON.parse(payload);
            var delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
            if (delta && delta.content) {
              fullContent += delta.content;
              assistantDiv.textContent = fullContent;
              $chatMessages.scrollTop = $chatMessages.scrollHeight;
            }
          } catch (parseErr) {
            // skip unparseable lines
          }
        }
      }

      // Store completed message in history
      if (!_chatHistories[instanceId]) _chatHistories[instanceId] = [];
      _chatHistories[instanceId].push({role: 'assistant', content: fullContent || '(empty response)'});
      if (!fullContent) {
        assistantDiv.textContent = '(empty response)';
      }

    } catch (e) {
      if (e.message !== 'auth') {
        appendChatMsg(instanceId, 'error', 'Error: ' + e.message);
      }
      // Remove last user message from history since it failed
      if (_chatHistories[instanceId] && _chatHistories[instanceId].length && _chatHistories[instanceId][_chatHistories[instanceId].length - 1].role === 'user') {
        _chatHistories[instanceId].pop();
      }
    }

    _streaming = false;
    $chatSendBtn.disabled = false;
    $chatSendBtn.textContent = 'Send';
  }

  // ── Polling ──
  function startPoll() {
    _statusTimer = setInterval(loadStatus, 3000);
  }

  // ── Boot ──
  loadModels();
  loadStatus();
  startPoll();
})();
</script>
</body>
</html>
