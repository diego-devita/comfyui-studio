<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Studio — Assets</title>
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/icons.css">
<style>
  /* ── Live indicator ── */
  /* (base styles in components.css) */

  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .tab {
    padding: 10px 24px;
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-info {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .asset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }

  .asset-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
  }
  .asset-card:hover { border-color: var(--accent); }
  .asset-card.selected { border-color: var(--error); background: rgba(255,68,102,0.05); }
  .asset-check {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 2;
    accent-color: var(--error);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .studio-badge {
    font-weight: 600;
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 2;
    font-family: var(--mono);
    font-size: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 10px;
    background: rgba(232, 255, 71, 0.85);
    color: black;
    border: 1px solid rgba(232, 255, 71, 0.3);
  }

  .asset-thumb {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--bg);
    display: block;
  }
  .asset-thumb-video {
    width: 100%;
    aspect-ratio: 1;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 32px;
  }

  .asset-info {
    padding: 8px 10px;
  }
  .asset-name {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .asset-meta {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    margin-top: 2px;
  }

  .asset-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 20000;
    cursor: pointer;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 12px;
  }
  .asset-overlay.visible { display: flex; }
  .asset-overlay img, .asset-overlay video {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .asset-overlay-info {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="main-nav">
  <a href="/home" class="nav-link">Home</a>
  <a href="/admin/nodes" class="nav-link">Nodes</a>
  <a href="/admin/models" class="nav-link">Models</a>
  <a href="/admin/loras" class="nav-link">LoRAs</a>
  <a href="/admin/workflows" class="nav-link">Workflows</a>
  <a href="/admin/presets" class="nav-link">Presets</a>
  <a href="/admin/queue" class="nav-link">Queue</a>
  <a href="/admin/history" class="nav-link">History</a>
  <a href="/admin/assets" class="nav-link active">Assets</a>
  <a href="/admin/llm" class="nav-link">LLM</a>
  <a href="/admin/settings" class="nav-link"><span class="icon icon-gear icon-lg"></span></a>
  <a href="#" class="nav-link nav-activity" id="activityToggle" onclick="event.preventDefault()"><span class="icon icon-bell icon-lg"></span><span class="activity-dot" id="activityDot"></span></a>
  <a href="#" class="nav-link nav-logout" onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>window.location='/login')"><span class="icon icon-logout icon-lg"></span></a>
</nav>


<!-- Header -->
<header>
  <div class="logo">ComfyUI <span class="studio-word">Studio<span class="beta-badge">BETA</span></span> <small>Assets</small></div>
  <div class="live-indicator" id="liveIndicator" title="Auto-refreshing · Click to refresh now">
    <span class="live-dot"></span>
    <span>LIVE</span>
    <div class="live-bar" id="liveBar"></div>
  </div>
</header>

<!-- Main content -->
<main>
  <div class="tabs">
    <button class="tab active" data-tab="inputs">Inputs</button>
    <button class="tab" data-tab="outputs">Outputs</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <div style="display:flex;gap:12px;align-items:center;">
      <div class="tab-info" id="tabInfo" style="margin-bottom:0;">Loading...</div>
      <label class="btn btn--sm" id="uploadInputBtn" style="display:none;cursor:pointer;">
        Upload
        <input type="file" id="uploadInputFile" accept="image/*" multiple style="display:none;">
      </label>
      <button class="btn btn--sm" id="downloadAllBtn" style="display:none;">Download ZIP</button>
    </div>
    <div id="assetsToolbar" class="select-toolbar" style="display:none;">
      <div class="select-toolbar-left">
        <label class="select-all-label">
          <input type="checkbox" class="select-all-cb" id="selectAll"> Select all
        </label>
        <span class="select-count" id="assetSelectCount"></span>
      </div>
      <button class="btn btn--danger btn--sm" id="deleteBtn" style="visibility:hidden;">Delete selected</button>
    </div>
  </div>

  <div class="loading-state" id="loadingState">
    <span class="spinner"></span>
    Loading assets...
  </div>

  <div class="asset-grid" id="assetGrid"></div>
</main>

<!-- Fullscreen overlay -->
<div class="asset-overlay" id="assetOverlay">
  <div id="assetOverlayContent"></div>
  <div class="asset-overlay-info" id="assetOverlayInfo"></div>
</div>

<script src="/static/js/shared.js"></script>
<script>
(function() {
  // ── Page-specific formatters ──
  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
    return (bytes / 1073741824).toFixed(1) + ' GB';
  }

  function fmtDateUnix(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    return d.toISOString().replace('T', ' ').substring(0, 16);
  }

  var $tabs = document.querySelectorAll('.tab');
  var $tabInfo = document.getElementById('tabInfo');
  var $loading = document.getElementById('loadingState');
  var $grid = document.getElementById('assetGrid');
  var $overlay = document.getElementById('assetOverlay');
  var $overlayContent = document.getElementById('assetOverlayContent');
  var $overlayInfo = document.getElementById('assetOverlayInfo');

  var $selectAll = document.getElementById('selectAll');
  var $deleteBtn = document.getElementById('deleteBtn');
  var $downloadAllBtn = document.getElementById('downloadAllBtn');
  var currentTab = 'inputs';
  var lastClickedIndex = null;

  $tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      $tabs.forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      $selectAll.checked = false;
      lastClickedIndex = null;
      $downloadAllBtn.style.display = currentTab === 'outputs' ? '' : 'none';
      document.getElementById('uploadInputBtn').style.display = currentTab === 'inputs' ? '' : 'none';
      loadAssets();
    });
  });

  $selectAll.addEventListener('change', function() {
    $grid.querySelectorAll('.asset-check').forEach(function(cb) {
      cb.checked = $selectAll.checked;
      cb.closest('.asset-card').classList.toggle('selected', $selectAll.checked);
    });
    updateDeleteBtn();
  });

  function toggleCard(card) {
    var cb = card.querySelector('.asset-check');
    cb.checked = !cb.checked;
    card.classList.toggle('selected', cb.checked);
    lastClickedIndex = parseInt(card.dataset.index);
    updateDeleteBtn();
  }

  function rangeSelect(card) {
    var from = Math.min(lastClickedIndex, parseInt(card.dataset.index));
    var to = Math.max(lastClickedIndex, parseInt(card.dataset.index));
    $grid.querySelectorAll('.asset-card').forEach(function(c) {
      var idx = parseInt(c.dataset.index);
      if (idx >= from && idx <= to) {
        var cb = c.querySelector('.asset-check');
        cb.checked = true;
        c.classList.add('selected');
      }
    });
    updateDeleteBtn();
  }

  var $assetSelectCount = document.getElementById('assetSelectCount');
  function updateDeleteBtn() {
    var count = $grid.querySelectorAll('.asset-check:checked').length;
    $deleteBtn.style.visibility = count > 0 ? 'visible' : 'hidden';
    $deleteBtn.textContent = 'Delete ' + count;
    $assetSelectCount.textContent = count > 0 ? count + ' selected' : '';
  }

  $deleteBtn.addEventListener('click', async function() {
    var checked = $grid.querySelectorAll('.asset-check:checked');
    var paths = [];
    checked.forEach(function(cb) { paths.push(cb.dataset.path); });
    if (paths.length === 0) return;
    if (!await studioConfirm('Delete ' + paths.length + ' item(s)? This cannot be undone.', {danger: true, yes: 'Delete'})) return;

    $deleteBtn.disabled = true;
    $deleteBtn.textContent = 'Deleting...';

    apiFetch('/api/admin/assets/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: currentTab, files: paths})
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      $deleteBtn.disabled = false;
      $deleteBtn.textContent = 'Delete selected';
      $deleteBtn.style.visibility = 'hidden';
      $selectAll.checked = false;
      loadAssets();
    })
    .catch(function(e) {
      $deleteBtn.disabled = false;
      if (e.message !== 'auth') showToast('Delete failed: ' + e.message, 5000, 'error');
    });
  });

  document.getElementById('uploadInputFile').addEventListener('change', function(e) {
    var files = e.target.files;
    if (!files || files.length === 0) return;
    var formData = new FormData();
    for (var i = 0; i < files.length; i++) {
      formData.append('files', files[i]);
    }
    var btn = document.getElementById('uploadInputBtn');
    btn.style.opacity = '0.5';
    btn.style.pointerEvents = 'none';

    apiFetch('/api/admin/assets/upload-inputs', {method: 'POST', body: formData})
      .then(function(r) { return r.json(); })
      .then(function(data) {
        btn.style.opacity = '1';
        btn.style.pointerEvents = '';
        e.target.value = '';
        loadAssets();
      })
      .catch(function(err) {
        btn.style.opacity = '1';
        btn.style.pointerEvents = '';
        if (err.message !== 'auth') showToast('Upload failed: ' + err.message, 5000, 'error');
      });
  });

  $downloadAllBtn.addEventListener('click', function() {
    $downloadAllBtn.disabled = true;
    $downloadAllBtn.textContent = 'Preparing...';
    var a = document.createElement('a');
    a.href = '/api/admin/outputs-zip';
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() {
      $downloadAllBtn.disabled = false;
      $downloadAllBtn.textContent = 'Download ZIP';
    }, 3000);
  });

  $overlay.addEventListener('click', function() {
    $overlay.classList.remove('visible');
    // Stop video if playing
    var vid = $overlay.querySelector('video');
    if (vid) vid.pause();
  });

  var _lastAssetHash = '';

  function loadAssets(isRefresh) {
    if (!isRefresh) {
      $loading.style.display = '';
      $grid.innerHTML = '';
      $tabInfo.textContent = 'Loading...';
    }

    apiFetch('/api/admin/assets/' + currentTab)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        $loading.style.display = 'none';
        var files = data.files || [];
        var studioJobs = data.studio_jobs || [];

        // Skip rebuild if nothing changed (prevents flash)
        var hash = files.length + ':' + studioJobs.length + ':' + (data.total_size || 0);
        if (isRefresh && hash === _lastAssetHash) return;
        _lastAssetHash = hash;
        var comfyType = currentTab === 'inputs' ? 'input' : 'output';

        var counts = [];
        if (studioJobs.length > 0) counts.push(studioJobs.length + ' studio');
        if (files.length > 0) counts.push(files.length + ' files');
        $tabInfo.textContent = (counts.join(' + ') || '0 files') + ' \u00b7 ' + fmtSize(data.total_size || 0);

        if (files.length === 0 && studioJobs.length === 0) {
          $grid.innerHTML = '<div style="color:var(--muted);font-size:13px;grid-column:1/-1;">No files found.</div>';
          document.getElementById('assetsToolbar').style.display = 'none';
          return;
        }
        document.getElementById('assetsToolbar').style.display = 'flex';

        // Build unified items list: studio jobs first, then regular files
        var allItems = [];
        studioJobs.forEach(function(sj) { allItems.push({_kind: sj.type || 'studio_job', data: sj}); });
        files.forEach(function(f) { allItems.push({_kind: 'file', data: f}); });

        allItems.forEach(function(item, idx) {
          var card = document.createElement('div');
          card.className = 'asset-card';
          card.dataset.index = idx;

          if (item._kind === 'studio_gallery') {
            var sj = item.data;
            var checkPath = sj.folder_path;
            var checkHtml = '<input type="checkbox" class="asset-check" data-path="' + checkPath + '" onclick="event.stopPropagation();">';
            var galBadgeStyle = sj.incomplete ? 'background:var(--accent);color:#0a0a0f;' : '';
            var badgeHtml = '<span class="studio-badge" style="' + galBadgeStyle + '">' + (sj.incomplete ? '\u23F3 ' : '') + sj.image_count + ' images</span>';
            if (sj.incomplete) { card.style.borderColor = 'var(--accent)'; card.style.opacity = '0.7'; }

            if (sj.thumbnail) {
              var thumbUrl = '/api/comfyui/view?filename=' + encodeURIComponent(sj.thumbnail.filename) +
                '&type=output&subfolder=' + encodeURIComponent(sj.thumbnail.subfolder);
              card.innerHTML = checkHtml + badgeHtml +
                '<img class="asset-thumb" src="' + thumbUrl + '" loading="lazy">' +
                '<div class="asset-info">' +
                  '<div class="asset-name" title="' + sj.folder_path + '">' + sj.folder + '</div>' +
                  '<div class="asset-meta">' + fmtSize(sj.total_size) + ' \u00b7 ' + fmtDateUnix(sj.modified) + '</div>' +
                '</div>';
            } else {
              card.innerHTML = checkHtml + badgeHtml +
                '<div class="asset-thumb-video" style="font-size:24px;"><svg width="24" height="24" viewBox="0 0 512 512" fill="currentColor"><path d="M0 96C0 60.7 28.7 32 64 32l384 0c35.3 0 64 28.7 64 64l0 320c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 96zM323.8 202.5c-4.5-6.6-11.9-10.5-19.8-10.5s-15.4 3.9-19.8 10.5l-87 127.6L170.7 297c-4.6-5.7-11.5-9-18.7-9s-14.2 3.3-18.7 9l-64 80c-5.8 7.2-6.9 17.1-2.9 25.4s12.4 13.6 21.6 13.6l96 0 32 0 208 0c8.9 0 17.1-4.9 21.2-12.8s3.6-17.4-1.4-24.7l-120-176zM112 192a48 48 0 1 0 0-96 48 48 0 1 0 0 96z"/></svg></div>' +
                '<div class="asset-info">' +
                  '<div class="asset-name" title="' + sj.folder_path + '">' + sj.folder + '</div>' +
                  '<div class="asset-meta">' + fmtSize(sj.total_size) + ' \u00b7 ' + fmtDateUnix(sj.modified) + '</div>' +
                '</div>';
            }

            card.onclick = (function(sjData) {
              return function(e) {
                if (e.target.classList.contains('asset-check')) return;
                if (e.ctrlKey || e.metaKey) { toggleCard(card); return; }
                if (e.shiftKey && lastClickedIndex !== null) { rangeSelect(card); return; }
                showGallery(sjData);
              };
            })(sj);

          } else if (item._kind === 'studio_job') {
            var sj = item.data;
            var checkPath = sj.folder_path;
            var checkHtml = '<input type="checkbox" class="asset-check" data-path="' + checkPath + '" onclick="event.stopPropagation();">';
            var badges = [];
            if (sj.incomplete) badges.push('\u23F3 In Progress');
            if (sj.video_count) badges.push(sj.video_count + ' video');
            if (sj.image_count) badges.push(sj.image_count + ' img');
            if (sj.preview_count) badges.push(sj.preview_count + ' preview');
            if (sj.intermediate_count) badges.push(sj.intermediate_count + ' inter.');
            var badgeStyle = sj.incomplete ? 'background:var(--accent);color:#0a0a0f;' : '';
            var badgeHtml = '<span class="studio-badge" style="' + badgeStyle + '">' + (badges.join(' · ') || 'Video') + '</span>';
            if (sj.incomplete) { card.style.borderColor = 'var(--accent)'; card.style.opacity = '0.7'; }

            if (sj.thumbnail) {
              var thumbUrl = '/api/comfyui/view?filename=' + encodeURIComponent(sj.thumbnail.filename) +
                '&type=output&subfolder=' + encodeURIComponent(sj.thumbnail.subfolder);
              card.innerHTML = checkHtml + badgeHtml +
                '<img class="asset-thumb" src="' + thumbUrl + '" loading="lazy">' +
                '<div class="asset-info">' +
                  '<div class="asset-name" title="' + sj.folder_path + '">' + sj.folder + '</div>' +
                  '<div class="asset-meta">' + fmtSize(sj.total_size) + ' \u00b7 ' + fmtDateUnix(sj.modified) + '</div>' +
                '</div>';
            } else {
              card.innerHTML = checkHtml + badgeHtml +
                '<div class="asset-thumb-video">&#9654;</div>' +
                '<div class="asset-info">' +
                  '<div class="asset-name" title="' + sj.folder_path + '">' + sj.folder + '</div>' +
                  '<div class="asset-meta">' + fmtSize(sj.total_size) + ' \u00b7 ' + fmtDateUnix(sj.modified) + '</div>' +
                '</div>';
            }

            var videoUrl = '/api/comfyui/view?filename=' + encodeURIComponent(sj.video.filename) +
              '&type=output&subfolder=' + encodeURIComponent(sj.video.subfolder);

            card.onclick = function(e) {
              if (e.target.classList.contains('asset-check')) return;
              if (e.ctrlKey || e.metaKey) { toggleCard(card); return; }
              if (e.shiftKey && lastClickedIndex !== null) { rangeSelect(card); return; }
              showAsset({type: 'video', path: sj.folder_path, size: sj.total_size, modified: sj.modified}, videoUrl);
            };

          } else {
            var f = item.data;
            var viewUrl = '/api/comfyui/view?filename=' + encodeURIComponent(f.filename) +
              '&type=' + comfyType +
              (f.subfolder ? '&subfolder=' + encodeURIComponent(f.subfolder) : '');
            var checkHtml = '<input type="checkbox" class="asset-check" data-path="' + f.path + '" onclick="event.stopPropagation();">';

            if (f.type === 'image') {
              card.innerHTML = checkHtml +
                '<img class="asset-thumb" src="' + viewUrl + '" loading="lazy">' +
                '<div class="asset-info">' +
                  '<div class="asset-name" title="' + f.path + '">' + f.filename + '</div>' +
                  '<div class="asset-meta">' + fmtSize(f.size) + ' \u00b7 ' + fmtDateUnix(f.modified) + '</div>' +
                '</div>';
            } else {
              card.innerHTML = checkHtml +
                '<div class="asset-thumb-video">&#9654;</div>' +
                '<div class="asset-info">' +
                  '<div class="asset-name" title="' + f.path + '">' + f.filename + '</div>' +
                  '<div class="asset-meta">' + fmtSize(f.size) + ' \u00b7 ' + fmtDateUnix(f.modified) + '</div>' +
                '</div>';
            }

            card.onclick = function(e) {
              if (e.target.classList.contains('asset-check')) return;
              if (e.ctrlKey || e.metaKey) { toggleCard(card); return; }
              if (e.shiftKey && lastClickedIndex !== null) { rangeSelect(card); return; }
              showAsset(f, viewUrl);
            };
          }

          var cb = card.querySelector('.asset-check');
          cb.addEventListener('change', function() {
            card.classList.toggle('selected', cb.checked);
            lastClickedIndex = parseInt(card.dataset.index);
            updateDeleteBtn();
          });
          $grid.appendChild(card);
        });
      })
      .catch(function(e) {
        $loading.style.display = 'none';
        if (e.message !== 'auth') {
          $tabInfo.textContent = 'Error loading assets';
        }
      });
  }

  function showAsset(f, url) {
    if (f.type === 'video') {
      $overlayContent.innerHTML = '<video controls autoplay loop src="' + url + '"></video>';
    } else {
      $overlayContent.innerHTML = '<img src="' + url + '">';
    }
    $overlayInfo.textContent = f.path + ' \u00b7 ' + fmtSize(f.size) + ' \u00b7 ' + fmtDateUnix(f.modified);
    $overlay.classList.add('visible');
  }

  function showGallery(sjData) {
    var images = sjData.images || [];
    if (images.length === 0) return;
    var currentIdx = 0;
    var mode = 'grid'; // 'grid' or 'single'
    var thumbSize = 150;

    function imgUrl(img) {
      return '/api/comfyui/view?filename=' + encodeURIComponent(img.filename) +
        '&type=output&subfolder=' + encodeURIComponent(img.subfolder);
    }

    function renderGrid() {
      mode = 'grid';
      $overlayContent.innerHTML =
        '<div style="display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;" onclick="event.stopPropagation();">' +
          '<div style="display:flex;align-items:center;gap:12px;padding:8px 12px;flex-shrink:0;">' +
            '<span style="font-size:11px;color:var(--muted);font-family:var(--mono);">Size</span>' +
            '<input type="range" id="galSizeSlider" min="80" max="400" value="' + thumbSize + '" style="width:140px;accent-color:var(--accent);">' +
            '<span id="galSizeVal" style="font-size:11px;color:var(--muted);font-family:var(--mono);min-width:32px;">' + thumbSize + 'px</span>' +
          '</div>' +
          '<div id="galGrid" style="display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;overflow-y:auto;flex:1;align-content:flex-start;"></div>' +
        '</div>';

      var $grid = document.getElementById('galGrid');
      var $slider = document.getElementById('galSizeSlider');
      var $sizeVal = document.getElementById('galSizeVal');

      function fillGrid() {
        $grid.innerHTML = '';
        images.forEach(function(img, idx) {
          var thumb = document.createElement('img');
          thumb.src = imgUrl(img);
          thumb.loading = 'lazy';
          thumb.style.cssText = 'width:' + thumbSize + 'px;height:' + thumbSize + 'px;object-fit:cover;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:border-color 0.15s;';
          thumb.onmouseenter = function() { this.style.borderColor = 'var(--accent)'; };
          thumb.onmouseleave = function() { this.style.borderColor = 'transparent'; };
          thumb.onclick = function(e) { e.stopPropagation(); currentIdx = idx; renderSingle(); };
          $grid.appendChild(thumb);
        });
      }
      fillGrid();

      $slider.oninput = function() {
        thumbSize = parseInt(this.value);
        $sizeVal.textContent = thumbSize + 'px';
        $grid.querySelectorAll('img').forEach(function(img) {
          img.style.width = thumbSize + 'px';
          img.style.height = thumbSize + 'px';
        });
      };

      $overlayInfo.textContent = sjData.folder + ' \u00b7 ' + images.length + ' images \u00b7 ' + fmtSize(sjData.total_size);
    }

    function renderSingle() {
      mode = 'single';
      var img = images[currentIdx];
      $overlayContent.innerHTML =
        '<div style="position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;" onclick="event.stopPropagation();">' +
          '<button id="galBack" style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);border:none;color:#fff;font-size:13px;cursor:pointer;padding:6px 14px;border-radius:6px;z-index:10;font-family:var(--mono);">&larr; Grid</button>' +
          '<button id="galPrev" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.6);border:none;color:#fff;font-size:28px;cursor:pointer;padding:8px 14px;border-radius:8px;z-index:10;">&lsaquo;</button>' +
          '<img src="' + imgUrl(img) + '" style="max-width:90%;max-height:90%;object-fit:contain;">' +
          '<button id="galNext" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.6);border:none;color:#fff;font-size:28px;cursor:pointer;padding:8px 14px;border-radius:8px;z-index:10;">&rsaquo;</button>' +
        '</div>';
      $overlayInfo.textContent = sjData.folder + ' \u00b7 ' + (currentIdx + 1) + '/' + images.length + ' \u00b7 ' + img.filename;

      document.getElementById('galBack').onclick = function(e) { e.stopPropagation(); renderGrid(); };
      document.getElementById('galPrev').onclick = function(e) { e.stopPropagation(); currentIdx = (currentIdx - 1 + images.length) % images.length; renderSingle(); };
      document.getElementById('galNext').onclick = function(e) { e.stopPropagation(); currentIdx = (currentIdx + 1) % images.length; renderSingle(); };
    }

    renderGrid();
    $overlay.classList.add('visible');

    function onKey(e) {
      if (!$overlay.classList.contains('visible')) { document.removeEventListener('keydown', onKey); return; }
      if (mode === 'single') {
        if (e.key === 'ArrowLeft') { currentIdx = (currentIdx - 1 + images.length) % images.length; renderSingle(); }
        else if (e.key === 'ArrowRight') { currentIdx = (currentIdx + 1) % images.length; renderSingle(); }
        else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); renderGrid(); }
      }
    }
    document.addEventListener('keydown', onKey);
  }

  // ── Live auto-refresh ──
  var POLL_MS = 5000;
  var $liveBar = document.getElementById('liveBar');

  function startLiveBar() {
    $liveBar.style.transition = 'none';
    $liveBar.style.transform = 'scaleX(0)';
    $liveBar.offsetHeight;
    $liveBar.style.transition = 'transform ' + POLL_MS + 'ms linear';
    $liveBar.style.transform = 'scaleX(1)';
  }

  document.getElementById('liveIndicator').addEventListener('click', function() {
    loadAssets(true);
    startLiveBar();
  });

  setInterval(function() { loadAssets(true); startLiveBar(); }, POLL_MS);

  // Initial state
  document.getElementById('uploadInputBtn').style.display = currentTab === 'inputs' ? '' : 'none';
  loadAssets();
  startLiveBar();

})();
</script>
</body>
</html>
