<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Studio — LoRAs</title>
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/icons.css">
<style>
  .card-thumb { overflow: hidden; border-radius: var(--radius-sm) var(--radius-sm) 0 0; position: relative; }
  .card-thumb img { width: 100%; display: block; object-fit: cover; max-height: 160px; }
  .gallery-stats-banner { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); color: #fff; font-family: var(--mono); font-size: 9px; padding: 2px 6px; border-radius: 3px; white-space: nowrap; pointer-events: none; }
  .group-badge { display: inline-block; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 4px; background: rgba(232,255,71,0.15); color: var(--accent); vertical-align: middle; margin-right: 4px; }
  .model-badge { display: inline-block; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 4px; background: rgba(100,149,237,0.15); color: #6495ed; vertical-align: middle; margin-right: 4px; }
  .group-count-boing { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; border-radius: 12px; background: var(--accent); color: var(--bg); font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 0 6px; vertical-align: middle; }
  .lora-group-card { border-color: rgba(232,255,71,0.2); }
  /* ── Status badge override (icon-only, no border/padding) ── */
  .status-badge {
    font-size: 16px;
    cursor: help;
    flex-shrink: 0;
    align-self: flex-start;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
    font-family: inherit;
    letter-spacing: normal;
    text-transform: none;
    padding: 0;
    border: none;
  }
  .status-badge.present     { color: var(--success); }
  .status-badge.missing     { color: var(--muted); }
  .status-badge.queued      { color: var(--queued); animation: pulse 2s ease-in-out infinite; }
  .status-badge.downloading { color: var(--accent); }
  .status-badge.error       { color: var(--error); }

  /* ── Overlay shared ── */
  .civitai-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000;
    overflow-y: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start;
  }
  .civitai-dialog {
    background: var(--bg-card, #1a1a2e); border-radius: 12px; max-width: 960px; width: 100%;
    padding: 24px; position: relative; margin-top: 20px;
  }
  .civitai-close {
    position: absolute; top: 10px; right: 14px; background: none; border: none;
    color: var(--muted); font-size: 26px; cursor: pointer; line-height: 1;
  }
  .civitai-close:hover { color: var(--text); }

  /* ── Lookup dialog ── */
  .lookup-url-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .lookup-url-row input {
    flex: 1; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .lookup-info { margin-bottom: 12px; }
  .lookup-info h3 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: baseline; gap: 10px; }
  .lookup-info h3 .author { color: var(--muted); font-size: 13px; font-weight: normal; }
  .lookup-stats { display: flex; gap: 16px; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .lookup-stats .stars { color: #f5a623; }
  .lookup-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .lookup-pill {
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  }
  .lookup-pill.trigger {
    background: rgba(121, 80, 242, 0.15); color: #b197fc; border-color: transparent;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.25px; font-size: 10px;
    cursor: pointer; padding: 3px 8px;
  }
  .lookup-pill.trigger:hover { background: rgba(121, 80, 242, 0.25); }
  .lookup-images {
    display: flex; flex-wrap: wrap;
    gap: 4px; margin-bottom: 16px; max-height: 320px; overflow-y: auto;
  }
  .lookup-images .gallery-thumb { width: 100px; height: 100px; }
  .lookup-images .gallery-thumb img, .lookup-images .gallery-thumb video { width: 100px; height: 100px; }
  .lookup-images .gallery-thumb .thumb-img { width: 100px; height: 100px; }
  .lookup-versions { margin-bottom: 16px; max-height: 300px; overflow-y: auto; }
  .lookup-version {
    display: flex; align-items: center; gap: 8px; padding: 8px 4px;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .lookup-version label { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; min-width: 0; }
  .lookup-version .ver-name { font-weight: 500; min-width: 100px; flex-shrink: 0; }
  .lookup-version .ver-file { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lookup-version .ver-size { color: var(--muted); min-width: 60px; text-align: right; flex-shrink: 0; }
  .lookup-version .ver-base {
    font-size: 11px; padding: 1px 6px; border-radius: 8px;
    background: var(--bg); color: var(--muted); flex-shrink: 0;
  }
  .lookup-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px; }

  /* ── Image modal ── */
  .img-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .img-modal-inner {
    display: flex; gap: 20px; max-width: 1100px; max-height: calc(100vh - 40px); width: 100%;
  }
  .img-modal-inner > img { max-width: 60%; max-height: calc(100vh - 80px); object-fit: contain; border-radius: 8px; }

  /* ── Gallery ── */
  .gallery-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .gallery-header h3 { margin: 0; font-size: 18px; }
  .gallery-count { background: #ff8f47; padding: 0 5px 2px 5px; border-radius: 5px; font-weight: 600; color: black; font-size: 13px; }
  .gallery-progress { margin-bottom: 10px; }
  .gallery-progress .progress-bar { height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
  .gallery-progress .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .gallery-progress .progress-fill.indeterminate { width: 30% !important; animation: indeterminate 1.5s infinite ease-in-out; }
  @keyframes indeterminate { 0% { margin-left: 0 } 50% { margin-left: 70% } 100% { margin-left: 0 } }
  .gallery-progress .progress-text { font-size: 12px; color: var(--muted); }
  .gallery-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .gallery-filters select { padding: 4px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px; }
  .gallery-urls { font-size: 11px; color: var(--muted); margin-bottom: 10px; word-break: break-all; line-height: 1.8; }
  .gallery-urls code { background: var(--bg); padding: 2px 5px; border-radius: 3px; }
  .gallery-urls .copy-btn { background: none; border: none; cursor: pointer; padding: 2px 4px; vertical-align: middle; opacity: 0.5; }
  .gallery-urls .copy-btn:hover { opacity: 1; }
  .gallery-urls .copy-btn svg { width: 14px; height: 14px; fill: var(--muted); vertical-align: middle; }
  .gallery-urls .copied-flash { color: var(--accent); font-size: 11px; margin-left: 4px; }
  #galleryGrid { max-height: calc(100vh - 400px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #galleryGrid::-webkit-scrollbar { width: 6px; }
  #galleryGrid::-webkit-scrollbar-track { background: transparent; }
  #galleryGrid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #galleryGrid::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .gallery-section-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .gallery-hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .gallery-section { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .gallery-thumb { position: relative; width: 150px; height: 150px; cursor: pointer; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
  .gallery-thumb img, .gallery-thumb video { width: 150px; height: 150px; object-fit: cover; display: block; }
  .gallery-thumb .play-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.15); opacity: 1; transition: opacity 0.15s; pointer-events: none;
  }
  .gallery-thumb .play-overlay svg { width: 32px; height: 32px; fill: rgba(255,255,255,0.85); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
  .gallery-thumb.playing .play-overlay { opacity: 0; }
  .gallery-thumb:hover .play-overlay { opacity: 1 !important; }
  .gallery-thumb .expand-btn {
    position: absolute; top: 4px; right: 4px; width: 26px; height: 26px;
    background: rgba(0,0,0,0.5); border: none; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s; z-index: 2;
  }
  .gallery-thumb .expand-btn svg { width: 14px; height: 14px; fill: #fff; }
  .gallery-thumb:hover .expand-btn { opacity: 1; }
  .gallery-thumb .thumb-img { width: 150px; height: 150px; object-fit: cover; display: block; border-radius: 4px; background: var(--surface); }
  .gallery-thumb .thumb-idx {
    position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.55);
    color: rgba(255,255,255,0.7); font-size: 10px; padding: 1px 5px;
    border-radius: 3px; pointer-events: none; line-height: 1.4;
  }
  .gallery-thumb .thumb-star {
    position: absolute; top: 4px; left: 4px; width: 18px; height: 18px;
    background: none; border: none; cursor: pointer; padding: 0; z-index: 2;
    opacity: 0.3; transition: opacity 0.15s;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
  }
  .gallery-thumb .thumb-star .icon { width: 14px; height: 14px; background-color: #fff; }
  .gallery-thumb .thumb-star.starred { opacity: 1; }
  .gallery-thumb .thumb-star.starred .icon { background-color: #f5c518; }
  .gallery-thumb:hover .thumb-star { opacity: 0.8; }
  .gallery-thumb.preview-default { outline: 3px solid #4a9eff; outline-offset: -3px; }
  .gallery-thumb.preview-custom { outline: 3px solid #ff4466; outline-offset: -3px; }
  .gallery-thumb.preview-default.preview-custom { outline: 3px solid #4a9eff; box-shadow: inset 0 0 0 3px #ff4466; }
  .detail-star {
    background: none; border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    color: var(--muted); font-size: 12px; transition: all 0.15s;
  }
  .detail-star .icon { width: 14px; height: 14px; background-color: var(--muted); }
  .detail-star.starred { color: #f5c518; border-color: #f5c518; }
  .detail-star.starred .icon { background-color: #f5c518; }
  .gallery-empty { color: var(--muted); padding: 30px; text-align: center; }
  #detailsMetaContent::-webkit-scrollbar { display: none; }
  .detail-meta p { white-space: pre-wrap; word-break: break-word; max-height: none; overflow: visible; }

  /* ── Detail view ── */
  .detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 1100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .detail-content { display: flex; gap: 20px; max-width: 1200px; width: 100%; max-height: calc(100vh - 40px); }
  .detail-image { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .detail-image img { max-width: 100%; max-height: calc(100vh - 80px); object-fit: contain; border-radius: 8px; }
  .detail-meta {
    width: 320px; flex-shrink: 0; overflow-y: auto; background: var(--bg-card, #1a1a2e);
    border-radius: 8px; padding: 16px; font-size: 13px; color: var(--text); max-height: calc(100vh - 80px);
  }
  .detail-meta h4 { margin: 0 0 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .detail-meta p { margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow-y: auto; line-height: 1.5; }
  .detail-meta .meta-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .detail-meta .meta-row span:first-child { color: var(--muted); }
  .detail-meta .meta-loras { margin: 0 0 14px; }
  .detail-meta .meta-loras span { display: block; padding: 2px 0; }
  .detail-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    font-size: 28px; padding: 16px 18px; cursor: pointer; border-radius: 8px; z-index: 10;
  }
  .detail-nav:hover { background: rgba(255,255,255,0.15); }
  .detail-nav.prev { left: 8px; }
  .detail-nav.next { right: 8px; }
  .detail-close {
    position: absolute; top: 10px; right: 16px; background: none; border: none;
    color: #fff; font-size: 28px; cursor: pointer; z-index: 10;
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="main-nav">
  <a href="/home" class="nav-link">Home</a>
  <a href="/admin/nodes" class="nav-link">Nodes</a>
  <a href="/admin/models" class="nav-link">Models</a>
  <a href="/admin/loras" class="nav-link active">LoRAs</a>
  <a href="/admin/llm" class="nav-link">LLM</a>
  <a href="/admin/workflows" class="nav-link">Workflows</a>
  <a href="/admin/presets" class="nav-link">Presets</a>
  <a href="/admin/queue" class="nav-link">Queue</a>
  <a href="/admin/history" class="nav-link">History</a>
  <a href="/admin/assets" class="nav-link">Assets</a>
  <a href="/admin/settings" class="nav-link"><span class="icon icon-gear icon-lg"></span></a>
  <a href="#" class="nav-link nav-activity" id="activityToggle" onclick="event.preventDefault()"><span class="icon icon-bell icon-lg"></span><span class="activity-dot" id="activityDot"></span></a>
  <a id="docsLink" href="#" target="_blank" class="nav-link" title="Documentation"><span class="icon icon-circle-question icon-lg"></span></a>
  <a href="#" class="nav-link nav-logout" onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>window.location='/login')"><span class="icon icon-logout icon-lg"></span></a>
</nav>

<!-- Header -->
<header>
  <div class="logo">ComfyUI <span class="studio-word">Studio<span class="beta-badge">BETA</span></span> <small>LoRAs</small></div>
  <div class="header-actions"><button class="btn" id="addLoraBtn">Add LoRA from CivitAI...</button></div>
</header>

<!-- Status bar -->
<div class="status-bar" id="statusBar">
  <span class="stat stat--downloading" id="statDownloading">0 downloading</span>
  <span class="stat stat--queued" id="statQueued">0 queued</span>
  <span class="stat stat--present" id="statPresent">0 / 0 present</span>
  <span class="stat stat--disk" id="statDisk">--</span>
</div>

<!-- Filter panel -->
<div class="filter-panel">
  <div class="filter-row" style="display:none;">
    <span class="filter-label">Categories</span>
    <div id="categoryFilters" class="tag-group"></div>
  </div>
  <div class="filter-row" style="display:none;">
    <span class="filter-label">Tags</span>
    <div id="tagFilters" class="tag-group"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">Base Model</span>
    <div id="baseModelFilters" class="tag-group"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">Status</span>
    <div id="statusFilters" class="tag-group">
      <button class="filter-tag active" data-status="present">&#10003; present</button>
      <button class="filter-tag active" data-status="missing">&#10005; missing</button>
      <button class="filter-tag active" data-status="queued">&#9719; queued</button>
      <button class="filter-tag active" data-status="downloading">&#8595; downloading</button>
      <button class="filter-tag active" data-status="error">&#9888; error</button>
    </div>
  </div>
  <div class="filter-row">
    <span class="filter-label">Sort</span>
    <div class="sort-group" id="sortGroup">
      <button class="sort-btn active" data-sort="name">Name <span class="sort-arrow">&#9650;</span></button>
      <button class="sort-btn" data-sort="size">Size</button>
      <button class="sort-btn" data-sort="status">Status</button>
    </div>
  </div>
  <div class="filter-row">
    <span class="filter-label">View</span>
    <div class="view-group" id="viewGroup">
      <button class="view-btn active" data-view="extended">Extended</button>
      <button class="view-btn" data-view="compact">Compact</button>
    </div>
  </div>
  <div class="filter-row">
    <span class="filter-label">Group</span>
    <div class="view-group" id="groupToggle">
      <button class="view-btn active" data-group="grouped">Grouped</button>
      <button class="view-btn" data-group="flat">Flat</button>
    </div>
  </div>
  <div class="filter-row">
    <button class="btn btn--sm" id="backfillThumbsBtn" style="font-size:11px;" title="Generate missing thumbnails for all gallery images">Generate Thumbs</button>
  </div>
  <div class="filter-row">
    <input type="text" id="searchInput" class="search-input" placeholder="Search LoRAs...">
  </div>
</div>

<!-- Main content -->
<main id="mainContent">
  <div class="loading-state" id="loadingState">
    <span class="spinner"></span>
    Loading LoRAs...
  </div>
</main>

<!-- Lookup Overlay -->
<div class="civitai-overlay" id="lookupOverlay" style="display:none">
  <div class="civitai-dialog">
    <button class="civitai-close" id="lookupClose">&times;</button>
    <h2 style="margin:0 0 16px">Add LoRA from CivitAI</h2>
    <div class="lookup-url-row">
      <input type="text" id="lookupUrl" placeholder="URL, model ID, or comma-separated IDs">
      <button class="btn" id="lookupBtn">Lookup</button>
    </div>
    <div id="lookupSpinner" style="display:none"><span class="spinner"></span> Looking up model...</div>
    <div id="lookupError" class="card-error" style="display:none"></div>
    <div id="lookupCard"></div>
  </div>
</div>

<!-- Image Modal (lookup image enlargement) -->
<div id="imgModal" style="display:none" class="img-modal">
  <div class="img-modal-inner">
    <img id="imgModalImg" src="">
    <div class="detail-meta" id="imgModalMeta"></div>
  </div>
</div>

<!-- Gallery Overlay -->
<div class="civitai-overlay" id="galleryOverlay" style="display:none">
  <div class="civitai-dialog" style="max-width:1200px;padding:20px 40px">
    <button class="civitai-close" id="galleryClose">&times;</button>

    <!-- Title row: name + badge + count + links + Delete All -->
    <div class="gallery-header">
      <h3 id="galleryTitle"></h3>
      <span class="gallery-count" id="galleryCount"></span>
      <span id="galleryCardLinks" style="display:flex;gap:8px;font-size:12px"></span>
      <span style="flex:1"></span>
      <button class="btn btn--sm btn--danger" id="galleryDeleteBtn">Delete All</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:8px 0 12px">

    <!-- Two panels side by side: CivitAI filters | Download controls -->
    <div style="display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;align-items:stretch">
      <!-- CivitAI Filters panel -->
      <div style="flex:1;min-width:280px;border:1px solid var(--border);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column">
        <div class="gallery-filters" style="margin-bottom:0">
          <label title="CivitAI API mode: tRPC (internal, more reliable) or REST (public)">Mode <select id="galleryMode">
            <!-- Fixed mode hidden from UI but code preserved -->
            <!--<option value="fixed">Fixed</option>-->
            <option value="trpc" selected>tRPC</option><option value="rest">REST API</option>
          </select></label>
          <!-- REST filters -->
          <span id="filtersRest" style="display:none">
            <label title="NSFW content level filter">NSFW <select id="galleryNsfw">
              <option value="X" selected>X</option><option value="Mature">Mature</option><option value="Soft">Soft</option><option value="None">None</option>
            </select></label>
            <label title="Sort order for results">Sort <select id="gallerySortRest">
              <option value="Newest" selected>Newest</option><option value="Most Reactions">Most Reactions</option><option value="Most Comments">Most Comments</option>
            </select></label>
            <label title="Time period filter">Period <select id="galleryPeriodRest">
              <option value="AllTime" selected>All Time</option><option value="Year">Year</option><option value="Month">Month</option><option value="Week">Week</option><option value="Day">Day</option>
            </select></label>
          </span>
          <!-- tRPC filters -->
          <span id="filtersTrpc" style="display:contents">
            <label title="Sort order for results">Sort <select id="gallerySortTrpc">
              <option value="Newest" selected>Newest</option><option value="Most Reactions">Most Reactions</option><option value="Most Comments">Most Comments</option><option value="Most Collected">Most Collected</option><option value="Oldest">Oldest</option>
            </select></label>
            <label title="Time period filter">Period <select id="galleryPeriodTrpc">
              <option value="AllTime" selected>All Time</option><option value="Year">Year</option><option value="Month">Month</option><option value="Week">Week</option><option value="Day">Day</option>
            </select></label>
            <label title="Filter by media type">Type <select id="galleryType">
              <option value="" selected>All</option><option value="image">Image</option><option value="video">Video</option>
            </select></label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer" title="Only show items with generation metadata (prompt, params)"><input type="checkbox" id="galleryWithMeta"> Metadata only</label>
            <label style="display:flex;align-items:center;gap:4px;cursor:pointer" title="Only show items created on CivitAI platform"><input type="checkbox" id="galleryFromPlatform"> Made on-site</label>
            <label title="Filter originals vs remixes">Remix <select id="galleryRemix">
              <option value="" selected>All</option><option value="false">Originals</option><option value="true">Remixes</option>
            </select></label>
          </span>
        </div>
        <!-- Community search URL (truncated to fit panel) -->
        <div id="galleryCommunityUrl" style="margin-top:auto;padding-top:8px;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden">
        </div>
      </div>

      <!-- Download controls panel -->
      <div style="min-width:200px;border:1px solid var(--border);border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;align-content:center">
        <select id="galleryCap" title="Maximum number of community images to download" style="padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px">
          <option value="10">10</option><option value="50">50</option><option value="100">100</option>
          <option value="200" selected>200</option><option value="400">400</option><option value="500">500</option><option value="1000">1000</option>
        </select>
        <select id="galleryWorkers" title="Number of parallel download workers" style="padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px">
          <option value="1">1w</option><option value="2">2w</option><option value="4">4w</option>
          <option value="6" selected>6w</option><option value="8">8w</option><option value="12">12w</option><option value="16">16w</option><option value="20">20w</option>

    <!-- Local filters row (search + starred) -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <input type="text" id="gallerySearch" title="Filter thumbnails by CivitAI image ID" placeholder="Search by ID..." style="padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;width:160px;font-family:var(--mono)">
      <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:var(--muted)" title="Show only images you have starred"><input type="checkbox" id="galleryStarredOnly"> Starred only</label>
    </div>
    <div class="gallery-progress" id="galleryProgress" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="galleryProgressFill"></div></div>
      <div class="progress-text" id="galleryProgressText"></div>
    </div>
    <div id="galleryGrid"></div>
  </div>
</div>

<!-- Detail Overlay (gallery image detail) -->
<div id="detailOverlay" style="display:none" class="detail-overlay">
  <button class="detail-close" id="detailClose">&times;</button>
  <button class="detail-nav prev" id="detailPrev">&larr;</button>
  <button class="detail-nav next" id="detailNext">&rarr;</button>

    <div class="detail-image"><img id="detailImg" src=""></div>
    <div class="detail-meta" id="detailMeta"></div>
  </div>
</div>

<!-- Details Dialog -->
<div id="detailsMetaOverlay" class="json-viewer-overlay" style="display:none">
  <div class="json-viewer-box" style="max-width:800px">
    <div class="json-viewer-header">
      <span class="json-viewer-title" id="detailsMetaTitle">Generation Data</span>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn--sm" id="detailsMetaCopy">Copy JSON</button>
        <button onclick="document.getElementById('detailsMetaOverlay').style.display='none'" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">&times;</button>
      </div>
    </div>
    <pre id="detailsMetaContent" class="json-viewer-pre" style="max-height:70vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none"></pre>
  </div>
</div>

<script src="/static/js/shared.js"></script>
<script>
(function() {
  'use strict';

  // ── Constants ──
  var PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE_SVG = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  var EXPAND_SVG = '<svg viewBox="0 0 24 24"><path d="M21 11V3h-8l3.29 3.29-10 10L3 13v8h8l-3.29-3.29 10-10z"/></svg>';

  function _fmtB(bytes) {
    if (!bytes) return '0';
    if (bytes < 1024) return bytes + 'B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(0) + 'KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(0) + 'MB';
    return (bytes / 1073741824).toFixed(1) + 'GB';
  }
  function _galleryBanner(oc, ob, cc, cb) {
    if (!oc && !cc) return '';
    var parts = [];
    if (oc) parts.push(oc + '(' + _fmtB(ob) + ')');
    if (cc) parts.push(cc + '(' + _fmtB(cb) + ')');
    return '<div class="gallery-stats-banner">' + parts.join('+') + '</div>';
  }

  // ── State ──
  let categories = [];
  let activeCategories = new Set();
  let activeTags = new Set();
  let activeStatuses = new Set(['present', 'missing', 'queued', 'downloading', 'error']);
  let activeBaseModels = new Set();
  let currentSort = 'name';
  let sortAscending = true;
  let currentView = 'extended';
  let currentGrouping = 'grouped';
  let searchQuery = '';
  let pollTimer = null;
  const cardMap = {};
  const sectionMap = {};
  let allTags = [];

  // ── DOM refs ──
  const $searchInput  = document.getElementById('searchInput');
  const $main         = document.getElementById('mainContent');
  const $loading      = document.getElementById('loadingState');
  const $categoryFilters = document.getElementById('categoryFilters');
  const $tagFilters   = document.getElementById('tagFilters');
  const $statusFilters = document.getElementById('statusFilters');
  const $sortGroup    = document.getElementById('sortGroup');
  const $viewGroup    = document.getElementById('viewGroup');
  const $statDownloading = document.getElementById('statDownloading');
  const $statQueued   = document.getElementById('statQueued');
  const $statPresent  = document.getElementById('statPresent');
  const $statDisk     = document.getElementById('statDisk');

  // ── Page-specific utilities ──
  function fmtSize(gb) {
    if (!gb) return '--';
    if (gb < 0.01) return (gb * 1024).toFixed(0) + ' MB';
    return gb + ' GB';
  }

  function makeSourceLink(url, model) {
    if (!url) return '';
    if (url.includes('civitai.com/api/download/models/')) {
      // Use civitai_model_id if available (correct), otherwise extract version ID
      if (model && model.civitai_model_id) {
        const match = url.match(/models\/(\d+)/);
        var vid = match ? match[1] : '';
        return 'https://civitai.com/models/' + model.civitai_model_id + (vid ? '?modelVersionId=' + vid : '');
      }
      const match = url.match(/models\/(\d+)/);
      if (match) return 'https://civitai.com/models/?modelVersionId=' + match[1];
    }
    return url;
  }

  function statusOrder(status) {
    const order = { downloading: 0, queued: 1, error: 2, missing: 3, present: 4 };
    return order[status] !== undefined ? order[status] : 5;
  }

  // ── Initial load ──
  async function initialLoad() {
    try {
      const resp = await apiFetch('/api/admin/loras');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const data = await resp.json();
      handleModelData(data);
      $loading.style.display = 'none';
    } catch (e) {
      if (e.message !== 'auth') {
        console.error('Initial load error:', e);
      }
    }
  }

  // Make loadModels an alias for initialLoad (used by sync handler)
  var loadModels = initialLoad;

  // ── Tag extraction ──
  function extractAllTags(cats) {
    const freq = {};
    for (const cat of cats) {
      for (const m of cat.models) {
        for (const t of (m.tags || [])) {
          freq[t] = (freq[t] || 0) + 1;
        }
      }
    }
    return Object.entries(freq)
      .sort((a, b) => b[1] - a[1])
      .map(e => e[0]);
  }

  // ── Build filter UI ──
  function buildCategoryFilters(cats) {
    $categoryFilters.innerHTML = '';
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.dataset.category = cat.id;
      btn.textContent = cat.name;
      if (activeCategories.has(cat.id)) btn.classList.add('active');
      btn.addEventListener('click', () => {
        if (activeCategories.has(cat.id)) {
          activeCategories.delete(cat.id);
          btn.classList.remove('active');
        } else {
          activeCategories.add(cat.id);
          btn.classList.add('active');
        }
        applyFiltersAndSort();
      });
      $categoryFilters.appendChild(btn);
    });
  }

  function buildBaseModelFilters(cats) {
    var $el = document.getElementById('baseModelFilters');
    $el.innerHTML = '';
    var bms = new Set();
    cats.forEach(function(cat) {
      cat.models.forEach(function(m) {
        var bm = m.base_model || m.civitai_base_model || '';
        bms.add(bm || '(none)');
      });
    });
    Array.from(bms).sort().forEach(function(bm) {
      var btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.dataset.baseModel = bm;
      btn.textContent = bm;
      if (activeBaseModels.has(bm)) btn.classList.add('active');
      btn.addEventListener('click', function() {
        if (activeBaseModels.has(bm)) {
          activeBaseModels.delete(bm);
          btn.classList.remove('active');
        } else {
          activeBaseModels.add(bm);
          btn.classList.add('active');
        }
        applyFiltersAndSort();
      });
      $el.appendChild(btn);
    });
  }

  function buildTagFilters(tags) {
    $tagFilters.innerHTML = '';
    const top20 = tags.slice(0, 20);
    top20.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.dataset.tag = tag;
      btn.textContent = tag;
      if (activeTags.has(tag)) btn.classList.add('active');
      btn.addEventListener('click', () => {
        if (activeTags.has(tag)) {
          activeTags.delete(tag);
          btn.classList.remove('active');
        } else {
          activeTags.add(tag);
          btn.classList.add('active');
        }
        applyFiltersAndSort();
      });
      $tagFilters.appendChild(btn);
    });
  }

  // Status filter click handlers
  $statusFilters.querySelectorAll('.filter-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      const status = btn.dataset.status;
      if (activeStatuses.has(status)) {
        activeStatuses.delete(status);
        btn.classList.remove('active');
      } else {
        activeStatuses.add(status);
        btn.classList.add('active');
      }
      applyFiltersAndSort();
    });
  });

  // Sort button click handlers
  $sortGroup.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const sort = btn.dataset.sort;
      if (currentSort === sort) {
        sortAscending = !sortAscending;
      } else {
        currentSort = sort;
        sortAscending = true;
      }
      // Update active states
      $sortGroup.querySelectorAll('.sort-btn').forEach(b => {
        b.classList.remove('active');
        const arrow = b.querySelector('.sort-arrow');
        if (arrow) arrow.remove();
      });
      btn.classList.add('active');
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow' + (sortAscending ? '' : ' desc');
      arrow.innerHTML = '&#9650;';
      btn.appendChild(arrow);
      sortCards();
    });
  });

  // View toggle click handlers
  $viewGroup.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const view = btn.dataset.view;
      if (currentView === view) return;
      currentView = view;
      $viewGroup.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyView();
    });
  });

  // Group toggle
  document.getElementById('groupToggle').querySelectorAll('.view-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var g = btn.dataset.group;
      if (currentGrouping === g) return;
      currentGrouping = g;
      document.getElementById('groupToggle').querySelectorAll('.view-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      applyFiltersAndSort();
    });
  });

  // Search handler
  $searchInput.addEventListener('input', () => {
    searchQuery = $searchInput.value.trim().toLowerCase();
    applyFiltersAndSort();
  });

  // ── Data handling ──
  function handleModelData(data) {
    const cats = data.categories || [];
    categories = cats;

    // Attach _category and _searchText to each model
    cats.forEach(cat => {
      cat.models.forEach(m => {
        m._category = cat.id;
        m._searchText = [m.name, m.file, ...(m.tags || [])].join(' ').toLowerCase();
      });
    });

    allTags = extractAllTags(cats);
    buildCategoryFilters(cats);
    buildBaseModelFilters(cats);
    buildTagFilters(allTags);
    cats.forEach(buildSection);
    cats.forEach(cat => {
      cat.models.forEach(m => updateCard(cat.id, m));
    });

    if (data.stats) updateStatusBar(data.stats);

    applyFiltersAndSort();
    _autoPoll(data.stats);
  }

  function mergeModelData(data) {
    const cats = data.categories || [];
    categories = cats;

    cats.forEach(cat => {
      cat.models.forEach(m => {
        m._category = cat.id;
        m._searchText = [m.name, m.file, ...(m.tags || [])].join(' ').toLowerCase();
      });
    });

    const newTags = extractAllTags(cats);
    if (newTags.join(',') !== allTags.join(',')) {
      allTags = newTags;
      buildTagFilters(allTags);
    }

    cats.forEach(cat => {
      if (!sectionMap[cat.id]) buildSection(cat);
      cat.models.forEach(m => updateCard(cat.id, m));
    });

    if (data.stats) updateStatusBar(data.stats);

    applyFiltersAndSort();

    // Auto-manage polling: only poll when something is active
    _autoPoll(data.stats, cats);
  }

  function _autoPoll(stats, cats) {
    const st = stats || {};
    var busy = (st.downloading_count || 0) + (st.queued_count || 0);
    // Also poll if any model has an active gallery download
    var galleryBusy = cats && cats.some(function(cat) {
      return cat.models.some(function(m) { return m.gallery_dl; });
    });
    if (galleryBusy) busy = 1;
    if (busy > 0) {
      // Faster polling during gallery downloads (1s vs 3s)
      var interval = galleryBusy ? 1000 : 3000;
      if (!pollTimer || pollTimer._interval !== interval) {
        stopPolling();
        pollTimer = setInterval(pollModels, interval);
        pollTimer._interval = interval;
      }
    } else {
      stopPolling();
    }
  }

  // ── Status bar ──
  function updateStatusBar(stats) {
    if (!stats) return;

    const dlCount = stats.downloading_count || 0;
    const dlSpeed = stats.total_speed_bytes || 0;
    if (dlCount > 0 && dlSpeed > 0) {
      $statDownloading.textContent = dlCount + ' downloading @ ' + fmtBytes(dlSpeed) + '/s';
    } else if (dlCount > 0) {
      $statDownloading.textContent = dlCount + ' downloading';
    } else {
      $statDownloading.textContent = '0 downloading';
    }

    const queuedCount = stats.queued_count || 0;
    $statQueued.textContent = queuedCount + ' queued';

    const presentCount = stats.present_count || 0;
    const totalCount = stats.total_count || 0;
    $statPresent.textContent = presentCount + ' / ' + totalCount + ' present';

    const modelBytes = stats.models_bytes;
    const freeBytes = stats.free_bytes;
    if (modelBytes != null && freeBytes != null) {
      $statDisk.textContent = 'LoRAs: ' + fmtBytes(modelBytes) + ' \u00b7 Free: ' + fmtBytes(freeBytes);
    }
  }

  function computeStatusBarFromData() {
    let dlCount = 0, queuedCount = 0, presentCount = 0, totalCount = 0;
    categories.forEach(cat => {
      cat.models.forEach(m => {
        totalCount++;
        if (m.status === 'downloading') dlCount++;
        else if (m.status === 'queued') queuedCount++;
        else if (m.status === 'present') presentCount++;
      });
    });
    $statDownloading.textContent = dlCount + ' downloading';
    $statQueued.textContent = queuedCount + ' queued';
    $statPresent.textContent = presentCount + ' / ' + totalCount + ' present';
  }

  // ── Sections ──
  function buildSection(cat) {
    if (sectionMap[cat.id]) return;

    const section = document.createElement('section');
    section.className = 'category-section';
    section.dataset.category = cat.id;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = '<h2 class="section-title">' + escHtml(cat.name) + '</h2><span class="section-count"></span>';
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'card-grid';
    grid.dataset.grid = cat.id;
    section.appendChild(grid);

    $main.appendChild(section);
    sectionMap[cat.id] = section;
  }

  // ── Filter logic ──
  function isCardVisible(model) {
    if (activeCategories.size > 0 && !activeCategories.has(model._category)) return false;
    if (activeTags.size > 0) {
      const modelTags = new Set(model.tags || []);
      for (const t of activeTags) {
        if (!modelTags.has(t)) return false;
      }
    }
    if (activeStatuses.size > 0 && !activeStatuses.has(model.status)) return false;
    if (activeBaseModels.size > 0) {
      var bm = model.base_model || model.civitai_base_model || '(none)';
      if (!activeBaseModels.has(bm)) return false;
    }
    if (searchQuery && !model._searchText.includes(searchQuery)) return false;
    return true;
  }

  function applyFiltersAndSort() {
    // Apply visibility
    Object.values(cardMap).forEach(entry => {
      const visible = isCardVisible(entry.model);
      if (visible) {
        entry.el.classList.remove('card-hidden');
      } else {
        entry.el.classList.add('card-hidden');
      }
    });

    // Sort cards
    sortCards();

    // Apply grouping
    if (currentGrouping === 'grouped') {
      applyGrouping();
    } else {
      removeGrouping();
    }

    // Update section visibility and counts
    updateSectionVisibility();
  }

  function applyGrouping() {
    for (const [catId, section] of Object.entries(sectionMap)) {
      var grid = section.querySelector('.card-grid');
      if (!grid) continue;

      // Remove existing group cards
      grid.querySelectorAll('.lora-group-card').forEach(function(g) { g.remove(); });

      // Show all individual cards first (undo previous grouping)
      grid.querySelectorAll('.model-card').forEach(function(c) { c.style.display = ''; });

      // Collect visible cards and group by civitai_model_id
      var cards = Array.from(grid.querySelectorAll('.model-card:not(.card-hidden)'));
      var groups = {};
      var order = [];

      cards.forEach(function(card) {
        var entry = cardMap[card.dataset.file];
        if (!entry) return;
        var mid = entry.model.civitai_model_id;
        var gname = entry.model.civitai_model_name;
        if (!mid || !gname) return;
        if (!groups[mid]) {
          groups[mid] = { name: gname, cards: [], models: [], mid: mid };
          order.push(mid);
        }
        groups[mid].cards.push(card);
        groups[mid].models.push(entry.model);
      });

      // Build group cards for groups with 2+ members
      order.forEach(function(mid) {
        var g = groups[mid];
        if (g.cards.length < 2) return;

        // Hide individual cards
        g.cards.forEach(function(c) { c.style.display = 'none'; });

        // Compute aggregates
        var totalSize = 0;
        var galleryCount = 0;
        var baseModel = '';
        var thumb = null;
        var gOrigCount = 0, gOrigBytes = 0, gCommCount = 0, gCommBytes = 0;
        g.models.forEach(function(m) {
          totalSize += m.size_gb || 0;
          galleryCount += m.gallery_count || 0;
          if (!baseModel) baseModel = m.base_model || m.civitai_base_model || '';
          if (!thumb) thumb = m.gallery_thumb;
          // Original images are shared (same model_id), take max not sum
          gOrigCount = Math.max(gOrigCount, m.gallery_orig_count || 0);
          gOrigBytes = Math.max(gOrigBytes, m.gallery_orig_bytes || 0);
          gCommCount += m.gallery_comm_count || 0;
          gCommBytes += m.gallery_comm_bytes || 0;
        });

        var groupCard = document.createElement('div');
        groupCard.className = 'model-card lora-group-card';
        groupCard.dataset.groupId = mid;

        var gBanner = _galleryBanner(gOrigCount, gOrigBytes, gCommCount, gCommBytes);
        var thumbHtml = thumb
          ? '<div class="card-thumb" style="display:block"><img src="/api/admin/loras/gallery/thumb/' + thumb + '" loading="lazy" onerror="this.parentElement.style.display=\'none\'">' + gBanner + '</div>'
          : '';

        var sizeStr = totalSize >= 1 ? totalSize.toFixed(1) + ' GB' : (totalSize * 1000).toFixed(0) + ' MB';
        var bmHtml = baseModel ? ' <span class="base-model-pill">' + escHtml(baseModel) + '</span>' : '';

        var linksHtml = '<div class="model-links">';
        if (mid) {
          linksHtml += '<a class="model-link" href="https://civitai.com/models/' + mid + '" target="_blank">model</a>';
          linksHtml += '<a class="model-link" href="https://civitai.com/api/v1/models/' + mid + '" target="_blank">api:model</a>';
        }
        linksHtml += '</div>';

        var countBoing = '<span class="group-count-boing">' + g.cards.length + '</span>';

        groupCard.innerHTML =
          thumbHtml +
          '<div class="card-top">' +
            '<div class="card-info">' +
              '<div class="card-name"><span class="group-badge">GROUP</span> ' + escHtml(g.name) + ' ' + countBoing + '</div>' +
              '<div class="card-meta">' +
                '<span>' + sizeStr + ' (' + g.cards.length + ')</span>' +
                ' <span class="source-badge civitai">civitai</span>' +
                bmHtml +
              '</div>' +
              '<div class="model-links">' +
                '<a class="model-link" href="https://civitai.com/models/' + mid + '" target="_blank">model</a>' +
                '<a class="model-link" href="https://civitai.com/api/v1/models/' + mid + '" target="_blank">api:model</a>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            (galleryCount > 0 ? '<button class="btn btn--sm group-gallery-btn">Gallery (' + galleryCount + ')</button>' : '') +
          '</div>';

        // Stash member cards inside (hidden)
        var stash = document.createElement('div');
        stash.className = 'group-members';
        stash.style.display = 'none';
        g.cards.forEach(function(c) { stash.appendChild(c); });
        groupCard.appendChild(stash);

        // Gallery button opens group gallery
        var galBtn = groupCard.querySelector('.group-gallery-btn');
        if (galBtn) {
          galBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            openGallery(mid, null, g.name, baseModel);
          });
        }

        grid.appendChild(groupCard);
      });

      // Add MODEL badge to ungrouped visible cards
      var grouped = new Set();
      order.forEach(function(mid) { if (groups[mid].cards.length >= 2) groups[mid].cards.forEach(function(c) { grouped.add(c); }); });
      cards.forEach(function(card) {
        var nameEl = card.querySelector('.card-name');
        if (!nameEl) return;
        // Remove any previous badge
        var old = nameEl.querySelector('.model-badge');
        if (old) old.remove();
        if (!grouped.has(card)) {
          var badge = document.createElement('span');
          badge.className = 'model-badge';
          badge.textContent = 'MODEL';
          nameEl.insertBefore(badge, nameEl.firstChild);
        }
      });
    }
  }

  function removeGrouping() {
    for (const [catId, section] of Object.entries(sectionMap)) {
      var grid = section.querySelector('.card-grid');
      if (!grid) continue;

      // Remove MODEL badges
      grid.querySelectorAll('.model-badge').forEach(function(b) { b.remove(); });

      // Move member cards out of group cards back into grid, show them
      grid.querySelectorAll('.lora-group-card').forEach(function(g) {
        var members = g.querySelector('.group-members');
        if (members) {
          Array.from(members.children).forEach(function(card) {
            card.style.display = '';
            grid.appendChild(card);
          });
        }
        g.remove();
      });
    }
    // Re-sort since cards were moved
    sortCards();
  }

  function sortCards() {
    for (const [catId, section] of Object.entries(sectionMap)) {
      const grid = section.querySelector('.card-grid');
      if (!grid) continue;
      const cards = [...grid.children].sort((a, b) => {
        const entryA = cardMap[a.dataset.file];
        const entryB = cardMap[b.dataset.file];
        if (!entryA || !entryB) return 0;
        const ma = entryA.model;
        const mb = entryB.model;
        let cmp = 0;
        if (currentSort === 'name') cmp = ma.name.localeCompare(mb.name);
        else if (currentSort === 'size') cmp = (ma.size_gb || 0) - (mb.size_gb || 0);
        else if (currentSort === 'status') cmp = statusOrder(ma.status) - statusOrder(mb.status);
        return sortAscending ? cmp : -cmp;
      });
      cards.forEach(c => grid.appendChild(c));
    }
  }

  function updateSectionVisibility() {
    for (const [catId, section] of Object.entries(sectionMap)) {
      const grid = section.querySelector('.card-grid');
      if (!grid) continue;
      const visibleCards = grid.querySelectorAll('.model-card:not(.card-hidden)');
      const count = visibleCards.length;
      const countEl = section.querySelector('.section-count');
      if (countEl) countEl.textContent = '(' + count + ' shown)';
      if (count === 0) {
        section.classList.add('section-hidden');
      } else {
        section.classList.remove('section-hidden');
      }
    }
  }

  function applyView() {
    Object.values(sectionMap).forEach(section => {
      const grid = section.querySelector('.card-grid');
      if (!grid) return;
      if (currentView === 'compact') {
        grid.classList.add('compact');
      } else {
        grid.classList.remove('compact');
      }
    });
  }

  function updateCard(catId, m) {
    let entry = cardMap[m.file];
    if (!entry) {
      entry = createCard(catId, m);
    }

    entry.model = m;

    const { el, refs } = entry;
    const badge = refs.badge;
    const progress = refs.progress;
    const fill = refs.fill;
    const pct = refs.pct;
    const pbytes = refs.pbytes;
    const btn = refs.actionBtn;
    const errorEl = refs.error;

    // Reset status classes
    el.classList.remove('status-downloading', 'status-error', 'status-present', 'status-missing', 'status-queued');
    el.classList.add('status-' + m.status);

    badge.className = 'status-badge ' + m.status;

    // Reset compact progress
    el.style.setProperty('--compact-progress', '0%');
    if (refs.removeBtn) refs.removeBtn.style.display = 'none';

    switch (m.status) {
      case 'present':
        badge.textContent = '\u2713';
        badge.title = 'Installed';
        btn.className = 'btn btn--sm btn--danger';
        btn.disabled = false;
        btn.innerHTML = '\uD83D\uDDD1 Delete';
        progress.classList.remove('visible');
        fill.classList.remove('indeterminate');
        errorEl.classList.remove('visible');
        break;

      case 'missing':
        badge.textContent = '\u2715';
        badge.title = 'Missing';
        btn.className = 'btn btn--sm';
        btn.disabled = false;
        btn.innerHTML = '\u2193 Download';
        progress.classList.remove('visible');
        fill.classList.remove('indeterminate');
        errorEl.classList.remove('visible');
        if (refs.removeBtn) refs.removeBtn.style.display = '';
        break;

      case 'queued':
        badge.textContent = '\u25F7';
        badge.title = 'Queued';
        btn.className = 'btn btn--sm';
        btn.disabled = true;
        btn.textContent = 'Queued...';
        progress.classList.remove('visible');
        fill.classList.remove('indeterminate');
        errorEl.classList.remove('visible');
        break;

      case 'downloading':
        badge.textContent = '\u2193';
        badge.title = 'Downloading';
        btn.className = 'btn btn--sm';
        btn.disabled = true;
        btn.textContent = 'Downloading...';
        progress.classList.add('visible');
        errorEl.classList.remove('visible');

        if (m.expected_bytes && m.expected_bytes > 0 && m.progress != null) {
          fill.classList.remove('indeterminate');
          fill.style.width = m.progress.toFixed(1) + '%';
          el.style.setProperty('--compact-progress', m.progress.toFixed(1) + '%');

          const speedStr = m.speed_bytes ? ' \u00b7 ' + fmtBytes(m.speed_bytes) + '/s' : '';
          pct.textContent = m.progress.toFixed(1) + '%' + speedStr;
        } else {
          fill.classList.add('indeterminate');
          fill.style.width = '';
          el.style.setProperty('--compact-progress', '50%');

          const speedStr = m.speed_bytes ? fmtBytes(m.speed_bytes) + '/s' : '...';
          pct.textContent = speedStr;
        }

        const dlBytes = m.on_disk_bytes || 0;
        if (m.expected_bytes && m.expected_bytes > 0) {
          pbytes.textContent = fmtBytes(dlBytes) + ' / ' + fmtBytes(m.expected_bytes);
        } else {
          pbytes.textContent = fmtBytes(dlBytes);
        }
        break;

      case 'error':
        badge.textContent = '\u26A0';
        badge.title = 'Error';
        btn.className = 'btn btn--sm';
        btn.disabled = false;
        btn.innerHTML = '\u21BB Retry';
        progress.classList.remove('visible');
        fill.classList.remove('indeterminate');
        if (m.error) {
          errorEl.textContent = m.error;
          errorEl.classList.add('visible');
        } else {
          errorEl.classList.remove('visible');
        }
        break;
    }

    // Gallery download progress on card
    var gd = m.gallery_dl;
    if (gd && refs.galleryBtn) {
      var gdl = gd.downloaded + gd.skipped;
      var gtot = gd.total || 0;
      refs.galleryBtn.textContent = 'Gallery \u2193 ' + gdl + '/' + gtot;
      refs.galleryBtn.style.display = '';
      // Show progress bar for gallery download (only when model itself is not downloading)
      if (m.status !== 'downloading') {
        progress.classList.add('visible');
        if (gtot > 0) {
          var gpct = Math.min(100, (gdl / gtot) * 100);
          fill.classList.remove('indeterminate');
          fill.style.width = gpct.toFixed(1) + '%';
          pct.textContent = gpct.toFixed(0) + '%';
          pbytes.textContent = gdl + ' / ' + gtot + ' images';
        } else {
          fill.classList.add('indeterminate');
          fill.style.width = '';
          pct.textContent = '';
          pbytes.textContent = 'downloading...';
        }
      }
    } else if (refs.galleryBtn && m.civitai_model_id && m.status === 'present') {
      var imgCount = m.gallery_count || 0;
      refs.galleryBtn.textContent = 'Gallery' + (imgCount > 0 ? ' (' + imgCount + ')' : '');
      // Hide gallery progress bar when not downloading gallery (and model is not downloading either)
      if (m.status !== 'downloading') {
        progress.classList.remove('visible');
        fill.classList.remove('indeterminate');
      }
    }

    // Update thumbnail if changed
    if (refs.cardThumb) {
      var newThumb = m.gallery_thumb;
      if (newThumb && refs.cardThumb.dataset.currentThumb !== newThumb) {
        var bannerHtml = _galleryBanner(m.gallery_orig_count, m.gallery_orig_bytes, m.gallery_comm_count, m.gallery_comm_bytes);
        refs.cardThumb.innerHTML = '<img src="/api/admin/loras/gallery/thumb/' + newThumb + '" loading="lazy" onerror="this.parentElement.style.display=\'none\'">' + bannerHtml;
        refs.cardThumb.style.display = '';
        refs.cardThumb.dataset.currentThumb = newThumb;
      }
    }
  }

  // ── Card actions ──
  async function handleCardAction(filename) {
    const entry = cardMap[filename];
    if (!entry) return;
    const m = entry.model;
    const btn = entry.refs.actionBtn;

    if (m.status === 'missing' || m.status === 'error') {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner sm"></span> Starting...';
      try {
        const resp = await apiFetch('/api/admin/models/download/' + encodeURIComponent(filename), { method: 'POST' });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          showToast('Download error: ' + (err.detail || err.error || resp.status), 5000, 'error');
          btn.disabled = false;
          btn.textContent = m.status === 'error' ? '\u21BB Retry' : '\u2193 Download';
        } else {
          startPolling();
        }
      } catch (e) {
        if (e.message !== 'auth') {
          showToast('Error: ' + e.message, 5000, 'error');
          btn.disabled = false;
          btn.textContent = m.status === 'error' ? '\u21BB Retry' : '\u2193 Download';
        }
      }
    } else if (m.status === 'present') {
      if (!await studioConfirm('Delete ' + m.name + ' (' + m.file + ')?', {danger: true, yes: 'Delete'})) return;
      btn.disabled = true;
      btn.textContent = 'Deleting...';
      try {
        const resp = await apiFetch('/api/admin/models/' + encodeURIComponent(filename), { method: 'DELETE' });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          showToast('Delete error: ' + (err.detail || err.error || resp.status), 5000, 'error');
          btn.disabled = false;
          btn.innerHTML = '\uD83D\uDDD1 Delete';
        }
      } catch (e) {
        if (e.message !== 'auth') {
          showToast('Error: ' + e.message, 5000, 'error');
          btn.disabled = false;
          btn.innerHTML = '\uD83D\uDDD1 Delete';
        }
      }
    }
  }

  // ── Batch downloads ──
  async function downloadMissing(filenames) {
    if (!filenames.length) return;
    try {
      const resp = await apiFetch('/api/admin/models/download-batch', {
        method: 'POST',
        body: { filenames: filenames }
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showToast('Batch download error: ' + (err.detail || err.error || resp.status), 5000, 'error');
      } else {
        startPolling();
      }
    } catch (e) {
      if (e.message !== 'auth') {
        showToast('Error: ' + e.message, 5000, 'error');
      }
    }
  }

  // ── Polling ──
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(pollModels, 3000);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  async function pollModels() {
    try {
      const resp = await apiFetch('/api/admin/loras');
      if (!resp.ok) return;
      const data = await resp.json();
      mergeModelData(data);
    } catch (e) {
      if (e.message !== 'auth') {
        console.error('Poll error:', e);
      }
    }
  }

  // ── Shared: render generation metadata ──
  function renderMeta(meta) {
    if (!meta || Object.keys(meta).length === 0)
      return '<p style="color:var(--muted)">No generation data available</p>';
    var h = '';
    // ID and date first — use _item_id (file stem) as fallback
    var displayId = meta.civitai_id || meta._item_id || '';
    if (displayId) h += '<div class="meta-row"><span>ID</span><span>' + escHtml(String(displayId)) + '</span></div>';
    if (meta.createdAt) h += '<div class="meta-row"><span>Created</span><span>' + escHtml(meta.createdAt) + '</span></div>';
    // CivitAI links — always show URL if available
    if (meta.civitai_page) h += '<div class="meta-row"><span>CivitAI</span><span><a href="' + escHtml(meta.civitai_page) + '" target="_blank" style="color:var(--accent)">Open page <i class="icon icon-external-link" style="width:11px;height:11px;vertical-align:middle;margin-left:2px"></i></a></span></div>';
    if (meta.url) h += '<div class="meta-row"><span>Asset</span><span><a href="' + escHtml(meta.url) + '" target="_blank" style="color:var(--accent)">Open page <i class="icon icon-external-link" style="width:11px;height:11px;vertical-align:middle;margin-left:2px"></i></a></span></div>';
    if (meta.username) h += '<div class="meta-row"><span>Author</span><span>' + escHtml(meta.username) + '</span></div>';
    if (meta.baseModel) h += '<div class="meta-row"><span>Base Model</span><span>' + escHtml(meta.baseModel) + '</span></div>';
    if (meta.width && meta.height) h += '<div class="meta-row"><span>Resolution</span><span>' + meta.width + 'x' + meta.height + '</span></div>';
    if (meta.type) h += '<div class="meta-row"><span>Type</span><span>' + escHtml(meta.type) + '</span></div>';
    // Generation params from raw_meta
    var rm = meta.raw_meta || meta;
    if (rm.prompt) h += '<h4>Positive Prompt</h4><p>' + escHtml(rm.prompt) + '</p>';
    if (rm.negativePrompt) h += '<h4>Negative Prompt</h4><p>' + escHtml(rm.negativePrompt) + '</p>';
    if (rm.Model || rm.model) h += '<div class="meta-row"><span>Checkpoint</span><span>' + escHtml(rm.Model || rm.model) + '</span></div>';
    var loras = rm.loras || (rm.resources || []).filter(function(r) { return (r.type || '').toLowerCase() === 'lora'; });
    if (loras.length) {
      h += '<h4>LoRAs Used</h4><div class="meta-loras">';
      loras.forEach(function(l) { h += '<span>' + escHtml(l.name || '') + (l.weight != null ? ' (' + l.weight + ')' : '') + '</span>'; });
      h += '</div>';
    }
    if (rm.seed != null) h += '<div class="meta-row"><span>Seed</span><span>' + rm.seed + '</span></div>';
    if (rm.steps != null) h += '<div class="meta-row"><span>Steps</span><span>' + rm.steps + '</span></div>';
    if (rm.cfgScale != null) h += '<div class="meta-row"><span>CFG</span><span>' + rm.cfgScale + '</span></div>';
    if (rm.sampler) h += '<div class="meta-row"><span>Sampler</span><span>' + escHtml(rm.sampler) + '</span></div>';
    if (rm.clipSkip != null) h += '<div class="meta-row"><span>Clip Skip</span><span>' + rm.clipSkip + '</span></div>';
    if (rm.Size || rm.size) h += '<div class="meta-row"><span>Size</span><span>' + (rm.Size || rm.size) + '</span></div>';
    // Raw metadata copy button
    if (meta.raw_item || meta.raw_meta) {
      h += '<div class="meta-row" style="margin-top:8px"><span>Raw Metadata</span><span>' +

        '<button class="btn btn--sm details-meta-btn">Details</button></div>';

    return h;
  }

  var _lastRenderedMeta = null;
  var _extractMetaJson = '';

  document.addEventListener('click', function(e) {
    // Copy raw metadata
    var copyBtn = e.target.closest('.copy-meta-btn');
    if (copyBtn) {
      var raw = _lastRenderedMeta ? (_lastRenderedMeta.raw_item || _lastRenderedMeta.raw_meta || _lastRenderedMeta) : {};
      navigator.clipboard.writeText(JSON.stringify(raw, null, 2));
      var orig = copyBtn.textContent;
      copyBtn.textContent = 'Copied'; copyBtn.style.color = 'var(--accent)';
      setTimeout(function() { copyBtn.textContent = orig; copyBtn.style.color = ''; }, 3000);
      return;

    // Details button — fetch full metadata on demand
    var detailsBtn = e.target.closest('.details-meta-btn');
    if (detailsBtn) {
      if (!_lastRenderedMeta || !galleryModelId) return;
      var img = galleryImages[detailIdx];
      if (!img) return;
      detailsBtn.disabled = true; detailsBtn.textContent = 'Loading...';
      apiFetch('/api/admin/loras/gallery/' + img.id + '/meta').then(function(resp) {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
      }).then(function(fullMeta) {
        var gen = fullMeta.generation_data || fullMeta;
        _extractMetaJson = JSON.stringify(gen, null, 2);
        var cid = fullMeta.civitai_id || img.id;
        document.getElementById('detailsMetaTitle').textContent = 'Generation Data — Image #' + cid;
        document.getElementById('detailsMetaContent').textContent = _extractMetaJson;
        document.getElementById('detailsMetaOverlay').style.display = 'block';
      }).catch(function(err) {
        if (err.message !== 'auth') showToast('Error: ' + err.message, 5000, 'error');

        detailsBtn.disabled = false; detailsBtn.textContent = 'Details';

  document.getElementById('detailsMetaOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';

  document.getElementById('detailsMetaCopy').addEventListener('click', function() {
    navigator.clipboard.writeText(_extractMetaJson);
