  // ── Lookup Dialog ──
  var lookupData = null;

  function openLookup() {
    var ov = document.getElementById('lookupOverlay');
    ov.style.display = 'flex';
    document.getElementById('lookupUrl').value = '';
    document.getElementById('lookupUrl').focus();
    document.getElementById('lookupSpinner').style.display = 'none';
    document.getElementById('lookupError').style.display = 'none';
    document.getElementById('lookupCard').innerHTML = '';
    lookupData = null;
  }

  function closeLookup() {
    document.getElementById('lookupOverlay').style.display = 'none';
  }

  function parseInput(raw) {
    // URL → pass as-is
    if (raw.match(/https?:\/\//)) return { type: 'url', urls: [raw] };
    // Split by comma, space, newline → extract numeric IDs
    var ids = raw.split(/[\s,]+/).map(function(s) { return s.trim(); }).filter(function(s) { return /^\d+$/.test(s); });
    if (ids.length === 0) return null;
    if (ids.length === 1) return { type: 'url', urls: ['https://civitai.com/models/' + ids[0]] };
    return { type: 'batch', ids: ids };
  }

  async function doSingleLookup(url, card, spinner, errorEl) {
    spinner.style.display = '';
    errorEl.style.display = 'none';
    card.innerHTML = '';
    try {
      var resp = await apiFetch('/api/admin/loras/lookup-civitai', {
        method: 'POST', body: { url: url }
      });
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        throw new Error(err.detail || 'Lookup failed (HTTP ' + resp.status + ')');
      }
      lookupData = await resp.json();
      spinner.style.display = 'none';
      renderLookupResult(lookupData);
    } catch (e) {
      spinner.style.display = 'none';
      if (e.message !== 'auth') { errorEl.textContent = e.message; errorEl.style.display = ''; }
    }
  }

  async function doBatchLookup(ids) {
    var spinner = document.getElementById('lookupSpinner');
    var errorEl = document.getElementById('lookupError');
    var card = document.getElementById('lookupCard');
    spinner.style.display = '';
    errorEl.style.display = 'none';
    card.innerHTML = '';

    var results = [];
    for (var i = 0; i < ids.length; i++) {
      spinner.innerHTML = '<span class="spinner"></span> Looking up ' + (i+1) + '/' + ids.length + '...';
      try {
        var resp = await apiFetch('/api/admin/loras/lookup-civitai', {
          method: 'POST', body: { url: 'https://civitai.com/models/' + ids[i] }
        });
        if (resp.ok) results.push(await resp.json());
      } catch(e) {}
    }
    spinner.style.display = 'none';
    spinner.innerHTML = '<span class="spinner"></span> Looking up model...';
    if (results.length === 0) { errorEl.textContent = 'No models found'; errorEl.style.display = ''; return; }
    renderBatchResults(results);
  }

  function renderBatchResults(results) {
    var card = document.getElementById('lookupCard');
    card.innerHTML = '<div class="batch-results"></div>';
    var container = card.querySelector('.batch-results');

    results.forEach(function(d) {
      var rating = d.stats.rating || 0;
      var stars = '';
      for (var i = 1; i <= 5; i++) stars += i <= Math.round(rating) ? '\u2605' : '\u2606';

      var row = document.createElement('div');
      row.className = 'batch-row';
      row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px';

      // Preview thumb
      var thumbUrl = '';
      for (var vi = 0; vi < d.versions.length && !thumbUrl; vi++) {
        var imgs = d.versions[vi].images || [];
        if (imgs.length) thumbUrl = imgs[0].url;
      }
      var thumbHtml = thumbUrl ? '<img src="' + escHtml(thumbUrl) + '" style="width:60px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0">' : '<div style="width:60px;height:60px;background:var(--bg);border-radius:4px;flex-shrink:0"></div>';

      var versCount = d.versions.length;
      var baseModels = d.versions.map(function(v) { return v.base_model; }).filter(Boolean);
      var baseStr = [...new Set(baseModels)].join(', ');

      row.innerHTML = thumbHtml +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escHtml(d.name) + '</div>' +
          '<div style="font-size:11px;color:var(--muted)">' +
            escHtml(d.author) + ' · ' + stars + ' · ' + (d.stats.download_count || 0).toLocaleString() + ' dl · ' + versCount + ' ver' +
            (baseStr ? ' · ' + escHtml(baseStr) : '') +
          '</div>' +
        '</div>' +
        '<button class="btn btn--sm batch-view-btn" style="flex-shrink:0">View</button>' +
        '<button class="btn btn--sm batch-add-btn" style="flex-shrink:0">Add</button>';

      row.querySelector('.batch-view-btn').addEventListener('click', function() {
        lookupData = d;
        renderLookupResult(d);
      });
      row.querySelector('.batch-add-btn').addEventListener('click', async function() {
        var btn = this;
        // Auto-select all versions and add
        btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span>';
        try {
          var resp = await apiFetch('/api/admin/loras/add-civitai', {
            method: 'POST',
            body: {
              model_id: d.model_id, model_name: d.name, author: d.author,
              description: d.description, tags: d.tags,
              rating: d.stats.rating, downloads: d.stats.download_count,
              versions: d.versions, preview_images: d.preview_images
            }
          });
          if (resp.ok) {
            var result = await resp.json();
            btn.textContent = result.added.length ? 'Added ' + result.added.length : 'Skipped';
            btn.style.color = 'var(--accent)';
            showToast('Added ' + result.added.length + ' version(s) of ' + d.name);
          } else {
            btn.textContent = 'Error'; btn.disabled = false;
          }
        } catch(e) {
          btn.textContent = 'Error'; btn.disabled = false;
        }
      });

      container.appendChild(row);
    });
  }

  async function doLookup() {
    var raw = document.getElementById('lookupUrl').value.trim();
    if (!raw) return;
    var parsed = parseInput(raw);
    if (!parsed) {
      var errorEl = document.getElementById('lookupError');
      errorEl.textContent = 'Enter a CivitAI URL, model ID, or comma-separated IDs';
      errorEl.style.display = '';
      return;
    }
    if (parsed.type === 'batch') {
      doBatchLookup(parsed.ids);
    } else {
      doSingleLookup(parsed.urls[0],
        document.getElementById('lookupCard'),
        document.getElementById('lookupSpinner'),
        document.getElementById('lookupError'));
    }
  }

  function renderLookupResult(d) {
    var card = document.getElementById('lookupCard');

    // Stars
    var rating = d.stats.rating || 0;
    var stars = '';
    for (var i = 1; i <= 5; i++) stars += i <= Math.round(rating) ? '\u2605' : '\u2606';

    // Tags
    var tagsHtml = d.tags.map(function(t) { return '<span class="lookup-pill">' + escHtml(t) + '</span>'; }).join('');

    // Trigger words from all versions
    var triggers = new Set();
    d.versions.forEach(function(v) { (v.trigger_words || []).forEach(function(w) { triggers.add(w); }); });
    var triggerHtml = '';
    if (triggers.size > 0) {
      triggerHtml = '<div class="lookup-pills" style="margin-top:4px">' +
        Array.from(triggers).map(function(w) { return '<span class="lookup-pill trigger">' + escHtml(w) + '</span>'; }).join('') +
        '</div>';
    }

    // Preview images
    // Collect version images (model card images) + build meta lookup from preview_images
    var metaById = {};
    (d.preview_images || []).forEach(function(img) { if (img.id && img.meta) metaById[img.id] = img.meta; });
    var allImages = [];
    d.versions.forEach(function(v) {
      (v.images || []).forEach(function(img) {
        if (img.url) allImages.push({ url: img.url, id: img.id, type: img.type || 'image', meta: metaById[img.id] || {} });
      });
    });
    if (allImages.length === 0) {
      (d.preview_images || []).forEach(function(img) {
        if (img.url) allImages.push({ url: img.url, id: img.id, type: 'image', meta: img.meta || {} });
      });
    }
    // Build image thumbnails using gallery-thumb pattern
    var imgsContainer = null;
    if (allImages.length) {
      imgsContainer = document.createElement('div');
      imgsContainer.className = 'lookup-images';
      allImages.forEach(function(img, idx) {
        var isVideo = img.type === 'video' || (img.url && img.url.match(/\.(mp4|webm)(\?|$)/i));
        var thumb = document.createElement('div');
        thumb.className = 'gallery-thumb';
        thumb.dataset.meta = JSON.stringify(img.meta || {});
        thumb.dataset.url = img.url;

        // Expand button → fullscreen
        var expandBtn = document.createElement('button');
        expandBtn.className = 'expand-btn';
        expandBtn.innerHTML = EXPAND_SVG;
        expandBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          showLookupImage(thumb);
        });

        if (isVideo) {
          thumb.dataset.videoSrc = img.url;
          thumb.innerHTML = '<video class="thumb-img" src="' + escHtml(img.url) + '" preload="metadata" muted playsinline></video><div class="play-overlay">' + PLAY_SVG + '</div>';
          thumb.appendChild(expandBtn);
          thumb.addEventListener('click', function(e) {
            if (e.target.closest('.expand-btn')) return;
            toggleLookupVideo(thumb);
          });
        } else {
          thumb.innerHTML = '<img class="thumb-img" src="' + escHtml(img.url) + '" loading="lazy">';
          thumb.appendChild(expandBtn);
        }

        // Index badge
        var badge = document.createElement('span');
        badge.className = 'thumb-idx';
        badge.textContent = idx + 1;
        thumb.appendChild(badge);

        imgsContainer.appendChild(thumb);
      });
    }
    var imgsHtml = '';

    // Versions
    var versHtml = '<div class="lookup-versions">';
    d.versions.forEach(function(v) {
      var f = v.files && v.files[0];
      if (!f) return;
      var checked = v.version_id === d.selected_version_id ? ' checked' : '';
      var sizeStr = f.size_kb ? (f.size_kb / 1000000).toFixed(2) + ' GB' : '--';
      versHtml += '<div class="lookup-version">' +
        '<label><input type="checkbox" data-vid="' + v.version_id + '"' + checked + '>' +
        '<span class="ver-name">' + escHtml(v.name) + '</span>' +
        '<span class="ver-file" title="' + escHtml(f.name) + '">' + escHtml(f.name) + '</span>' +
        '<span class="ver-size">' + sizeStr + '</span>' +
        '</label>' +
        (v.base_model ? '<span class="ver-base">' + escHtml(v.base_model) + '</span>' : '') +
        '</div>';
    });
    versHtml += '</div>';

    card.innerHTML =
      '<div class="lookup-info">' +
        '<h3>' + escHtml(d.name) + ' <span class="author">by ' + escHtml(d.author) + '</span></h3>' +
        '<div class="lookup-stats">' +
          '<span class="stars">' + stars + ' ' + rating.toFixed(1) + '</span>' +
          '<span>' + (d.stats.download_count || 0).toLocaleString() + ' downloads</span>' +
          '<span>' + escHtml(d.type) + '</span>' +
        '</div>' +
        '<div class="lookup-pills">' + tagsHtml + '</div>' +
        triggerHtml +
      '</div>' +
      '<div id="lookupImagesSlot"></div>' +
      '<h4 style="margin:12px 0 8px;font-size:14px">Versions</h4>' +
      versHtml +
      '<div class="lookup-actions">' +
        '<button class="btn" id="lookupDownloadBtn" disabled>Download Selected</button>' +
        '<button class="btn btn--muted lookup-cancel">Cancel</button>' +
      '</div>';

    // Insert image thumbnails
    if (imgsContainer) {
      var slot = card.querySelector('#lookupImagesSlot');
      if (slot) slot.replaceWith(imgsContainer);
    }

    // Update download button on checkbox change
    card.querySelectorAll('input[type=checkbox]').forEach(function(cb) {
      cb.addEventListener('change', updateLookupDownloadBtn);
    });
    updateLookupDownloadBtn();
  }

  function updateLookupDownloadBtn() {
    var card = document.getElementById('lookupCard');
    var count = card.querySelectorAll('input[type=checkbox]:checked').length;
    var btn = document.getElementById('lookupDownloadBtn');
    if (!btn) return;
    btn.disabled = count === 0;
    btn.textContent = count > 0 ? 'Download ' + count + ' Version' + (count > 1 ? 's' : '') : 'Download Selected';
  }

  async function addSelectedVersions() {
    if (!lookupData) return;
    var card = document.getElementById('lookupCard');
    var checked = new Set();
    card.querySelectorAll('input[type=checkbox]:checked').forEach(function(cb) {
      checked.add(parseInt(cb.dataset.vid, 10));
    });
    if (checked.size === 0) return;

    var selected = lookupData.versions.filter(function(v) { return checked.has(v.version_id); });
    var btn = document.getElementById('lookupDownloadBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm"></span> Adding...';

    try {
      var resp = await apiFetch('/api/admin/loras/add-civitai', {
        method: 'POST',
        body: {
          model_id: lookupData.model_id,
          model_name: lookupData.name,
          author: lookupData.author,
          description: lookupData.description,
          tags: lookupData.tags,
          rating: lookupData.stats.rating,
          downloads: lookupData.stats.download_count,
          versions: selected,
          preview_images: lookupData.preview_images
        }
      });
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        showToast('Error: ' + (err.detail || 'Add failed'), 5000, 'error');
        btn.disabled = false;
        btn.textContent = 'Download Selected';
        return;
      }
      var result = await resp.json();
      closeLookup();
      showToast('Added ' + result.added.length + ' LoRA(s)' +
        (result.skipped.length ? ', ' + result.skipped.length + ' skipped (already in catalog)' : ''));
      initialLoad();
    } catch (e) {
      if (e.message !== 'auth') {
        showToast('Error: ' + e.message, 5000, 'error');
        btn.disabled = false;
        btn.textContent = 'Download Selected';
      }
    }
  }

  // Lookup event delegation
  document.getElementById('lookupCard').addEventListener('click', function(e) {
    var btn = e.target.closest('#lookupDownloadBtn');
    if (btn) { addSelectedVersions(); return; }
    if (e.target.classList.contains('lookup-cancel')) { closeLookup(); return; }
  });

  function toggleLookupVideo(thumb) {
    var video = thumb.querySelector('video');
    var overlay = thumb.querySelector('.play-overlay');
    if (thumb.classList.contains('playing')) {
      if (video) video.pause();
      thumb.classList.remove('playing');
      if (overlay) overlay.innerHTML = PLAY_SVG;
    } else {
      if (video) {
        video.loop = true;
        video.play();
      }
      thumb.classList.add('playing');
      if (overlay) overlay.innerHTML = PAUSE_SVG;
    }
  }

  // Lookup button handlers
  document.getElementById('addLoraBtn').addEventListener('click', openLookup);
  document.getElementById('lookupClose').addEventListener('click', closeLookup);
  document.getElementById('lookupOverlay').addEventListener('click', function(e) { if (e.target === this) closeLookup(); });
  document.getElementById('lookupBtn').addEventListener('click', doLookup);
  document.getElementById('lookupUrl').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLookup(); });

  // ── Image Modal (lookup preview enlargement) ──

  function showLookupImage(el) {
    var modal = document.getElementById('imgModal');
    var url = el.dataset.url || el.dataset.videoSrc;
    var isVideo = (url && url.match(/\.(mp4|webm)(\?|$)/i)) || !!el.dataset.videoSrc;
    var mediaEl = document.getElementById('imgModalImg');
    if (isVideo) {
      var vid = document.createElement('video');
      vid.id = 'imgModalImg'; vid.src = url; vid.controls = true; vid.autoplay = true; vid.muted = true;
      vid.style.cssText = mediaEl.style.cssText || 'max-width:60%;max-height:calc(100vh - 80px);border-radius:8px';
      mediaEl.replaceWith(vid);
    } else {
      if (mediaEl.tagName === 'VIDEO') {
        var img = document.createElement('img');
        img.id = 'imgModalImg'; img.src = url;
        img.style.cssText = 'max-width:60%;max-height:calc(100vh - 80px);object-fit:contain;border-radius:8px';
        mediaEl.replaceWith(img);
      } else {
        mediaEl.src = url;
      }
    }
    var meta = {};
    try { meta = JSON.parse(el.dataset.meta); } catch(ex) {}
    _lastRenderedMeta = meta;
    document.getElementById('imgModalMeta').innerHTML = renderMeta(meta);
    modal.style.display = 'flex';
  }

    document.getElementById('imgModal').style.display = 'none';

  var galleryModelId = null;
  var galleryVersionId = null;
  var galleryPollTimer = null;
  var galleryImages = [];
  var galleryImageIds = new Set();
  var galleryDownloading = false;
  var galleryDefaultPreview = null;
  var galleryCustomPreview = null;
  var galleryPlayingVideo = null;
  var galleryDlStartTime = 0;
  var galleryLastDone = 0;
  var COPY_SVG = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';

  function getGalleryFilters() {
    var mode = document.getElementById('galleryMode').value;
    var mid = galleryModelId, vid = galleryVersionId;
    var cap = document.getElementById('galleryCap').value;
    if (mode === 'fixed') {
      return { mode: 'fixed', modelId: mid, limit: cap, version_id: vid };
    }
    if (mode === 'rest') {
      return { mode: 'rest', modelId: mid, limit: cap, nsfw: document.getElementById('galleryNsfw').value,
        sort: document.getElementById('gallerySortRest').value, period: document.getElementById('galleryPeriodRest').value,
        version_id: vid };
    }
    // tRPC
    var f = { mode: 'trpc', modelId: mid, limit: cap, version_id: vid,
      sort: document.getElementById('gallerySortTrpc').value,
      period: document.getElementById('galleryPeriodTrpc').value };
    var typeVal = document.getElementById('galleryType').value;
    if (typeVal) f.types = [typeVal];
    if (document.getElementById('galleryWithMeta').checked) f.with_meta = true;
    if (document.getElementById('galleryFromPlatform').checked) f.from_platform = true;
    var remixVal = document.getElementById('galleryRemix').value;
    if (remixVal !== '') f.is_remix = remixVal === 'true';
    return f;
  }

  function getGalleryUrls() {
    var f = getGalleryFilters();
    var cardUrl = 'https://civitai.com/api/v1/models/' + f.modelId;
    var communityUrl;
    if (f.mode === 'rest') {
      communityUrl = 'https://civitai.com/api/v1/images?modelId=' + f.modelId +
        '&limit=' + f.limit + '&nsfw=' + f.nsfw +
        '&sort=' + encodeURIComponent(f.sort) + '&period=' + f.period;
      if (f.version_id) communityUrl += '&modelVersionId=' + f.version_id;
    } else if (f.mode === 'fixed') {
      communityUrl = '(exact captured query — no customization)';
    } else {
      var inp = {modelVersionId: f.version_id, period: f.period, sort: f.sort,
        limit: parseInt(f.limit), pending: true, authed: true, cursor: null};
      if (f.types) inp.types = f.types;
      if (f.with_meta) inp.withMeta = true;
      if (f.from_platform) inp.fromPlatform = true;
      if (f.is_remix !== undefined) inp.isRemix = f.is_remix;
      communityUrl = 'https://civitai.com/api/trpc/image.getInfinite?input=' +
        encodeURIComponent(JSON.stringify({json: inp}));
    }
    return { card: cardUrl, community: communityUrl };
  }

  function copyUrlFlash(btn, url) {
    navigator.clipboard.writeText(url);
    var flash = document.createElement('span');
    flash.className = 'copied-flash';
    flash.textContent = 'Copied';
    btn.parentNode.insertBefore(flash, btn.nextSibling);
    setTimeout(function() { flash.remove(); }, 3000);
  }

  function _makeUrlLine(url) {
    // Helper: creates a truncated URL code + copy button
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;gap:6px;min-width:0;flex:1';
    var code = document.createElement('code');
    code.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg);padding:2px 6px;border-radius:3px;font-size:10px;min-width:0;flex:1';
    code.textContent = url;
    code.title = url;
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.innerHTML = COPY_SVG;
    btn.style.cssText = 'flex-shrink:0;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center';
    btn.addEventListener('click', function() { copyUrlFlash(btn, url); });
    wrap.appendChild(code);
    wrap.appendChild(btn);
    return wrap;
  }

  function _makeIconLink(url, label) {
    // Helper: creates a compact link with external-link icon + label
    var a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.title = url;
    a.style.cssText = 'display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-size:11px;text-decoration:none;white-space:nowrap';
    a.innerHTML = '<i class="icon icon-external-link" style="width:10px;height:10px;vertical-align:middle"></i>' + label;
    return a;
  }

  function updateGalleryUrls() {
    if (!galleryModelId) return;
    var urls = getGalleryUrls();

    // Card links in title row: API (JSON) + Page
    var linksEl = document.getElementById('galleryCardLinks');
    linksEl.innerHTML = '';
    var apiUrl = 'https://civitai.com/api/v1/models/' + galleryModelId;

  async function pollGallery() {
    if (!galleryModelId) return;
    try {
      var galleryUrl = '/api/admin/loras/' + galleryModelId + '/gallery';
      var qs = [];
      if (galleryVersionId) qs.push('version_id=' + galleryVersionId);
      if (document.getElementById('galleryStarredOnly').checked) qs.push('starred=true');
      if (qs.length) galleryUrl += '?' + qs.join('&');
      var resp = await apiFetch(galleryUrl);
      if (!resp.ok) return;
      var data = await resp.json();

      var status = data.status;
      var btn = document.getElementById('galleryDlBtn');
      var delBtn = document.getElementById('galleryDeleteBtn');
      var progress = document.getElementById('galleryProgress');
      var progressFill = document.getElementById('galleryProgressFill');
      var progressText = document.getElementById('galleryProgressText');

      if (status === 'downloading') {
        btn.textContent = 'Stop'; btn.disabled = false; delBtn.disabled = true;
        galleryDownloading = true; progress.style.display = '';
        var total = data.total || 0, done = (data.downloaded || 0) + (data.skipped || 0);
        if (done > 0) {
          progressFill.classList.remove('indeterminate');
          progressFill.style.width = Math.min(total > 0 ? Math.round(done / total * 100) : 0, 100) + '%';
        }
        var dlText = 'Downloaded ' + done + (total > 0 ? ' / ' + total : '') + ((data.skipped || 0) > 0 ? ' (' + (data.skipped || 0) + ' cached)' : '');
        var elapsed = (Date.now() - galleryDlStartTime) / 1000;
        if (done > 0 && elapsed > 3) {
          var rate = (done / elapsed * 60).toFixed(1);
          dlText += ' — ' + rate + '/min';
          if (total > done) {
            var remaining = Math.round((total - done) / (done / elapsed));
            var mins = Math.floor(remaining / 60);
            var secs = remaining % 60;
            dlText += ', ~' + (mins > 0 ? mins + 'm ' : '') + secs + 's left';
          }
        }
        progressText.innerHTML = '<span class="spinner sm" style="vertical-align:middle;margin-right:6px"></span>' + dlText;
      } else if (status === 'stopping') {
        btn.textContent = 'Stopping...'; btn.disabled = true;
      } else {
        btn.textContent = 'Download'; btn.disabled = false; delBtn.disabled = false;
        var cardsBtn = document.getElementById('galleryDlCardsBtn');
        if (cardsBtn) { cardsBtn.disabled = false; cardsBtn.textContent = 'Cards'; }
        galleryDownloading = false; progressFill.classList.remove('indeterminate');
        if (status === 'done' || status === 'stopped') {
          var elapsed = Math.round((Date.now() - galleryDlStartTime) / 1000);
          var timeStr = elapsed >= 60 ? Math.floor(elapsed/60) + 'min ' + (elapsed%60) + 's' : elapsed + 's';
          progress.style.display = '';
          progressFill.style.width = '100%';
          progressText.textContent = (status === 'done' ? 'Completed' : 'Stopped') + ' in ' + timeStr;
          setTimeout(function() { progress.style.display = 'none'; }, 5000);
        } else {
          progress.style.display = 'none';
        }
        if (galleryPollTimer) { clearInterval(galleryPollTimer); galleryPollTimer = null; }
      }

      // Preview IDs from backend
      galleryDefaultPreview = data.default_preview || null;
      galleryCustomPreview = data.custom_preview || null;

      // Build deduplicated lists
      function mapImg(img, type, source, prefix) {
        var m = img.meta || {};
        m._item_id = img.id;
        return {
          id: img.id, type: type, ext: img.ext || '.jpeg', meta: m,
          source: source, key: prefix + img.id,
          civitai_id: m.civitai_id || img.id,
          createdAt: img.createdAt || m.createdAt || '',
          username: m.username || '',
          has_thumb: img.has_thumb || false,
          starred: img.starred || false
        };
      }
      var card = (data.gallery_card || []).map(function(img) { return mapImg(img, 'gallery-card', 'card', 'card-'); });
      var community = (data.gallery_community || []).filter(function(img) {
        return !card.some(function(c) { return c.id === img.id; });
      }).map(function(img) { return mapImg(img, 'gallery-community', 'community', 'comm-'); });
      var all = card.concat(community);

      // Incremental append — only add new items
      var newItems = all.filter(function(img) { return !galleryImageIds.has(img.key); });
      if (newItems.length > 0) {
        newItems.forEach(function(img) { galleryImageIds.add(img.key); galleryImages.push(img); });
        appendNewThumbs(newItems);
      }

      function fmtSize(bytes) {
        if (!bytes) return '';
        if (bytes >= 100 * 1024 * 1024) return (bytes / (1024*1024*1024)).toFixed(1) + ' GB';
        return (bytes / (1024*1024)).toFixed(0) + ' MB';
      }
      var totalBytes = (data.gallery_card_bytes || 0) + (data.gallery_community_bytes || 0);
      var sizeStr = totalBytes ? ' (' + fmtSize(totalBytes) + ')' : '';
      document.getElementById('galleryCount').textContent = card.length + ' card + ' + community.length + ' community' + sizeStr;
      // Replace spinner with empty message if truly empty
      if (all.length === 0 && status !== 'downloading') {
        document.getElementById('galleryGrid').innerHTML = '<div class="gallery-empty">No images yet. Click Download to fetch from CivitAI.</div>';
      }
    } catch(e) {
      if (e.message !== 'auth') console.error('Gallery poll error:', e);
    }
  }

  function toggleVideoPlay(thumb) {
    var videoSrc = thumb.dataset.videoSrc;
    if (!videoSrc) return;
    var video = thumb.querySelector('video');
    var overlay = thumb.querySelector('.play-overlay');

    if (video) {
      // Already playing — stop and swap back to image
      stopVideoThumb(thumb);
      return;
    }

    // Stop any other playing video first
    if (galleryPlayingVideo && galleryPlayingVideo !== thumb) {
      stopVideoThumb(galleryPlayingVideo);
    }

    // Swap image to video
    var img = thumb.querySelector('.thumb-img');
    var v = document.createElement('video');
    v.src = videoSrc; v.muted = true; v.loop = true; v.playsInline = true;
    v.style.cssText = 'width:150px;height:150px;object-fit:cover;display:block;border-radius:4px';
    v.autoplay = true;
    if (img) img.replaceWith(v);
    thumb.classList.add('playing');
    if (overlay) overlay.innerHTML = PAUSE_SVG;
    galleryPlayingVideo = thumb;
  }

  function stopVideoThumb(thumb) {
    var video = thumb.querySelector('video');
    if (!video) return;
    video.pause();
    // Swap video back to thumbnail image smoothly
    var img = document.createElement('img');
    img.className = 'thumb-img';
    img.src = thumb.dataset.thumbSrc || '';
    video.replaceWith(img);
    thumb.classList.remove('playing');
    var overlay = thumb.querySelector('.play-overlay');
    if (overlay) overlay.innerHTML = PLAY_SVG;
    if (galleryPlayingVideo === thumb) galleryPlayingVideo = null;
  }

  // Lazy load + unload: only load images when visible, remove src when not
  var _thumbObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (!entry.isIntersecting) return;
      var imgEl = entry.target.querySelector('.thumb-img[data-src]');
      if (imgEl && !imgEl.getAttribute('src')) {
        imgEl.src = imgEl.dataset.src;
      }
    });
  }, { root: null, rootMargin: '300px 0px' });

  function makeThumb(img) {
    var ext = img.ext || '.jpeg';
    var src = '/api/admin/loras/gallery/media/' + img.id + ext;
    var thumb = document.createElement('div');
    thumb.className = 'gallery-thumb';
    thumb.dataset.key = img.key;

    // Expand button (top-right) → detail view
    var expandBtn = document.createElement('button');
    expandBtn.className = 'expand-btn';
    expandBtn.innerHTML = EXPAND_SVG;
    expandBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      openDetail(galleryImages.indexOf(img));
    });

    if (ext === '.mp4') {
      var thumbUrl = img.has_thumb
        ? '/api/admin/loras/gallery/thumb/' + img.id
        : '';
      thumb.dataset.videoSrc = src;
      thumb.dataset.thumbSrc = thumbUrl;
      if (thumbUrl) {
        thumb.innerHTML = '<img class="thumb-img" data-src="' + thumbUrl + '"><div class="play-overlay">' + PLAY_SVG + '</div>';
      } else {
        thumb.innerHTML = '<div class="thumb-img" style="background:var(--bg)"></div><div class="play-overlay">' + PLAY_SVG + '</div>';
      }
      thumb.appendChild(expandBtn);
      thumb.addEventListener('click', function(e) { if (e.target.closest('.expand-btn')) return; toggleVideoPlay(thumb); });
    } else {
      var imgThumbUrl = '/api/admin/loras/gallery/thumb/' + img.id;
      thumb.innerHTML = '<img class="thumb-img" data-src="' + imgThumbUrl + '">';
      thumb.appendChild(expandBtn);
      thumb.addEventListener('click', function(e) { if (e.target.closest('.expand-btn')) return; openDetail(galleryImages.indexOf(img)); });
    }
    _thumbObserver.observe(thumb);
    var idx = galleryImages.indexOf(img) + 1;
    var badge = document.createElement('span');
    badge.className = 'thumb-idx';
    badge.textContent = idx;
    thumb.appendChild(badge);
    // Star button on thumbnail — uses FA icon via CSS mask
    var star = document.createElement('button');
    function updateThumbStar(s) {
      star.className = 'thumb-star' + (s ? ' starred' : '');
      star.innerHTML = '<i class="icon ' + (s ? 'icon-star-solid' : 'icon-star-regular') + '"></i>';
      star.title = s ? 'Starred' : 'Not starred';
    }
    updateThumbStar(img.starred);
    star.addEventListener('click', function(e) {
      e.stopPropagation();
      apiFetch('/api/admin/loras/gallery/' + img.id + '/star', { method: 'POST' }).then(function(r) {
        return r.json();
      }).then(function(d) {
        img.starred = d.starred;
        updateThumbStar(d.starred);
      });
    });
    thumb.appendChild(star);
    // Preview highlights
    if (img.id === galleryDefaultPreview) thumb.classList.add('preview-default');
    if (img.id === galleryCustomPreview) thumb.classList.add('preview-custom');
    return thumb;
  }

  function getOrCreateSection(source) {
    var grid = document.getElementById('galleryGrid');
    var sectionId = 'gallerySection-' + source;
    var section = document.getElementById(sectionId);
    if (section) return section;

    // Remove empty message if present
    var empty = grid.querySelector('.gallery-empty');
    if (empty) empty.remove();

    // Ensure card section comes before community, with HR between
    var cardSection = document.getElementById('gallerySection-card');
    var commSection = document.getElementById('gallerySection-community');

    var lbl = document.createElement('div');
    lbl.className = 'gallery-section-label';
    lbl.id = 'galleryLabel-' + source;
    lbl.textContent = source === 'card' ? 'Model Card' : 'Community';

    section = document.createElement('div');
    section.className = 'gallery-section';
    section.id = sectionId;

    if (source === 'card') {
      // Card always first
      grid.insertBefore(section, grid.firstChild);
      grid.insertBefore(lbl, grid.firstChild);
    } else {
      // Community: add HR if card exists, then append
      if (cardSection) {
        var hr = document.createElement('hr');
        hr.className = 'gallery-hr';
        hr.id = 'galleryHr';
        if (!document.getElementById('galleryHr')) grid.appendChild(hr);
      }
      grid.appendChild(lbl);
      grid.appendChild(section);
    }
    return section;
  }

  function appendNewThumbs(newItems) {
    newItems.forEach(function(img) {
      var section = getOrCreateSection(img.source);
      section.appendChild(makeThumb(img));
      // Update label count
      var lbl = document.getElementById('galleryLabel-' + img.source);
      var count = section.children.length;
      lbl.textContent = (img.source === 'card' ? 'Model Card' : 'Community') + ' (' + count + ')';
    });
  }

    btn.disabled = true;
    var dialog = document.createElement('dialog');
    dialog.style.cssText = 'background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:20px;min-width:400px;max-width:500px;font-family:var(--mono);position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;';
    dialog.innerHTML =
      '<h3 style="margin:0 0 12px;font-size:14px;">Generating Thumbnails</h3>' +
      '<div id="thumbLog" style="font-size:11px;color:var(--muted);margin-bottom:8px;max-height:100px;overflow-y:auto;"></div>' +
      '<div style="background:var(--bg);border-radius:4px;height:20px;overflow:hidden;margin-bottom:8px;">' +
        '<div id="thumbFill" style="height:100%;width:0%;background:var(--accent);transition:width 0.3s;"></div>' +
      '</div>' +
      '<div id="thumbStats" style="font-size:11px;color:var(--muted);margin-bottom:12px;"></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
        '<button class="btn btn--sm btn--danger" id="thumbCancelBtn">Cancel</button>' +
        '<button class="btn btn--sm" id="thumbCloseBtn" style="display:none;">Close</button>' +
      '</div>';
    document.body.appendChild(dialog);
    dialog.showModal();

    var log = dialog.querySelector('#thumbLog');
    var fill = dialog.querySelector('#thumbFill');
    var stats = dialog.querySelector('#thumbStats');
    var cancelBtn = dialog.querySelector('#thumbCancelBtn');
    var closeBtn = dialog.querySelector('#thumbCloseBtn');
    var done = false;

    var es = new EventSource('/api/admin/loras/gallery/backfill-thumbs');

    es.addEventListener('log', function(e) {
      var msg = JSON.parse(e.data);
      var line = document.createElement('div');
      line.textContent = msg;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    });

    es.addEventListener('progress', function(e) {
      var d = JSON.parse(e.data);
      var pct = d.total > 0 ? ((d.current / d.total) * 100).toFixed(1) : 0;
      fill.style.width = pct + '%';
      var rateStr = d.rate ? d.rate.toFixed(1) + '/s' : '...';
      var etaStr = d.eta_seconds != null ? (d.eta_seconds >= 60 ? Math.floor(d.eta_seconds / 60) + 'm ' + (d.eta_seconds % 60) + 's' : d.eta_seconds + 's') : '';
      var phase = d.phase === 'sizes' ? 'Fixing sizes' : 'Generating thumbs';
      stats.textContent = phase + ': ' + d.current + '/' + d.total + ' \u00b7 ' + (d.thumbs_generated || 0) + ' thumbs \u00b7 ' + (d.sizes_fixed || 0) + ' sizes \u00b7 ' + d.failed + ' failed \u00b7 ' + rateStr + (etaStr ? ' \u00b7 ~' + etaStr + ' left' : '');
    });

    es.addEventListener('done', function(e) {
      done = true;
      es.close();
      var d = JSON.parse(e.data);
      fill.style.width = '100%';
      stats.textContent = 'Complete: ' + (d.thumbs_generated || 0) + ' thumbs, ' + (d.sizes_fixed || 0) + ' sizes, ' + d.failed + ' failed' + (d.cancelled ? ' (cancelled)' : '');
      cancelBtn.style.display = 'none';
      closeBtn.style.display = '';
      btn.disabled = false;
      pollModels(); // Refresh cards to pick up new thumbs
    });

    es.onerror = function() {
      if (!done) {
        es.close();
        stats.textContent = 'Connection lost';
        cancelBtn.style.display = 'none';
        closeBtn.style.display = '';
        btn.disabled = false;
      }
    };

    cancelBtn.addEventListener('click', function() {
      apiFetch('/api/admin/loras/gallery/backfill-thumbs/cancel', { method: 'POST' });
      cancelBtn.disabled = true;
      cancelBtn.textContent = 'Cancelling...';
    });

    closeBtn.addEventListener('click', function() {
      dialog.close();
      dialog.remove();
    });

    dialog.addEventListener('close', function() {
      es.close();
      dialog.remove();
      btn.disabled = false;
    });
  });

  // ── Boot ──
  initialLoad();

})();
</script>
</body>
</html>
