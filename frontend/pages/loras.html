<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Studio — LoRAs</title>
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/icons.css">
<style>
  /* ── Status badge override (icon-only, no border/padding) ── */
  .status-badge {
    font-size: 16px;
    cursor: help;
    flex-shrink: 0;
    align-self: flex-start;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
    font-family: inherit;
    letter-spacing: normal;
    text-transform: none;
    padding: 0;
    border: none;
  }
  .status-badge.present     { color: var(--success); }
  .status-badge.missing     { color: var(--muted); }
  .status-badge.queued      { color: var(--queued); animation: pulse 2s ease-in-out infinite; }
  .status-badge.downloading { color: var(--accent); }
  .status-badge.error       { color: var(--error); }

  /* ── Overlay shared ── */
  .civitai-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000;
    overflow-y: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start;
  }
  .civitai-dialog {
    background: var(--bg-card, #1a1a2e); border-radius: 12px; max-width: 960px; width: 100%;
    padding: 24px; position: relative; margin-top: 20px;
  }
  .civitai-close {
    position: absolute; top: 10px; right: 14px; background: none; border: none;
    color: var(--muted); font-size: 26px; cursor: pointer; line-height: 1;
  }
  .civitai-close:hover { color: var(--text); }

  /* ── Lookup dialog ── */
  .lookup-url-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .lookup-url-row input {
    flex: 1; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .lookup-info { margin-bottom: 12px; }
  .lookup-info h3 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: baseline; gap: 10px; }
  .lookup-info h3 .author { color: var(--muted); font-size: 13px; font-weight: normal; }
  .lookup-stats { display: flex; gap: 16px; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .lookup-stats .stars { color: #f5a623; }
  .lookup-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .lookup-pill {
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  }
  .lookup-pill.trigger {
    background: rgba(121, 80, 242, 0.15); color: #b197fc; border-color: transparent;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.25px; font-size: 10px;
    cursor: pointer; padding: 3px 8px;
  }
  .lookup-pill.trigger:hover { background: rgba(121, 80, 242, 0.25); }
  .lookup-images {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 4px; margin-bottom: 16px; max-height: 280px; overflow-y: auto;
  }
  .lookup-images img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer;
    transition: opacity 0.15s;
  }
  .lookup-images img:hover { opacity: 0.8; }
  .lookup-versions { margin-bottom: 16px; max-height: 300px; overflow-y: auto; }
  .lookup-version {
    display: flex; align-items: center; gap: 8px; padding: 8px 4px;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .lookup-version label { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; min-width: 0; }
  .lookup-version .ver-name { font-weight: 500; min-width: 100px; flex-shrink: 0; }
  .lookup-version .ver-file { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lookup-version .ver-size { color: var(--muted); min-width: 60px; text-align: right; flex-shrink: 0; }
  .lookup-version .ver-base {
    font-size: 11px; padding: 1px 6px; border-radius: 8px;
    background: var(--bg); color: var(--muted); flex-shrink: 0;
  }
  .lookup-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px; }

  /* ── Image modal ── */
  .img-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .img-modal-inner {
    display: flex; gap: 20px; max-width: 1100px; max-height: calc(100vh - 40px); width: 100%;
  }
  .img-modal-inner > img { max-width: 60%; max-height: calc(100vh - 80px); object-fit: contain; border-radius: 8px; }

  /* ── Gallery ── */
  .gallery-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .gallery-header h3 { margin: 0; font-size: 18px; }
  .gallery-count { color: var(--muted); font-size: 13px; }
  .gallery-progress { margin-bottom: 10px; }
  .gallery-progress .progress-bar { height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
  .gallery-progress .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .gallery-progress .progress-fill.indeterminate { width: 30% !important; animation: indeterminate 1.5s infinite ease-in-out; }
  @keyframes indeterminate { 0% { margin-left: 0 } 50% { margin-left: 70% } 100% { margin-left: 0 } }
  .gallery-progress .progress-text { font-size: 12px; color: var(--muted); }
  .gallery-filters { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .gallery-filters select { padding: 4px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px; }
  .gallery-urls { font-size: 11px; color: var(--muted); margin-bottom: 10px; word-break: break-all; line-height: 1.8; }
  .gallery-urls code { background: var(--bg); padding: 2px 5px; border-radius: 3px; }
  .gallery-urls .copy-btn { background: none; border: none; cursor: pointer; padding: 2px 4px; vertical-align: middle; opacity: 0.5; }
  .gallery-urls .copy-btn:hover { opacity: 1; }
  .gallery-urls .copy-btn svg { width: 14px; height: 14px; fill: var(--muted); vertical-align: middle; }
  .gallery-urls .copied-flash { color: var(--accent); font-size: 11px; margin-left: 4px; }
  #galleryGrid { max-height: calc(100vh - 400px); overflow-y: auto; }
  .gallery-section-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .gallery-hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .gallery-section { display: flex; flex-wrap: wrap; gap: 6px; }
  .gallery-thumb { position: relative; width: 150px; height: 150px; cursor: pointer; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
  .gallery-thumb img, .gallery-thumb video { width: 150px; height: 150px; object-fit: cover; display: block; }
  .gallery-thumb .play-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.15); opacity: 1; transition: opacity 0.15s; pointer-events: none;
  }
  .gallery-thumb .play-overlay svg { width: 32px; height: 32px; fill: rgba(255,255,255,0.85); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
  .gallery-thumb.playing .play-overlay { opacity: 0; }
  .gallery-thumb:hover .play-overlay { opacity: 1 !important; }
  .gallery-thumb .expand-btn {
    position: absolute; top: 4px; right: 4px; width: 26px; height: 26px;
    background: rgba(0,0,0,0.5); border: none; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s; z-index: 2;
  }
  .gallery-thumb .expand-btn svg { width: 14px; height: 14px; fill: #fff; }
  .gallery-thumb:hover .expand-btn { opacity: 1; }
  .gallery-thumb .thumb-img { width: 150px; height: 150px; object-fit: cover; display: block; border-radius: 4px; background: var(--bg); }
  .gallery-thumb .thumb-idx {
    position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.55);
    color: rgba(255,255,255,0.7); font-size: 10px; padding: 1px 5px;
    border-radius: 3px; pointer-events: none; line-height: 1.4;
  }
  .gallery-empty { color: var(--muted); padding: 30px; text-align: center; }
  #detailsMetaContent::-webkit-scrollbar { display: none; }
  .detail-meta p { white-space: pre-wrap; word-break: break-word; max-height: none; overflow: visible; }

  /* ── Detail view ── */
  .detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 1100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .detail-content { display: flex; gap: 20px; max-width: 1200px; width: 100%; max-height: calc(100vh - 40px); }
  .detail-image { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .detail-image img { max-width: 100%; max-height: calc(100vh - 80px); object-fit: contain; border-radius: 8px; }
  .detail-meta {
    width: 320px; flex-shrink: 0; overflow-y: auto; background: var(--bg-card, #1a1a2e);
    border-radius: 8px; padding: 16px; font-size: 13px; color: var(--text); max-height: calc(100vh - 80px);
  }
  .detail-meta h4 { margin: 0 0 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .detail-meta p { margin: 0 0 14px; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow-y: auto; line-height: 1.5; }
  .detail-meta .meta-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .detail-meta .meta-row span:first-child { color: var(--muted); }
  .detail-meta .meta-loras { margin: 0 0 14px; }
  .detail-meta .meta-loras span { display: block; padding: 2px 0; }
  .detail-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    font-size: 28px; padding: 16px 18px; cursor: pointer; border-radius: 8px; z-index: 10;
  }
  .detail-nav:hover { background: rgba(255,255,255,0.15); }
  .detail-nav.prev { left: 8px; }
  .detail-nav.next { right: 8px; }
  .detail-close {
    position: absolute; top: 10px; right: 16px; background: none; border: none;
    color: #fff; font-size: 28px; cursor: pointer; z-index: 10;
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="main-nav">
  <a href="/home" class="nav-link">Home</a>
  <a href="/admin/nodes" class="nav-link">Nodes</a>
  <a href="/admin/models" class="nav-link">Models</a>
  <a href="/admin/loras" class="nav-link active">LoRAs</a>
  <a href="/admin/workflows" class="nav-link">Workflows</a>
  <a href="/admin/queue" class="nav-link">Queue</a>

<!-- Header -->
<header>

  <div class="header-actions"><button class="btn" id="addLoraBtn">Add LoRA from CivitAI...</button></div>
</header>

<!-- Status bar -->
<div class="status-bar" id="statusBar">

  <span class="stat stat--queued" id="statQueued">0 queued</span>

  </span>
</div>

<!-- Filter panel -->
<div class="filter-panel">
  <div class="filter-row" style="display:none;">
    <span class="filter-label">Categories</span>
    <div id="categoryFilters" class="tag-group"></div>
  </div>
  <div class="filter-row" style="display:none;">
    <span class="filter-label">Tags</span>
    <div id="tagFilters" class="tag-group"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">Base Model</span>
    <div id="baseModelFilters" class="tag-group"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">Status</span>
    <div id="statusFilters" class="tag-group">
      <button class="filter-tag active" data-status="present">&#10003; present</button>
      <button class="filter-tag active" data-status="missing">&#10005; missing</button>

      <button class="filter-tag active" data-status="error">&#9888; error</button>

  </div>
  <div class="filter-row">
    <span class="filter-label">Sort</span>
    <div class="sort-group" id="sortGroup">
      <button class="sort-btn active" data-sort="name">Name <span class="sort-arrow">&#9650;</span></button>

      <button class="sort-btn" data-sort="status">Status</button>

    <span class="filter-label" style="margin-left:auto">View</span>

<!-- Main content -->

<!-- Lookup Overlay -->

<!-- Image Modal (lookup image enlargement) -->
<div id="imgModal" style="display:none" class="img-modal">

  </div>

<!-- Gallery Overlay -->

      </select></label>

<!-- Detail Overlay (gallery image detail) -->

      <div style="display:flex;gap:8px;align-items:center">

        <button onclick="document.getElementById('detailsMetaOverlay').style.display='none'" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">&times;</button>

  </div>
</div>

<script src="/static/js/shared.js"></script>
<script>
(function() {
  'use strict';

  // ── State ──
  let categories = [];
  let activeCategories = new Set();
  let activeTags = new Set();
  let activeStatuses = new Set(['present', 'missing', 'queued', 'downloading', 'error']);
  let activeBaseModels = new Set();
  let currentSort = 'name';
  let sortAscending = true;
  let currentView = 'extended';
  let searchQuery = '';
  let pollTimer = null;
  const cardMap = {};
  const sectionMap = {};
  let allTags = [];

  // ── DOM refs ──
  const $searchInput  = document.getElementById('searchInput');
  const $main         = document.getElementById('mainContent');
  const $loading      = document.getElementById('loadingState');
  const $categoryFilters = document.getElementById('categoryFilters');
  const $tagFilters   = document.getElementById('tagFilters');
  const $statusFilters = document.getElementById('statusFilters');
  const $sortGroup    = document.getElementById('sortGroup');
  const $viewGroup    = document.getElementById('viewGroup');
  const $statDownloading = document.getElementById('statDownloading');
  const $statQueued   = document.getElementById('statQueued');
  const $statPresent  = document.getElementById('statPresent');
  const $statDisk     = document.getElementById('statDisk');
  const $maxConcurrent = document.getElementById('maxConcurrent');

  // ── Page-specific utilities ──
  function fmtSize(gb) {
    if (!gb) return '--';
    if (gb < 0.01) return (gb * 1024).toFixed(0) + ' MB';
    return gb + ' GB';
  }

  function makeSourceLink(url, model) {
    if (!url) return '';
    if (url.includes('civitai.com/api/download/models/')) {
      // Use civitai_model_id if available (correct), otherwise extract version ID
      if (model && model.civitai_model_id) {
        const match = url.match(/models\/(\d+)/);
        var vid = match ? match[1] : '';
        return 'https://civitai.com/models/' + model.civitai_model_id + (vid ? '?modelVersionId=' + vid : '');
      }
      const match = url.match(/models\/(\d+)/);
      if (match) return 'https://civitai.com/models/?modelVersionId=' + match[1];
    }
    return url;
  }

  function statusOrder(status) {
    const order = { downloading: 0, queued: 1, error: 2, missing: 3, present: 4 };
    return order[status] !== undefined ? order[status] : 5;
  }

  // ── Initial load ──
  async function initialLoad() {
    try {
      const resp = await apiFetch('/api/admin/loras');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const data = await resp.json();
      handleModelData(data);
      $loading.style.display = 'none';
    } catch (e) {
      if (e.message !== 'auth') {
        console.error('Initial load error:', e);
      }
    }
  }

  // Make loadModels an alias for initialLoad (used by sync handler)
  var loadModels = initialLoad;

  // ── Tag extraction ──
  function extractAllTags(cats) {
    const freq = {};
    for (const cat of cats) {
      for (const m of cat.models) {
        for (const t of (m.tags || [])) {
          freq[t] = (freq[t] || 0) + 1;
        }
      }
    }
    return Object.entries(freq)
      .sort((a, b) => b[1] - a[1])
      .map(e => e[0]);
  }

  // ── Build filter UI ──
  function buildCategoryFilters(cats) {
    $categoryFilters.innerHTML = '';
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.dataset.category = cat.id;
      btn.textContent = cat.name;
      if (activeCategories.has(cat.id)) btn.classList.add('active');
      btn.addEventListener('click', () => {
        if (activeCategories.has(cat.id)) {
          activeCategories.delete(cat.id);
          btn.classList.remove('active');
        } else {
          activeCategories.add(cat.id);
          btn.classList.add('active');
        }
        applyFiltersAndSort();
      });
      $categoryFilters.appendChild(btn);
    });
  }

  function buildBaseModelFilters(cats) {
    var $el = document.getElementById('baseModelFilters');
    $el.innerHTML = '';
    var bms = new Set();
    cats.forEach(function(cat) {
      cat.models.forEach(function(m) {
        var bm = m.base_model || m.civitai_base_model || '';
        bms.add(bm || '(none)');
      });
    });
    Array.from(bms).sort().forEach(function(bm) {
      var btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.dataset.baseModel = bm;
      btn.textContent = bm;
      if (activeBaseModels.has(bm)) btn.classList.add('active');
      btn.addEventListener('click', function() {
        if (activeBaseModels.has(bm)) {
          activeBaseModels.delete(bm);
          btn.classList.remove('active');
        } else {
          activeBaseModels.add(bm);
          btn.classList.add('active');
        }
        applyFiltersAndSort();
      });
      $el.appendChild(btn);
    });
  }

  function buildTagFilters(tags) {
    $tagFilters.innerHTML = '';
    const top20 = tags.slice(0, 20);
    top20.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.dataset.tag = tag;
      btn.textContent = tag;
      if (activeTags.has(tag)) btn.classList.add('active');
      btn.addEventListener('click', () => {
        if (activeTags.has(tag)) {
          activeTags.delete(tag);
          btn.classList.remove('active');
        } else {
          activeTags.add(tag);
          btn.classList.add('active');
        }
        applyFiltersAndSort();
      });
      $tagFilters.appendChild(btn);
    });
  }

  // Status filter click handlers
  $statusFilters.querySelectorAll('.filter-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      const status = btn.dataset.status;
      if (activeStatuses.has(status)) {
        activeStatuses.delete(status);
        btn.classList.remove('active');
      } else {
        activeStatuses.add(status);
        btn.classList.add('active');
      }
      applyFiltersAndSort();
    });
  });

  // Sort button click handlers
  $sortGroup.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const sort = btn.dataset.sort;
      if (currentSort === sort) {
        sortAscending = !sortAscending;
      } else {
        currentSort = sort;
        sortAscending = true;
      }
      // Update active states
      $sortGroup.querySelectorAll('.sort-btn').forEach(b => {
        b.classList.remove('active');
        const arrow = b.querySelector('.sort-arrow');
        if (arrow) arrow.remove();
      });
      btn.classList.add('active');
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow' + (sortAscending ? '' : ' desc');
      arrow.innerHTML = '&#9650;';
      btn.appendChild(arrow);
      sortCards();
    });
  });

  // View toggle click handlers
  $viewGroup.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const view = btn.dataset.view;
      if (currentView === view) return;
      currentView = view;
      $viewGroup.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyView();
    });
  });

  // Search handler
  $searchInput.addEventListener('input', () => {
    searchQuery = $searchInput.value.trim().toLowerCase();
    applyFiltersAndSort();
  });

  // Concurrent downloads handler
  $maxConcurrent.addEventListener('change', async () => {
    const val = parseInt($maxConcurrent.value, 10);
    try {
      await apiFetch('/api/admin/settings', {
        method: 'PUT',
        body: { max_concurrent_downloads: val }
      });
    } catch (e) {
      if (e.message !== 'auth') {
        console.error('Failed to update concurrent setting:', e);
      }
    }
  });

  // ── Data handling ──
  function handleModelData(data) {
    const cats = data.categories || [];
    categories = cats;

    // Attach _category and _searchText to each model
    cats.forEach(cat => {
      cat.models.forEach(m => {
        m._category = cat.id;
        m._searchText = [m.name, m.file, ...(m.tags || [])].join(' ').toLowerCase();
      });
    });

    allTags = extractAllTags(cats);
    buildCategoryFilters(cats);
    buildBaseModelFilters(cats);
    buildTagFilters(allTags);
    cats.forEach(buildSection);
    cats.forEach(cat => {
      cat.models.forEach(m => updateCard(cat.id, m));
    });

    if (data.stats) updateStatusBar(data.stats);
    if (data.settings && data.settings.max_concurrent_downloads != null) {
      $maxConcurrent.value = String(data.settings.max_concurrent_downloads);
    }

    applyFiltersAndSort();
    _autoPoll(data.stats);
  }

  function mergeModelData(data) {
    const cats = data.categories || [];
    categories = cats;

    cats.forEach(cat => {
      cat.models.forEach(m => {
        m._category = cat.id;
        m._searchText = [m.name, m.file, ...(m.tags || [])].join(' ').toLowerCase();
      });
    });

    const newTags = extractAllTags(cats);
    if (newTags.join(',') !== allTags.join(',')) {
      allTags = newTags;
      buildTagFilters(allTags);
    }

    cats.forEach(cat => {
      if (!sectionMap[cat.id]) buildSection(cat);
      cat.models.forEach(m => updateCard(cat.id, m));
    });

    if (data.stats) updateStatusBar(data.stats);
    if (data.settings && data.settings.max_concurrent_downloads != null) {
      $maxConcurrent.value = String(data.settings.max_concurrent_downloads);
    }

    applyFiltersAndSort();

    // Auto-manage polling: only poll when something is active
    _autoPoll(data.stats);
  }

  function _autoPoll(stats) {
    const st = stats || {};
    const busy = (st.downloading_count || 0) + (st.queued_count || 0);
    if (busy > 0) {
      if (!pollTimer) startPolling();
    } else {
      stopPolling();
    }
  }

  // ── Status bar ──
  function updateStatusBar(stats) {
    if (!stats) return;

    const dlCount = stats.downloading_count || 0;
    const dlSpeed = stats.total_speed_bytes || 0;
    if (dlCount > 0 && dlSpeed > 0) {
      $statDownloading.textContent = dlCount + ' downloading @ ' + fmtBytes(dlSpeed) + '/s';
    } else if (dlCount > 0) {
      $statDownloading.textContent = dlCount + ' downloading';
    } else {
      $statDownloading.textContent = '0 downloading';
    }

    const queuedCount = stats.queued_count || 0;
    $statQueued.textContent = queuedCount + ' queued';

    const presentCount = stats.present_count || 0;
    const totalCount = stats.total_count || 0;
    $statPresent.textContent = presentCount + ' / ' + totalCount + ' present';

    const modelBytes = stats.models_bytes;
    const freeBytes = stats.free_bytes;
    if (modelBytes != null && freeBytes != null) {
      $statDisk.textContent = 'LoRAs: ' + fmtBytes(modelBytes) + ' \u00b7 Free: ' + fmtBytes(freeBytes);
    }
  }

  function computeStatusBarFromData() {
    let dlCount = 0, queuedCount = 0, presentCount = 0, totalCount = 0;
    categories.forEach(cat => {
      cat.models.forEach(m => {
        totalCount++;
        if (m.status === 'downloading') dlCount++;
        else if (m.status === 'queued') queuedCount++;
        else if (m.status === 'present') presentCount++;
      });
    });
    $statDownloading.textContent = dlCount + ' downloading';
    $statQueued.textContent = queuedCount + ' queued';
    $statPresent.textContent = presentCount + ' / ' + totalCount + ' present';
  }

  // ── Sections ──
  function buildSection(cat) {
    if (sectionMap[cat.id]) return;

    const section = document.createElement('section');
    section.className = 'category-section';
    section.dataset.category = cat.id;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = '<h2 class="section-title">' + escHtml(cat.name) + '</h2><span class="section-count"></span>';
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'card-grid';
    grid.dataset.grid = cat.id;
    section.appendChild(grid);

    $main.appendChild(section);
    sectionMap[cat.id] = section;
  }

  // ── Filter logic ──
  function isCardVisible(model) {
    if (activeCategories.size > 0 && !activeCategories.has(model._category)) return false;
    if (activeTags.size > 0) {
      const modelTags = new Set(model.tags || []);
      for (const t of activeTags) {
        if (!modelTags.has(t)) return false;
      }
    }
    if (activeStatuses.size > 0 && !activeStatuses.has(model.status)) return false;
    if (activeBaseModels.size > 0) {
      var bm = model.base_model || model.civitai_base_model || '(none)';
      if (!activeBaseModels.has(bm)) return false;
    }
    if (searchQuery && !model._searchText.includes(searchQuery)) return false;
    return true;
  }

  function applyFiltersAndSort() {
    // Apply visibility
    Object.values(cardMap).forEach(entry => {
      const visible = isCardVisible(entry.model);
      if (visible) {
        entry.el.classList.remove('card-hidden');
      } else {
        entry.el.classList.add('card-hidden');
      }
    });

    // Sort cards
    sortCards();

    // Update section visibility and counts
    updateSectionVisibility();
  }

  function sortCards() {
    for (const [catId, section] of Object.entries(sectionMap)) {
      const grid = section.querySelector('.card-grid');
      if (!grid) continue;
      const cards = [...grid.children].sort((a, b) => {
        const entryA = cardMap[a.dataset.file];
        const entryB = cardMap[b.dataset.file];
        if (!entryA || !entryB) return 0;
        const ma = entryA.model;
        const mb = entryB.model;
        let cmp = 0;
        if (currentSort === 'name') cmp = ma.name.localeCompare(mb.name);
        else if (currentSort === 'size') cmp = (ma.size_gb || 0) - (mb.size_gb || 0);
        else if (currentSort === 'status') cmp = statusOrder(ma.status) - statusOrder(mb.status);
        return sortAscending ? cmp : -cmp;
      });
      cards.forEach(c => grid.appendChild(c));
    }
  }

  function updateSectionVisibility() {
    for (const [catId, section] of Object.entries(sectionMap)) {
      const grid = section.querySelector('.card-grid');
      if (!grid) continue;
      const visibleCards = grid.querySelectorAll('.model-card:not(.card-hidden)');
      const count = visibleCards.length;
      const countEl = section.querySelector('.section-count');
      if (countEl) countEl.textContent = '(' + count + ' shown)';
      if (count === 0) {
        section.classList.add('section-hidden');
      } else {
        section.classList.remove('section-hidden');
      }
    }
  }

  function applyView() {
    Object.values(sectionMap).forEach(section => {
      const grid = section.querySelector('.card-grid');
      if (!grid) return;
      if (currentView === 'compact') {
        grid.classList.add('compact');
      } else {
        grid.classList.remove('compact');
      }
    });
  }

  // ── Cards ──

    // Old source link replaced by model-links badges

    card.innerHTML =
      '<div class="card-top">' +
        '<div class="card-info">' +
          '<div class="card-name" data-ref="name"></div>' +
          '<div class="card-meta" data-ref="meta"></div>' +

        '<span class="card-compact-source" data-ref="compactSource"></span>' +

    refs.name.innerHTML = escHtml(m.name) + ' <span style="cursor:pointer;opacity:0.4;font-size:11px;margin-left:0.5em;" onmouseenter="this.style.opacity=0.8" onmouseleave="this.style.opacity=0.4" onclick="event.stopPropagation();showModelJson(this)" data-model=\'' + escHtml(JSON.stringify(m)).replace(/'/g, '&#39;') + '\' title="View JSON"><span class="icon icon-eye icon-sm"></span></span>';

  function updateCard(catId, m) {
    let entry = cardMap[m.file];
    if (!entry) {
      entry = createCard(catId, m);
    }

    entry.model = m;

    const { el, refs } = entry;
    const badge = refs.badge;
    const progress = refs.progress;
    const fill = refs.fill;
    const pct = refs.pct;
    const pbytes = refs.pbytes;
    const btn = refs.actionBtn;
    const errorEl = refs.error;

    // Reset status classes
    el.classList.remove('status-downloading', 'status-error', 'status-present', 'status-missing', 'status-queued');
    el.classList.add('status-' + m.status);

    badge.className = 'status-badge ' + m.status;

    // Reset compact progress
    el.style.setProperty('--compact-progress', '0%');

    switch (m.status) {
      case 'present':
        badge.textContent = '\u2713';
        badge.title = 'Installed';
        btn.className = 'btn btn--sm btn--danger';
        btn.disabled = false;
        btn.innerHTML = '\uD83D\uDDD1 Delete';
        progress.classList.remove('visible');
        fill.classList.remove('indeterminate');
        errorEl.classList.remove('visible');
        break;

      case 'missing':
        badge.textContent = '\u2715';
        badge.title = 'Missing';
        btn.className = 'btn btn--sm';
        btn.disabled = false;
        btn.innerHTML = '\u2193 Download';
        progress.classList.remove('visible');
        fill.classList.remove('indeterminate');
        errorEl.classList.remove('visible');
        break;

      case 'queued':
        badge.textContent = '\u25F7';
        badge.title = 'Queued';
        btn.className = 'btn btn--sm';
        btn.disabled = true;
        btn.textContent = 'Queued...';
        progress.classList.remove('visible');
        fill.classList.remove('indeterminate');
        errorEl.classList.remove('visible');
        break;

      case 'downloading':
        badge.textContent = '\u2193';
        badge.title = 'Downloading';
        btn.className = 'btn btn--sm';
        btn.disabled = true;
        btn.textContent = 'Downloading...';
        progress.classList.add('visible');
        errorEl.classList.remove('visible');

        if (m.expected_bytes && m.expected_bytes > 0 && m.progress != null) {
          fill.classList.remove('indeterminate');
          fill.style.width = m.progress.toFixed(1) + '%';
          el.style.setProperty('--compact-progress', m.progress.toFixed(1) + '%');

          const speedStr = m.speed_bytes ? ' \u00b7 ' + fmtBytes(m.speed_bytes) + '/s' : '';
          pct.textContent = m.progress.toFixed(1) + '%' + speedStr;
        } else {
          fill.classList.add('indeterminate');
          fill.style.width = '';
          el.style.setProperty('--compact-progress', '50%');

          const speedStr = m.speed_bytes ? fmtBytes(m.speed_bytes) + '/s' : '...';
          pct.textContent = speedStr;
        }

        const dlBytes = m.on_disk_bytes || 0;
        if (m.expected_bytes && m.expected_bytes > 0) {
          pbytes.textContent = fmtBytes(dlBytes) + ' / ' + fmtBytes(m.expected_bytes);
        } else {
          pbytes.textContent = fmtBytes(dlBytes);
        }
        break;

      case 'error':
        badge.textContent = '\u26A0';
        badge.title = 'Error';
        btn.className = 'btn btn--sm';
        btn.disabled = false;
        btn.innerHTML = '\u21BB Retry';
        progress.classList.remove('visible');
        fill.classList.remove('indeterminate');
        if (m.error) {
          errorEl.textContent = m.error;
          errorEl.classList.add('visible');
        } else {
          errorEl.classList.remove('visible');
        }
        break;
    }
  }

  // ── Card actions ──
  async function handleCardAction(filename) {
    const entry = cardMap[filename];
    if (!entry) return;
    const m = entry.model;
    const btn = entry.refs.actionBtn;

    if (m.status === 'missing' || m.status === 'error') {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner sm"></span> Starting...';
      try {
        const resp = await apiFetch('/api/admin/models/download/' + encodeURIComponent(filename), { method: 'POST' });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          showToast('Download error: ' + (err.detail || err.error || resp.status), 5000, 'error');
          btn.disabled = false;
          btn.textContent = m.status === 'error' ? '\u21BB Retry' : '\u2193 Download';
        } else {
          startPolling();
        }
      } catch (e) {
        if (e.message !== 'auth') {
          showToast('Error: ' + e.message, 5000, 'error');
          btn.disabled = false;
          btn.textContent = m.status === 'error' ? '\u21BB Retry' : '\u2193 Download';
        }
      }
    } else if (m.status === 'present') {
      if (!await studioConfirm('Delete ' + m.name + ' (' + m.file + ')?', {danger: true, yes: 'Delete'})) return;
      btn.disabled = true;
      btn.textContent = 'Deleting...';
      try {
        const resp = await apiFetch('/api/admin/models/' + encodeURIComponent(filename), { method: 'DELETE' });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          showToast('Delete error: ' + (err.detail || err.error || resp.status), 5000, 'error');
          btn.disabled = false;
          btn.innerHTML = '\uD83D\uDDD1 Delete';
        }
      } catch (e) {
        if (e.message !== 'auth') {
          showToast('Error: ' + e.message, 5000, 'error');
          btn.disabled = false;
          btn.innerHTML = '\uD83D\uDDD1 Delete';
        }
      }
    }
  }

  // ── Batch downloads ──
  async function downloadMissing(filenames) {
    if (!filenames.length) return;
    try {
      const resp = await apiFetch('/api/admin/models/download-batch', {
        method: 'POST',
        body: { filenames: filenames }
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showToast('Batch download error: ' + (err.detail || err.error || resp.status), 5000, 'error');
      } else {
        startPolling();
      }
    } catch (e) {
      if (e.message !== 'auth') {
        showToast('Error: ' + e.message, 5000, 'error');
      }
    }
  }

  // ── Polling ──
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(pollModels, 3000);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  async function pollModels() {
    try {
      const resp = await apiFetch('/api/admin/loras');
      if (!resp.ok) return;
      const data = await resp.json();
      mergeModelData(data);
    } catch (e) {
      if (e.message !== 'auth') {

  // ── Shared: render generation metadata ──
  function renderMeta(meta) {
    if (!meta || Object.keys(meta).length === 0)
      return '<p style="color:var(--muted)">No generation data available</p>';
    var h = '';
    // ID and date first — use _item_id (file stem) as fallback
    var displayId = meta.civitai_id || meta._item_id || '';
    if (displayId) h += '<div class="meta-row"><span>ID</span><span>' + escHtml(String(displayId)) + '</span></div>';
    if (meta.createdAt) h += '<div class="meta-row"><span>Created</span><span>' + escHtml(meta.createdAt) + '</span></div>';
    // CivitAI links — always show URL if available
    if (meta.civitai_page) h += '<div class="meta-row"><span>CivitAI</span><span><a href="' + escHtml(meta.civitai_page) + '" target="_blank" style="color:var(--accent)">Open page <i class="icon icon-external-link" style="width:11px;height:11px;vertical-align:middle;margin-left:2px"></i></a></span></div>';
    if (meta.url) h += '<div class="meta-row"><span>Asset</span><span><a href="' + escHtml(meta.url) + '" target="_blank" style="color:var(--accent)">Open page <i class="icon icon-external-link" style="width:11px;height:11px;vertical-align:middle;margin-left:2px"></i></a></span></div>';
    if (meta.username) h += '<div class="meta-row"><span>Author</span><span>' + escHtml(meta.username) + '</span></div>';
    if (meta.baseModel) h += '<div class="meta-row"><span>Base Model</span><span>' + escHtml(meta.baseModel) + '</span></div>';
    if (meta.width && meta.height) h += '<div class="meta-row"><span>Resolution</span><span>' + meta.width + 'x' + meta.height + '</span></div>';
    if (meta.type) h += '<div class="meta-row"><span>Type</span><span>' + escHtml(meta.type) + '</span></div>';
    // Generation params from raw_meta
    var rm = meta.raw_meta || meta;
    if (rm.prompt) h += '<h4>Positive Prompt</h4><p>' + escHtml(rm.prompt) + '</p>';
    if (rm.negativePrompt) h += '<h4>Negative Prompt</h4><p>' + escHtml(rm.negativePrompt) + '</p>';
    if (rm.Model || rm.model) h += '<div class="meta-row"><span>Checkpoint</span><span>' + escHtml(rm.Model || rm.model) + '</span></div>';
    var loras = rm.loras || (rm.resources || []).filter(function(r) { return (r.type || '').toLowerCase() === 'lora'; });
    if (loras.length) {
      h += '<h4>LoRAs Used</h4><div class="meta-loras">';
      loras.forEach(function(l) { h += '<span>' + escHtml(l.name || '') + (l.weight != null ? ' (' + l.weight + ')' : '') + '</span>'; });
      h += '</div>';
    }
    if (rm.seed != null) h += '<div class="meta-row"><span>Seed</span><span>' + rm.seed + '</span></div>';
    if (rm.steps != null) h += '<div class="meta-row"><span>Steps</span><span>' + rm.steps + '</span></div>';
    if (rm.cfgScale != null) h += '<div class="meta-row"><span>CFG</span><span>' + rm.cfgScale + '</span></div>';
    if (rm.sampler) h += '<div class="meta-row"><span>Sampler</span><span>' + escHtml(rm.sampler) + '</span></div>';
    if (rm.clipSkip != null) h += '<div class="meta-row"><span>Clip Skip</span><span>' + rm.clipSkip + '</span></div>';
    if (rm.Size || rm.size) h += '<div class="meta-row"><span>Size</span><span>' + (rm.Size || rm.size) + '</span></div>';
    // Raw metadata copy button
    if (meta.raw_item || meta.raw_meta) {
      h += '<div class="meta-row" style="margin-top:8px"><span>Raw Metadata</span><span>' +
        '<button class="copy-meta-btn" style="background:none;border:1px solid var(--border);border-radius:4px;padding:3px 8px;cursor:pointer;color:var(--muted);font-size:11px">Copy JSON</button></span></div>';
    }
    // Details button (fetches full metadata on demand)
    if (meta.civitai_id) {
      h += '<div style="margin-top:12px;text-align:center">' +

  var _lastRenderedMeta = null;
  var _extractMetaJson = '';

  document.addEventListener('click', function(e) {

  // ── Lookup Dialog ──
  var lookupData = null;

  function openLookup() {
    var ov = document.getElementById('lookupOverlay');
    ov.style.display = 'flex';
    document.getElementById('lookupUrl').value = '';
    document.getElementById('lookupUrl').focus();
    document.getElementById('lookupSpinner').style.display = 'none';
    document.getElementById('lookupError').style.display = 'none';
    document.getElementById('lookupCard').innerHTML = '';
    lookupData = null;
  }

  function closeLookup() {
    document.getElementById('lookupOverlay').style.display = 'none';
  }

  function parseInput(raw) {
    // URL → pass as-is
    if (raw.match(/https?:\/\//)) return { type: 'url', urls: [raw] };
    // Split by comma, space, newline → extract numeric IDs
    var ids = raw.split(/[\s,]+/).map(function(s) { return s.trim(); }).filter(function(s) { return /^\d+$/.test(s); });
    if (ids.length === 0) return null;
    if (ids.length === 1) return { type: 'url', urls: ['https://civitai.com/models/' + ids[0]] };
    return { type: 'batch', ids: ids };
  }

  async function doSingleLookup(url, card, spinner, errorEl) {
    spinner.style.display = '';
    errorEl.style.display = 'none';
    card.innerHTML = '';
    try {
      var resp = await apiFetch('/api/admin/loras/lookup-civitai', {
        method: 'POST', body: { url: url }
      });
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        throw new Error(err.detail || 'Lookup failed (HTTP ' + resp.status + ')');
      }
      lookupData = await resp.json();
      spinner.style.display = 'none';
      renderLookupResult(lookupData);
    } catch (e) {
      spinner.style.display = 'none';
      if (e.message !== 'auth') { errorEl.textContent = e.message; errorEl.style.display = ''; }
    }
  }

  async function doBatchLookup(ids) {
    var spinner = document.getElementById('lookupSpinner');
    var errorEl = document.getElementById('lookupError');
    var card = document.getElementById('lookupCard');
    spinner.style.display = '';
    errorEl.style.display = 'none';
    card.innerHTML = '';

    var results = [];
    for (var i = 0; i < ids.length; i++) {
      spinner.innerHTML = '<span class="spinner"></span> Looking up ' + (i+1) + '/' + ids.length + '...';
      try {
        var resp = await apiFetch('/api/admin/loras/lookup-civitai', {
          method: 'POST', body: { url: 'https://civitai.com/models/' + ids[i] }
        });
        if (resp.ok) results.push(await resp.json());
      } catch(e) {}
    }
    spinner.style.display = 'none';
    spinner.innerHTML = '<span class="spinner"></span> Looking up model...';
    if (results.length === 0) { errorEl.textContent = 'No models found'; errorEl.style.display = ''; return; }
    renderBatchResults(results);
  }

  function renderBatchResults(results) {
    var card = document.getElementById('lookupCard');
    card.innerHTML = '<div class="batch-results"></div>';
    var container = card.querySelector('.batch-results');

    results.forEach(function(d) {
      var rating = d.stats.rating || 0;
      var stars = '';
      for (var i = 1; i <= 5; i++) stars += i <= Math.round(rating) ? '\u2605' : '\u2606';

      var row = document.createElement('div');
      row.className = 'batch-row';
      row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px';

      // Preview thumb
      var thumbUrl = '';
      for (var vi = 0; vi < d.versions.length && !thumbUrl; vi++) {
        var imgs = d.versions[vi].images || [];
        if (imgs.length) thumbUrl = imgs[0].url;
      }
      var thumbHtml = thumbUrl ? '<img src="' + escHtml(thumbUrl) + '" style="width:60px;height:60px;object-fit:cover;border-radius:4px;flex-shrink:0">' : '<div style="width:60px;height:60px;background:var(--bg);border-radius:4px;flex-shrink:0"></div>';

      var versCount = d.versions.length;
      var baseModels = d.versions.map(function(v) { return v.base_model; }).filter(Boolean);
      var baseStr = [...new Set(baseModels)].join(', ');

      row.innerHTML = thumbHtml +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escHtml(d.name) + '</div>' +
          '<div style="font-size:11px;color:var(--muted)">' +
            escHtml(d.author) + ' · ' + stars + ' · ' + (d.stats.download_count || 0).toLocaleString() + ' dl · ' + versCount + ' ver' +
            (baseStr ? ' · ' + escHtml(baseStr) : '') +
          '</div>' +
        '</div>' +
        '<button class="btn btn--sm batch-view-btn" style="flex-shrink:0">View</button>' +
        '<button class="btn btn--sm batch-add-btn" style="flex-shrink:0">Add</button>';

      row.querySelector('.batch-view-btn').addEventListener('click', function() {
        lookupData = d;
        renderLookupResult(d);
      });
      row.querySelector('.batch-add-btn').addEventListener('click', async function() {
        var btn = this;
        // Auto-select all versions and add
        btn.disabled = true; btn.innerHTML = '<span class="spinner sm"></span>';
        try {
          var resp = await apiFetch('/api/admin/loras/add-civitai', {
            method: 'POST',
            body: {
              model_id: d.model_id, model_name: d.name, author: d.author,
              description: d.description, tags: d.tags,
              rating: d.stats.rating, downloads: d.stats.download_count,
              versions: d.versions, preview_images: d.preview_images
            }
          });
          if (resp.ok) {
            var result = await resp.json();
            btn.textContent = result.added.length ? 'Added ' + result.added.length : 'Skipped';
            btn.style.color = 'var(--accent)';
            showToast('Added ' + result.added.length + ' version(s) of ' + d.name);
          } else {
            btn.textContent = 'Error'; btn.disabled = false;
          }
        } catch(e) {
          btn.textContent = 'Error'; btn.disabled = false;
        }
      });

      container.appendChild(row);
    });
  }

  async function doLookup() {
    var raw = document.getElementById('lookupUrl').value.trim();
    if (!raw) return;
    var parsed = parseInput(raw);
    if (!parsed) {
      var errorEl = document.getElementById('lookupError');
      errorEl.textContent = 'Enter a CivitAI URL, model ID, or comma-separated IDs';
      errorEl.style.display = '';
      return;
    }
    if (parsed.type === 'batch') {
      doBatchLookup(parsed.ids);
    } else {
      doSingleLookup(parsed.urls[0],
        document.getElementById('lookupCard'),
        document.getElementById('lookupSpinner'),
        document.getElementById('lookupError'));
    }
  }

  function renderLookupResult(d) {
    var card = document.getElementById('lookupCard');

    // Stars
    var rating = d.stats.rating || 0;
    var stars = '';
    for (var i = 1; i <= 5; i++) stars += i <= Math.round(rating) ? '\u2605' : '\u2606';

    // Tags
    var tagsHtml = d.tags.map(function(t) { return '<span class="lookup-pill">' + escHtml(t) + '</span>'; }).join('');

    // Trigger words from all versions
    var triggers = new Set();
    d.versions.forEach(function(v) { (v.trigger_words || []).forEach(function(w) { triggers.add(w); }); });
    var triggerHtml = '';
    if (triggers.size > 0) {
      triggerHtml = '<div class="lookup-pills" style="margin-top:4px">' +
        Array.from(triggers).map(function(w) { return '<span class="lookup-pill trigger">' + escHtml(w) + '</span>'; }).join('') +
        '</div>';
    }

    // Preview images
    // Collect version images (model card images) + build meta lookup from preview_images
    var metaById = {};
    (d.preview_images || []).forEach(function(img) { if (img.id && img.meta) metaById[img.id] = img.meta; });
    var allImages = [];
    d.versions.forEach(function(v) {
      (v.images || []).forEach(function(img) {
        if (img.url) allImages.push({ url: img.url, id: img.id, type: img.type || 'image', meta: metaById[img.id] || {} });
      });
    });
    if (allImages.length === 0) {
      (d.preview_images || []).forEach(function(img) {
        if (img.url) allImages.push({ url: img.url, id: img.id, type: 'image', meta: img.meta || {} });
      });
    }
    var imgsHtml = '';
    if (allImages.length) {
      imgsHtml = '<div class="lookup-images">';
      allImages.forEach(function(img) {
        var metaAttr = ' data-meta="' + escHtml(JSON.stringify(img.meta)) + '" data-url="' + escHtml(img.url) + '"';
        if (img.type === 'video' || img.url.match(/\.(mp4|webm)(\?|$)/i)) {
          imgsHtml += '<video src="' + escHtml(img.url) + '"' + metaAttr + ' muted autoplay loop playsinline preload="metadata" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;cursor:pointer"></video>';
        } else {
          imgsHtml += '<img src="' + escHtml(img.url) + '"' + metaAttr + ' loading="lazy">';
        }
      });
      imgsHtml += '</div>';
    }

    // Versions
    var versHtml = '<div class="lookup-versions">';
    d.versions.forEach(function(v) {
      var f = v.files && v.files[0];
      if (!f) return;
      var checked = v.version_id === d.selected_version_id ? ' checked' : '';
      var sizeStr = f.size_kb ? (f.size_kb / 1000000).toFixed(2) + ' GB' : '--';
      versHtml += '<div class="lookup-version">' +
        '<label><input type="checkbox" data-vid="' + v.version_id + '"' + checked + '>' +
        '<span class="ver-name">' + escHtml(v.name) + '</span>' +
        '<span class="ver-file" title="' + escHtml(f.name) + '">' + escHtml(f.name) + '</span>' +
        '<span class="ver-size">' + sizeStr + '</span>' +
        '</label>' +
        (v.base_model ? '<span class="ver-base">' + escHtml(v.base_model) + '</span>' : '') +
        '</div>';
    });
    versHtml += '</div>';

    card.innerHTML =
      '<div class="lookup-info">' +
        '<h3>' + escHtml(d.name) + ' <span class="author">by ' + escHtml(d.author) + '</span></h3>' +
        '<div class="lookup-stats">' +
          '<span class="stars">' + stars + ' ' + rating.toFixed(1) + '</span>' +
          '<span>' + (d.stats.download_count || 0).toLocaleString() + ' downloads</span>' +
          '<span>' + escHtml(d.type) + '</span>' +
        '</div>' +
        '<div class="lookup-pills">' + tagsHtml + '</div>' +
        triggerHtml +
      '</div>' +
      imgsHtml +
      '<h4 style="margin:12px 0 8px;font-size:14px">Versions</h4>' +
      versHtml +
      '<div class="lookup-actions">' +
        '<button class="btn" id="lookupDownloadBtn" disabled>Download Selected</button>' +
        '<button class="btn btn--muted lookup-cancel">Cancel</button>' +
      '</div>';

    // Update download button on checkbox change
    card.querySelectorAll('input[type=checkbox]').forEach(function(cb) {
      cb.addEventListener('change', updateLookupDownloadBtn);
    });
    updateLookupDownloadBtn();
  }

  function updateLookupDownloadBtn() {
    var card = document.getElementById('lookupCard');
    var count = card.querySelectorAll('input[type=checkbox]:checked').length;
    var btn = document.getElementById('lookupDownloadBtn');
    if (!btn) return;
    btn.disabled = count === 0;
    btn.textContent = count > 0 ? 'Download ' + count + ' Version' + (count > 1 ? 's' : '') : 'Download Selected';
  }

  async function addSelectedVersions() {
    if (!lookupData) return;
    var card = document.getElementById('lookupCard');
    var checked = new Set();
    card.querySelectorAll('input[type=checkbox]:checked').forEach(function(cb) {
      checked.add(parseInt(cb.dataset.vid, 10));
    });
    if (checked.size === 0) return;

    var selected = lookupData.versions.filter(function(v) { return checked.has(v.version_id); });
    var btn = document.getElementById('lookupDownloadBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm"></span> Adding...';

    try {
      var resp = await apiFetch('/api/admin/loras/add-civitai', {
        method: 'POST',
        body: {
          model_id: lookupData.model_id,
          model_name: lookupData.name,
          author: lookupData.author,
          description: lookupData.description,
          tags: lookupData.tags,
          rating: lookupData.stats.rating,
          downloads: lookupData.stats.download_count,
          versions: selected,
          preview_images: lookupData.preview_images
        }
      });
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        showToast('Error: ' + (err.detail || 'Add failed'), 5000, 'error');
        btn.disabled = false;
        btn.textContent = 'Download Selected';
        return;
      }
      var result = await resp.json();
      closeLookup();
      showToast('Added ' + result.added.length + ' LoRA(s)' +
        (result.skipped.length ? ', ' + result.skipped.length + ' skipped (already in catalog)' : ''));
      initialLoad();
    } catch (e) {
      if (e.message !== 'auth') {
        showToast('Error: ' + e.message, 5000, 'error');
        btn.disabled = false;
        btn.textContent = 'Download Selected';
      }
    }
  }

  // Lookup event delegation
  document.getElementById('lookupCard').addEventListener('click', function(e) {
    var btn = e.target.closest('#lookupDownloadBtn');
    if (btn) { addSelectedVersions(); return; }
    if (e.target.classList.contains('lookup-cancel')) { closeLookup(); return; }
    var img = e.target.closest('.lookup-images img') || e.target.closest('.lookup-images video');
    if (img) { showLookupImage(img); }
  });

  document.getElementById('addLoraBtn').addEventListener('click', openLookup);
  document.getElementById('lookupClose').addEventListener('click', closeLookup);
  document.getElementById('lookupOverlay').addEventListener('click', function(e) { if (e.target === this) closeLookup(); });
  document.getElementById('lookupBtn').addEventListener('click', doLookup);

  // ── Image Modal (lookup preview enlargement) ──

  function showLookupImage(el) {
    var modal = document.getElementById('imgModal');
    var url = el.dataset.url;
    var isVideo = url.match(/\.(mp4|webm)(\?|$)/i) || el.tagName === 'VIDEO';
    var mediaEl = document.getElementById('imgModalImg');
    if (isVideo) {
      var vid = document.createElement('video');
      vid.id = 'imgModalImg'; vid.src = url; vid.controls = true; vid.autoplay = true;
      vid.style.cssText = mediaEl.style.cssText || 'max-width:60%;max-height:calc(100vh - 80px);border-radius:8px';
      mediaEl.replaceWith(vid);
    } else {
      if (mediaEl.tagName === 'VIDEO') {
        var img = document.createElement('img');
        img.id = 'imgModalImg'; img.src = url;
        img.style.cssText = 'max-width:60%;max-height:calc(100vh - 80px);object-fit:contain;border-radius:8px';
        mediaEl.replaceWith(img);
      } else {
        mediaEl.src = url;
      }
    }
    var meta = {};
    try { meta = JSON.parse(el.dataset.meta); } catch(ex) {}
    _lastRenderedMeta = meta;
    document.getElementById('imgModalMeta').innerHTML = renderMeta(meta);
    modal.style.display = 'flex';
  }

  var PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE_SVG = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  var EXPAND_SVG = '<svg viewBox="0 0 24 24"><path d="M21 11V3h-8l3.29 3.29-10 10L3 13v8h8l-3.29-3.29 10-10z"/></svg>';
  var COPY_SVG = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';

  function getGalleryFilters() {
    var mode = document.getElementById('galleryMode').value;
    var mid = galleryModelId, vid = galleryVersionId;
    var cap = document.getElementById('galleryCap').value;
    var useVersion = document.getElementById('galleryFilterVersion').checked;
    if (mode === 'rest') {
      return { mode: 'rest', modelId: mid, limit: cap, nsfw: document.getElementById('galleryNsfw').value,
        sort: document.getElementById('gallerySortRest').value, period: document.getElementById('galleryPeriodRest').value,
        version_id: useVersion ? vid : null };
    }
    return { mode: 'trpc', modelId: mid, limit: cap,
      sort: document.getElementById('gallerySortTrpc').value,
      period: document.getElementById('galleryPeriodTrpc').value,
      version_id: useVersion ? vid : null };
  }

  function getGalleryUrls() {
    var f = getGalleryFilters();
    var cardUrl = 'https://civitai.com/api/v1/models/' + f.modelId;
    var communityUrl;
    if (f.mode === 'rest') {
      communityUrl = 'https://civitai.com/api/v1/images?modelId=' + f.modelId +
        '&limit=' + f.limit + '&nsfw=' + f.nsfw +
        '&sort=' + encodeURIComponent(f.sort) + '&period=' + f.period;
      if (f.version_id) communityUrl += '&modelVersionId=' + f.version_id;
    } else {
      var inp = {modelVersionId: f.version_id || undefined, period: f.period,
        sort: f.sort, limit: parseInt(f.limit), pending: true, cursor: null};
      if (!f.version_id) inp.modelId = f.modelId;
      communityUrl = 'https://civitai.com/api/trpc/image.getInfinite?input=' +
        encodeURIComponent(JSON.stringify({json: inp, meta: {values: {cursor: ['undefined']}}}));
    }
    return { card: cardUrl, community: communityUrl };
  }

  function copyUrlFlash(btn, url) {
    navigator.clipboard.writeText(url);
    var flash = document.createElement('span');
    flash.className = 'copied-flash';
    flash.textContent = 'Copied';
    btn.parentNode.insertBefore(flash, btn.nextSibling);
    setTimeout(function() { flash.remove(); }, 3000);
  }

  function updateGalleryUrls() {
    if (!galleryModelId) return;
    var urls = getGalleryUrls();
    var el = document.getElementById('galleryUrls');
    el.innerHTML = '';
    ['Card', 'Community'].forEach(function(label) {
      var url = label === 'Card' ? urls.card : urls.community;
      var line = document.createElement('div');
      line.innerHTML = label + ': <code>' + url + '</code>';
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = COPY_SVG;
      btn.addEventListener('click', function() { copyUrlFlash(btn, url); });
      line.appendChild(btn);
      el.appendChild(line);
    });
  }

  function openGallery(modelId, versionId, name) {
    galleryModelId = modelId;
    galleryVersionId = versionId;
    galleryImages = [];
    galleryImageIds = new Set();
    galleryDownloading = false;
    galleryPlayingVideo = null;

    document.getElementById('galleryOverlay').style.display = 'flex';
    document.getElementById('galleryTitle').textContent = name;
    document.getElementById('galleryCount').textContent = '';
    document.getElementById('galleryProgress').style.display = 'none';
    document.getElementById('galleryDlBtn').textContent = 'Download';
    document.getElementById('galleryDlBtn').disabled = false;
    document.getElementById('galleryDeleteBtn').disabled = false;
    document.getElementById('galleryGrid').innerHTML = '<div class="gallery-empty"><span class="spinner sm" style="vertical-align:middle;margin-right:8px"></span>Loading...</div>';
    document.getElementById('gallerySearch').value = '';
    updateGalleryUrls();
    pollGallery();
  }

  function closeGallery() {
    document.getElementById('galleryOverlay').style.display = 'none';
    if (galleryPollTimer) { clearInterval(galleryPollTimer); galleryPollTimer = null; }
    galleryModelId = null;
    galleryVersionId = null;
    galleryPlayingVideo = null;
  }

  async function toggleGalleryDl() {
    if (!galleryModelId) return;
    var btn = document.getElementById('galleryDlBtn');
    var delBtn = document.getElementById('galleryDeleteBtn');

    if (galleryDownloading) {
      btn.disabled = true; btn.textContent = 'Stopping...';
      try { await apiFetch('/api/admin/loras/' + galleryModelId + '/gallery', { method: 'POST', body: { action: 'stop' } }); } catch(ex) {}
      return;
    }

    btn.textContent = 'Stop';
    delBtn.disabled = true;
    galleryDownloading = true;
    var progress = document.getElementById('galleryProgress');
    var progressFill = document.getElementById('galleryProgressFill');
    progress.style.display = '';
    progressFill.classList.add('indeterminate');
    document.getElementById('galleryProgressText').textContent = 'Starting download...';
    galleryDlStartTime = Date.now();
    galleryLastDone = 0;

    try {
      var resp = await apiFetch('/api/admin/loras/' + galleryModelId + '/gallery', {
        method: 'POST', body: Object.assign({
          action: 'start:' + document.getElementById('galleryCap').value
        }, getGalleryFilters())
      });
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        showToast('Error: ' + (err.detail || 'Failed'), 5000, 'error');
        btn.textContent = 'Download'; delBtn.disabled = false; galleryDownloading = false;
        progress.style.display = 'none'; progressFill.classList.remove('indeterminate');
        return;
      }
      if (!galleryPollTimer) galleryPollTimer = setInterval(pollGallery, 2000);
    } catch(e) {
      if (e.message !== 'auth') showToast('Error: ' + e.message, 5000, 'error');
      btn.textContent = 'Download'; delBtn.disabled = false; galleryDownloading = false;
      progress.style.display = 'none'; progressFill.classList.remove('indeterminate');
    }
  }

  async function pollGallery() {
    if (!galleryModelId) return;
    try {
      var resp = await apiFetch('/api/admin/loras/' + galleryModelId + '/gallery');
      if (!resp.ok) return;
      var data = await resp.json();

      var status = data.status;
      var btn = document.getElementById('galleryDlBtn');
      var delBtn = document.getElementById('galleryDeleteBtn');
      var progress = document.getElementById('galleryProgress');
      var progressFill = document.getElementById('galleryProgressFill');
      var progressText = document.getElementById('galleryProgressText');

      if (status === 'downloading') {
        btn.textContent = 'Stop'; btn.disabled = false; delBtn.disabled = true;
        galleryDownloading = true; progress.style.display = '';
        var total = data.total || 0, done = (data.downloaded || 0) + (data.skipped || 0);
        if (done > 0) {
          progressFill.classList.remove('indeterminate');
          progressFill.style.width = Math.min(total > 0 ? Math.round(done / total * 100) : 0, 100) + '%';
        }
        var dlText = 'Downloaded ' + (data.downloaded || 0) + (total > 0 ? ' / ' + total : '') + ' (' + (data.skipped || 0) + ' skipped)';
        var elapsed = (Date.now() - galleryDlStartTime) / 1000;
        if (done > 0 && elapsed > 3) {
          var rate = (done / elapsed * 60).toFixed(1);
          dlText += ' — ' + rate + '/min';
          if (total > done) {
            var remaining = Math.round((total - done) / (done / elapsed));
            var mins = Math.floor(remaining / 60);
            var secs = remaining % 60;
            dlText += ', ~' + (mins > 0 ? mins + 'm ' : '') + secs + 's left';
          }
        }
        progressText.innerHTML = '<span class="spinner sm" style="vertical-align:middle;margin-right:6px"></span>' + dlText;
      } else if (status === 'stopping') {
        btn.textContent = 'Stopping...'; btn.disabled = true;
      } else {
        btn.textContent = 'Download'; btn.disabled = false; delBtn.disabled = false;
        galleryDownloading = false; progressFill.classList.remove('indeterminate');
        if (status === 'done' || status === 'stopped') {
          var elapsed = Math.round((Date.now() - galleryDlStartTime) / 1000);
          var timeStr = elapsed >= 60 ? Math.floor(elapsed/60) + 'min ' + (elapsed%60) + 's' : elapsed + 's';
          progress.style.display = '';
          progressFill.style.width = '100%';
          progressText.textContent = (status === 'done' ? 'Completed' : 'Stopped') + ' in ' + timeStr;
          setTimeout(function() { progress.style.display = 'none'; }, 5000);
        } else {
          progress.style.display = 'none';
        }
        if (galleryPollTimer) { clearInterval(galleryPollTimer); galleryPollTimer = null; }
      }

      // Build deduplicated lists
      function mapImg(img, type, source, prefix) {
        var m = img.meta || {};
        m._item_id = img.id;
        return {
          id: img.id, type: type, ext: img.ext || '.jpeg', meta: m,
          source: source, key: prefix + img.id,
          civitai_id: m.civitai_id || img.id,
          createdAt: img.createdAt || m.createdAt || '',
          username: m.username || '',
          has_thumb: img.has_thumb || false
        };
      }
      var card = (data.gallery_card || []).map(function(img) { return mapImg(img, 'gallery-card', 'card', 'card-'); });
      var community = (data.gallery_community || []).filter(function(img) {
        return !card.some(function(c) { return c.id === img.id; });
      }).map(function(img) { return mapImg(img, 'gallery-community', 'community', 'comm-'); });
      var all = card.concat(community);

      // Incremental append — only add new items
      var newItems = all.filter(function(img) { return !galleryImageIds.has(img.key); });
      if (newItems.length > 0) {
        newItems.forEach(function(img) { galleryImageIds.add(img.key); galleryImages.push(img); });
        appendNewThumbs(newItems);
      }

      function fmtSize(bytes) {
        if (!bytes) return '';
        if (bytes >= 100 * 1024 * 1024) return (bytes / (1024*1024*1024)).toFixed(1) + ' GB';
        return (bytes / (1024*1024)).toFixed(0) + ' MB';
      }
      var totalBytes = (data.gallery_card_bytes || 0) + (data.gallery_community_bytes || 0);
      var sizeStr = totalBytes ? ' (' + fmtSize(totalBytes) + ')' : '';
      document.getElementById('galleryCount').textContent = card.length + ' card + ' + community.length + ' community' + sizeStr;
      // Replace spinner with empty message if truly empty
      if (all.length === 0 && status !== 'downloading') {
        document.getElementById('galleryGrid').innerHTML = '<div class="gallery-empty">No images yet. Click Download to fetch from CivitAI.</div>';
      }
    } catch(e) {
      if (e.message !== 'auth') console.error('Gallery poll error:', e);
    }
  }

  function toggleVideoPlay(thumb) {
    var videoSrc = thumb.dataset.videoSrc;
    if (!videoSrc) return;
    var video = thumb.querySelector('video');
    var overlay = thumb.querySelector('.play-overlay');

    if (video) {
      // Already playing — stop and swap back to image
      stopVideoThumb(thumb);
      return;
    }

    // Stop any other playing video first
    if (galleryPlayingVideo && galleryPlayingVideo !== thumb) {
      stopVideoThumb(galleryPlayingVideo);
    }

    // Swap image to video
    var img = thumb.querySelector('.thumb-img');
    var v = document.createElement('video');
    v.src = videoSrc; v.muted = true; v.loop = true; v.playsInline = true;
    v.style.cssText = 'width:150px;height:150px;object-fit:cover;display:block;border-radius:4px';
    v.autoplay = true;
    if (img) img.replaceWith(v);
    thumb.classList.add('playing');
    if (overlay) overlay.innerHTML = PAUSE_SVG;
    galleryPlayingVideo = thumb;
  }

  function stopVideoThumb(thumb) {
    var video = thumb.querySelector('video');
    if (!video) return;
    video.pause();
    // Swap video back to thumbnail image smoothly
    var img = document.createElement('img');
    img.className = 'thumb-img';
    img.src = thumb.dataset.thumbSrc || '';
    video.replaceWith(img);
    thumb.classList.remove('playing');
    var overlay = thumb.querySelector('.play-overlay');
    if (overlay) overlay.innerHTML = PLAY_SVG;
    if (galleryPlayingVideo === thumb) galleryPlayingVideo = null;
  }

  function makeThumb(img) {
    var ext = img.ext || '.jpeg';
    var src = '/api/admin/loras/images/' + galleryModelId + '/' + img.type + '/' + img.id + ext;
    var thumb = document.createElement('div');
    thumb.className = 'gallery-thumb';
    thumb.dataset.key = img.key;

    // Expand button (top-right) → detail view
    var expandBtn = document.createElement('button');
    expandBtn.className = 'expand-btn';
    expandBtn.innerHTML = EXPAND_SVG;
    expandBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      openDetail(galleryImages.indexOf(img));
    });

    if (ext === '.mp4') {
      var thumbUrl = img.has_thumb
        ? '/api/admin/loras/images/' + galleryModelId + '/' + img.type + '/' + img.id + '.thumb.jpg'
        : '';
      thumb.dataset.videoSrc = src;
      thumb.dataset.thumbSrc = thumbUrl;
      if (thumbUrl) {
        thumb.innerHTML = '<img class="thumb-img" src="' + thumbUrl + '" loading="lazy"><div class="play-overlay">' + PLAY_SVG + '</div>';
      } else {
        thumb.innerHTML = '<div class="thumb-img" style="background:var(--bg)"></div><div class="play-overlay">' + PLAY_SVG + '</div>';
      }
      thumb.appendChild(expandBtn);
      thumb.addEventListener('click', function(e) { if (e.target.closest('.expand-btn')) return; toggleVideoPlay(thumb); });
    } else {
      thumb.innerHTML = '<img class="thumb-img" src="' + src + '" loading="lazy">';
      thumb.appendChild(expandBtn);
      thumb.addEventListener('click', function(e) { if (e.target.closest('.expand-btn')) return; openDetail(galleryImages.indexOf(img)); });
    }
    var idx = galleryImages.indexOf(img) + 1;
    var badge = document.createElement('span');
    badge.className = 'thumb-idx';
    badge.textContent = idx;
    thumb.appendChild(badge);
    return thumb;
  }

  function getOrCreateSection(source) {
    var grid = document.getElementById('galleryGrid');
    var sectionId = 'gallerySection-' + source;
    var section = document.getElementById(sectionId);
    if (section) return section;

    // Remove empty message if present
    var empty = grid.querySelector('.gallery-empty');
    if (empty) empty.remove();

    // Ensure card section comes before community, with HR between
    var cardSection = document.getElementById('gallerySection-card');
    var commSection = document.getElementById('gallerySection-community');

    var lbl = document.createElement('div');
    lbl.className = 'gallery-section-label';
    lbl.id = 'galleryLabel-' + source;
    lbl.textContent = source === 'card' ? 'Model Card' : 'Community';

    section = document.createElement('div');
    section.className = 'gallery-section';
    section.id = sectionId;

    if (source === 'card') {
      // Card always first
      grid.insertBefore(section, grid.firstChild);
      grid.insertBefore(lbl, grid.firstChild);
    } else {
      // Community: add HR if card exists, then append
      if (cardSection) {
        var hr = document.createElement('hr');
        hr.className = 'gallery-hr';
        hr.id = 'galleryHr';
        if (!document.getElementById('galleryHr')) grid.appendChild(hr);
      }
      grid.appendChild(lbl);
      grid.appendChild(section);
    }
    return section;
  }

  function appendNewThumbs(newItems) {
    newItems.forEach(function(img) {
      var section = getOrCreateSection(img.source);
      section.appendChild(makeThumb(img));
      // Update label count
      var lbl = document.getElementById('galleryLabel-' + img.source);
      var count = section.children.length;
      lbl.textContent = (img.source === 'card' ? 'Model Card' : 'Community') + ' (' + count + ')';
    });
  }

  // Gallery button handlers
  document.getElementById('galleryClose').addEventListener('click', closeGallery);
  document.getElementById('galleryOverlay').addEventListener('click', function(e) { if (e.target === this) closeGallery(); });
  document.getElementById('galleryDlBtn').addEventListener('click', toggleGalleryDl);
  document.getElementById('galleryDeleteBtn').addEventListener('click', async function() {
    if (!galleryModelId) return;
    if (!await studioConfirm('Delete all gallery images?', {danger: true, yes: 'Delete All'})) return;
    try {
      var resp = await apiFetch('/api/admin/loras/' + galleryModelId + '/gallery', { method: 'DELETE' });
      if (resp.ok) {
        var d = await resp.json();
        showToast('Deleted ' + d.deleted + ' images');
        galleryImages = []; galleryImageIds = new Set();
        document.getElementById('galleryGrid').innerHTML = '<div class="gallery-empty">No images yet. Click Download to fetch from CivitAI.</div>';
        document.getElementById('galleryProgress').style.display = 'none';
        document.getElementById('galleryCount').textContent = '';
      }
    } catch(e) { if (e.message !== 'auth') showToast('Error: ' + e.message, 5000, 'error'); }
  });
  function toggleFilterMode() {
    var mode = document.getElementById('galleryMode').value;
    document.getElementById('filtersRest').style.display = mode === 'rest' ? 'contents' : 'none';
    document.getElementById('filtersTrpc').style.display = mode === 'trpc' ? 'contents' : 'none';
    updateGalleryUrls();
  }
  document.getElementById('galleryMode').addEventListener('change', toggleFilterMode);
  ['galleryNsfw', 'gallerySortRest', 'galleryPeriodRest', 'gallerySortTrpc', 'galleryPeriodTrpc',
   'galleryCap', 'galleryFilterVersion'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', updateGalleryUrls);
  });
  document.getElementById('gallerySearch').addEventListener('input', function() {
    var q = this.value.trim();
    document.querySelectorAll('#galleryGrid .gallery-thumb').forEach(function(thumb) {
      var id = thumb.dataset.key.replace(/^(card|comm)-/, '');
      thumb.style.display = (!q || id.indexOf(q) !== -1) ? '' : 'none';
    });
  });

  // ── Detail View ──

  var detailIdx = -1;

  function openDetail(idx) {
    detailIdx = idx;
    var img = galleryImages[idx];
    if (!img) return;
    var ext = img.ext || '.jpeg';
    var src = '/api/admin/loras/images/' + galleryModelId + '/' + img.type + '/' + img.id + ext;

    document.getElementById('detailOverlay').style.display = 'flex';
    var container = document.querySelector('.detail-image');
    var isVideo = ext === '.mp4';
    if (isVideo) {
      container.innerHTML = '<video id="detailImg" src="' + src + '" controls autoplay style="max-width:100%;max-height:calc(100vh - 80px);border-radius:8px"></video>';
    } else {
      container.innerHTML = '<img id="detailImg" src="' + src + '" style="max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;border-radius:8px">';
    }
    _lastRenderedMeta = img.meta;
    document.getElementById('detailMeta').innerHTML = renderMeta(img.meta);
    document.getElementById('detailPrev').style.display = idx > 0 ? '' : 'none';
    document.getElementById('detailNext').style.display = idx < galleryImages.length - 1 ? '' : 'none';
  }

  function closeDetail() {
    document.getElementById('detailOverlay').style.display = 'none';
    detailIdx = -1;
  }

  function navDetail(dir) {
    var newIdx = detailIdx + dir;
    if (newIdx >= 0 && newIdx < galleryImages.length) openDetail(newIdx);
  }

  document.getElementById('detailClose').addEventListener('click', closeDetail);
  document.getElementById('detailPrev').addEventListener('click', function() { navDetail(-1); });
  document.getElementById('detailNext').addEventListener('click', function() { navDetail(1); });
  document.getElementById('detailOverlay').addEventListener('click', function(e) { if (e.target === this) closeDetail(); });

  // ── Keyboard navigation ──

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('detailsMetaOverlay').style.display !== 'none') { document.getElementById('detailsMetaOverlay').style.display = 'none'; return; }
      if (document.getElementById('imgModal').style.display !== 'none') { closeImgModal(); return; }
      if (document.getElementById('detailOverlay').style.display !== 'none') { closeDetail(); return; }
      if (document.getElementById('galleryOverlay').style.display !== 'none') { closeGallery(); return; }
      if (document.getElementById('lookupOverlay').style.display !== 'none') { closeLookup(); return; }
    }
    if (document.getElementById('detailOverlay').style.display !== 'none') {
      if (e.key === 'ArrowLeft') navDetail(-1);
      if (e.key === 'ArrowRight') navDetail(1);
    }
  });

  // ── Boot ──
  initialLoad();

})();
</script>
</body>
</html>
