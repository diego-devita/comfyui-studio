  // ── LoRA Dynamic Picker (all LoRAs, grouped by base_model) ──
  function buildLoraDynamicPicker(inputId, input) {
    var container = document.createElement('div');
    container.className = 'lora-picker';
    container.dataset.inputId = inputId;
    container.innerHTML = '<div style="color:var(--muted);font-size:12px;">Loading LoRAs...</div>';

    var allModels = null;
    var currentBase = input.base_model || manifest.base_model || '';

    Promise.all([
      apiFetch('/api/admin/models').then(function(r) { return r.json(); }),
      apiFetch('/api/admin/loras').then(function(r) { return r.json(); })
    ]).then(function(results) {
      allModels = results[0];
      var lorasData = results[1];
      // Merge: from models take only "loras" category, from loras take all categories
      var merged = [];
      (allModels.categories || []).forEach(function(cat) {
        if (cat.id === 'loras') merged.push(cat);
      });
      (lorasData.categories || []).forEach(function(cat) {
        merged.push(cat);
      });
      allModels = {categories: merged};
      rebuildPicker();
    });

    function baseMatches(loraBase) {
      if (!currentBase) return true; // no checkpoint selected = all compatible
      if (!loraBase) return true; // no base info on lora = assume compatible
      var cb = currentBase.toLowerCase().replace(/[^a-z0-9]/g, '');
      var lb = loraBase.toLowerCase().replace(/[^a-z0-9]/g, '');
      // Direct match or one contains the other
      if (cb === lb) return true;
      if (cb.indexOf(lb) >= 0 || lb.indexOf(cb) >= 0) return true;
      // Known compatible families
      var families = [['sdxl', 'pony', 'illustrious'], ['sd15', 'sd1']];
      for (var i = 0; i < families.length; i++) {
        var inCb = families[i].some(function(f) { return cb.indexOf(f) >= 0; });
        var inLb = families[i].some(function(f) { return lb.indexOf(f) >= 0; });
        if (inCb && inLb) return true;
      }
      return false;
    }

    function rebuildPicker() {
      container.innerHTML = '';
      if (!allModels) return;

      // Collect all present LoRAs grouped by base_model — dedupe by file
      var seen = {};
      var groups = {};
      (allModels.categories || []).forEach(function(cat) {
        (cat.models || []).forEach(function(m) {
          if (m.status !== 'present') return;
          if (seen[m.file]) return;
          seen[m.file] = true;
          var mb = m.civitai_base_model || m.base_model || 'Other';
          if (!groups[mb]) groups[mb] = [];
          groups[mb].push(m);
        });
      });

      if (Object.keys(groups).length === 0) {
        container.innerHTML = '<div style="color:var(--muted);font-size:12px;">No LoRAs installed</div>';
        return;
      }

      // Sort: matching group first, then alphabetical
      var sortedBases = Object.keys(groups).sort(function(a, b) {
        var am = baseMatches(a) ? 0 : 1;
        var bm = baseMatches(b) ? 0 : 1;
        if (am !== bm) return am - bm;
        return a.localeCompare(b);
      });

      // Show all checkbox
      var showAllWrap = document.createElement('label');
      showAllWrap.style.cssText = 'display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;margin-bottom:4px;';
      var showAllCb = document.createElement('input');
      showAllCb.type = 'checkbox';
      showAllCb.style.cssText = 'accent-color:var(--accent);';
      showAllWrap.appendChild(showAllCb);
      showAllWrap.appendChild(document.createTextNode('Show all LoRAs'));
      container.appendChild(showAllWrap);

      var slotsDiv = document.createElement('div');
      slotsDiv.style.cssText = 'display:flex;flex-direction:column;gap:8px;';
      container.appendChild(slotsDiv);

      // Store removed optgroups so we can re-add them
      var _removedGroups = new Map(); // sel element -> [{og, nextSibling}]

      function filterOptgroups() {
        // If no checkpoint selected, show all and hide checkbox
        if (!currentBase) {
          showAllWrap.style.display = 'none';
          // Re-add any removed optgroups
          _removedGroups.forEach(function(removed, sel) {
            removed.forEach(function(r) { sel.insertBefore(r.og, r.nextSibling); });
          });
          _removedGroups.clear();
          return;
        }
        showAllWrap.style.display = 'flex';
        container.querySelectorAll('.lora-dyn-select').forEach(function(sel) {
          // First re-add any previously removed
          var prev = _removedGroups.get(sel) || [];
          prev.forEach(function(r) { sel.insertBefore(r.og, r.nextSibling); });
          _removedGroups.delete(sel);

          if (!showAllCb.checked) {
            var toRemove = [];
            sel.querySelectorAll('optgroup').forEach(function(og) {
              if (og.dataset.compatible !== '1') {
                toRemove.push({og: og, nextSibling: og.nextSibling});
              }
            });
            toRemove.forEach(function(r) { sel.removeChild(r.og); });
            if (toRemove.length > 0) _removedGroups.set(sel, toRemove);
          }
        });
      }

      showAllCb.onchange = filterOptgroups;

      function addSlot() {
        var slot = document.createElement('div');
        slot.className = 'lora-dyn-slot';
        slot.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;';

        var sel = document.createElement('select');
        sel.className = 'lora-dyn-select';
        sel.style.cssText = 'flex:1;min-width:200px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--mono);font-size:12px;';
        sel.innerHTML = '<option value="">\u2014 None \u2014</option>';

        sortedBases.forEach(function(groupBase) {
          var compatible = currentBase ? baseMatches(groupBase) : true;
          var label = groupBase;
          if (currentBase && compatible) label += ' \u2713';
          var optgroup = document.createElement('optgroup');
          optgroup.label = label;
          optgroup.dataset.compatible = compatible ? '1' : '0';
          groups[groupBase].forEach(function(m) {
            var o = document.createElement('option');
            o.value = m.file;
            o.textContent = m.name;
            o.dataset.loraBase = m.civitai_base_model || m.base_model || '';
            optgroup.appendChild(o);
          });
          sel.appendChild(optgroup);
        });

        slot.appendChild(sel);

        var strLabel = document.createElement('span');
        strLabel.style.cssText = 'font-family:var(--mono);font-size:10px;color:var(--muted);';
        strLabel.textContent = 'str:';
        slot.appendChild(strLabel);

        var strSlider = document.createElement('input');
        strSlider.type = 'range';
        strSlider.className = 'lora-dyn-strength';
        strSlider.min = '0'; strSlider.max = '2'; strSlider.step = '0.05'; strSlider.value = '1';
        strSlider.style.cssText = 'width:70px;accent-color:var(--accent);';
        slot.appendChild(strSlider);

        var strVal = document.createElement('span');
        strVal.style.cssText = 'font-family:var(--mono);font-size:10px;color:var(--text);min-width:24px;';
        strVal.textContent = '1.0';
        strSlider.oninput = function() { strVal.textContent = parseFloat(strSlider.value).toFixed(2); };
        slot.appendChild(strVal);

        var rmBtn = document.createElement('button');
        rmBtn.type = 'button';
        rmBtn.style.cssText = 'background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;';
        rmBtn.innerHTML = '&times;';
        rmBtn.onclick = function() { slot.remove(); };
        slot.appendChild(rmBtn);

        // Warning for mismatched base_model
        var warn = document.createElement('div');
        warn.style.cssText = 'display:none;width:100%;font-size:11px;color:#ffaa33;padding:2px 0;';
        warn.textContent = 'This LoRA may not be compatible with the selected checkpoint';
        slot.appendChild(warn);

        sel.addEventListener('change', function() {
          var opt = sel.options[sel.selectedIndex];
          if (opt && opt.value && opt.dataset.loraBase) {
            warn.style.display = baseMatches(opt.dataset.loraBase) ? 'none' : 'block';
          } else {
            warn.style.display = 'none';
          }
        });

        slotsDiv.appendChild(slot);
      }

      var addBtn = document.createElement('button');
      addBtn.className = 'scene-add-btn';
      addBtn.type = 'button';
      addBtn.textContent = '+ Add LoRA';
      addBtn.onclick = addSlot;
      container.appendChild(addBtn);

      // Check for prefill data
      var prefillRaw = container.dataset.prefillLoras;
      if (prefillRaw) {
        try {
          var prefillLoras = JSON.parse(prefillRaw);
          prefillLoras.forEach(function(lora) {
            addSlot();
            var slots = slotsDiv.querySelectorAll('.lora-dyn-slot');
            var lastSlot = slots[slots.length - 1];
            if (lastSlot) {
              var sel = lastSlot.querySelector('.lora-dyn-select');
              if (sel) {
                sel.value = lora.file || '';
                sel.dispatchEvent(new Event('change'));
              }
              var str = lastSlot.querySelector('.lora-dyn-strength');
              if (str && lora.strength != null) {
                str.value = lora.strength;
                str.dispatchEvent(new Event('input'));
              }
            }
          });
          delete container.dataset.prefillLoras;
        } catch(e) { console.warn('LoRA dynamic prefill error', e); }
      } else {
        addSlot();
      }
      filterOptgroups();
    }

    document.addEventListener('checkpoint-changed', function(e) {
      currentBase = e.detail.baseModel || '';
      _removedGroups.clear();
      rebuildPicker();
    });

    return container;
  }

  function getLoraDynamicValue(inputId) {
    var container = document.querySelector('[data-input-id="' + inputId + '"]');
    if (!container) return [];
    var result = [];
    container.querySelectorAll('.lora-dyn-slot').forEach(function(slot) {
      var sel = slot.querySelector('.lora-dyn-select');
      var str = slot.querySelector('.lora-dyn-strength');
      if (sel && sel.value) {
        result.push({file: sel.value, strength: parseFloat(str ? str.value : 1)});
      }
    });
    return result;
  }

  // ── Resolution Picker ──
  function buildResolutionPicker(inputId, input) {
    var container = document.createElement('div');
    container.dataset.inputId = inputId;
    container.style.cssText = 'display:flex;gap:8px;align-items:center;';

    var presets = input.presets || {};
    var defaultRes = input.default || {w: 1024, h: 1024};

    var presetSel = document.createElement('select');
    presetSel.className = 'form-input';
    presetSel.style.cssText = 'flex:1;';

    function populatePresets(baseModel) {
      presetSel.innerHTML = '';
      var key = '';
      var bm = (baseModel || '').toLowerCase();
      if (bm.indexOf('pony') >= 0) key = 'pony';
      else if (bm.indexOf('illustrious') >= 0) key = presets['illustrious'] ? 'illustrious' : 'sdxl';
      else if (bm.indexOf('sdxl') >= 0) key = 'sdxl';
      else if (bm.indexOf('sd 1') >= 0 || bm.indexOf('sd1') >= 0) key = 'sd15';
      else if (bm.indexOf('flux') >= 0) key = 'flux';
      else key = 'sdxl';

      var list = presets[key] || [{label: defaultRes.w + 'x' + defaultRes.h, w: defaultRes.w, h: defaultRes.h}];
      list.forEach(function(p) {
        var o = document.createElement('option');
        o.value = p.w + 'x' + p.h;
        o.textContent = p.label;
        o.dataset.w = p.w;
        o.dataset.h = p.h;
        presetSel.appendChild(o);
      });
      // Custom option
      var custom = document.createElement('option');
      custom.value = 'custom';
      custom.textContent = 'Custom...';
      presetSel.appendChild(custom);
    }

    var wInput = document.createElement('input');
    wInput.type = 'number';
    wInput.className = 'form-input';
    wInput.style.cssText = 'width:80px;display:none;';
    wInput.placeholder = 'W';
    wInput.value = defaultRes.w;

    var hInput = document.createElement('input');
    hInput.type = 'number';
    hInput.className = 'form-input';
    hInput.style.cssText = 'width:80px;display:none;';
    hInput.placeholder = 'H';
    hInput.value = defaultRes.h;

    presetSel.addEventListener('change', function() {
      if (presetSel.value === 'custom') {
        wInput.style.display = '';
        hInput.style.display = '';
      } else {
        wInput.style.display = 'none';
        hInput.style.display = 'none';
        var opt = presetSel.options[presetSel.selectedIndex];
        wInput.value = opt.dataset.w;
        hInput.value = opt.dataset.h;
      }
    });

    document.addEventListener('checkpoint-changed', function(e) {
      populatePresets(e.detail.baseModel);
    });

    populatePresets('');

    container.appendChild(presetSel);
    container.appendChild(wInput);
    container.appendChild(hInput);
    return container;
  }

  function getResolutionValue(inputId) {
    var container = document.querySelector('[data-input-id="' + inputId + '"]');
    if (!container) return {w: 1024, h: 1024};
    var w = container.querySelector('input[placeholder="W"]');
    var h = container.querySelector('input[placeholder="H"]');
    return {w: parseInt(w ? w.value : 1024), h: parseInt(h ? h.value : 1024)};
  }

  // ── Re-run / Import prefill ──
  function applyRerunData() {
    var hash = window.location.hash;
    if (!hash || hash.indexOf('#rerun=') !== 0) return;
    var encoded = hash.substring(7);
    try {
      var json = decodeURIComponent(escape(atob(encoded)));
      var data = JSON.parse(json);
    } catch (e) {
      console.warn('Failed to parse rerun data:', e);
      return;
    }
    history.replaceState(null, '', window.location.pathname);
    prefillForm(data);
    document.getElementById('rerunBanner').style.display = 'block';
  }

  function prefillForm(data) {
    var params = data.params || {};
    // Flatten grouped inputs to flat list
    var flatInputs = [];
    (manifest.inputs || []).forEach(function(inp) {
      if (inp.items) {
        inp.items.forEach(function(item) { flatInputs.push(item); });
      } else {
        flatInputs.push(inp);
      }
    });
    flatInputs.forEach(function(inp) {
      var id = inp.id;
      var type = (inp.type || 'text').toLowerCase();
      var val = params[id];
      if (type === 'image') {
        prefillImage(id, data.input_image);
      } else if (type === 'scene_list') {
        prefillSceneList(id, inp, val, data);
      } else if (type === 'lora_picker' || type === 'lora_picker_dynamic') {
        prefillLoraPicker(id, val);
      } else if (val != null) {
        prefillSimpleInput(id, type, val);
      }
    });
  }

  function prefillImage(inputId, filename) {
    if (!filename) return;
    existingImages[inputId] = filename;
    $formPanel.querySelectorAll('.dropzone').forEach(function(zone) {
      var fi = zone.querySelector('input[data-input-id="' + inputId + '"]');
      if (!fi) return;
      var preview = zone.querySelector('.dropzone-preview');
      var fnameEl = zone.querySelector('.dropzone-filename');
      var viewUrl = '/api/comfyui/view?filename=' + encodeURIComponent(filename) + '&type=input';
      if (preview) { preview.src = viewUrl; preview.classList.add('visible'); }
      if (fnameEl) { fnameEl.textContent = filename + ' (existing)'; fnameEl.classList.add('visible'); }
    });
  }

  function prefillSceneList(inputId, input, scenes, data) {
    if (!scenes || !Array.isArray(scenes) || scenes.length === 0) return;
    var container = document.querySelector('[data-input-id="' + inputId + '"]');
    if (!container || !container.addScene) return;
    container.querySelectorAll('.scene-card').forEach(function(c) { c.remove(); });
    scenes.forEach(function(s, i) {
      var seed = s.seed;
      // Use resolved seed from job.seeds if available
      if (data && data.params && data.params.scenes) {
        // seeds already merged by rerunJob
      }
      container.addScene(s.prompt || '', s.duration || 5, seed != null ? seed : -1);
    });
    container.renumber();
  }

  function prefillLoraPicker(inputId, loras) {
    if (!loras || !Array.isArray(loras) || loras.length === 0) return;
    var container = document.querySelector('[data-input-id="' + inputId + '"]');
    if (!container) return;
    container.dataset.prefillLoras = JSON.stringify(loras);
  }

  function prefillSimpleInput(id, type, val) {
    var el = $formPanel.querySelector('[data-input-id="' + id + '"]');
    if (!el) return;
    el.value = val;
    if (el.type === 'range') {
      el.dispatchEvent(new Event('input'));
    }
    // For selects (checkpoint_picker, etc.): options may load async. Retry.
    if (el.tagName === 'SELECT' && el.value !== String(val)) {
      var attempts = 0;
      var retryInterval = setInterval(function() {
        el.value = val;
        el.dispatchEvent(new Event('change'));
        attempts++;
        if (el.value === String(val) || attempts > 20) clearInterval(retryInterval);
      }, 500);
    } else {
      el.dispatchEvent(new Event('change'));
    }
  }

  // ── IO target + status ──
  var $ioTarget = document.getElementById('ioTarget');
  var $ioStatus = document.getElementById('ioStatus');
  function flashStatus(msg) {
    $ioStatus.textContent = msg;
    $ioStatus.style.opacity = '1';
    setTimeout(function() { $ioStatus.style.opacity = '0'; }, 2000);
  }

  function importJobData(jsonStr) {
    try {
      var job = JSON.parse(jsonStr);
      var data = {params: job.params || {}, input_image: job.input_image || null};
      if (job.seeds) {
        if (data.params.scenes && Array.isArray(data.params.scenes)) {
          data.params.scenes.forEach(function(s, i) {
            var key = 'scene_' + (i + 1);
            if (job.seeds[key] != null) s.seed = job.seeds[key];
          });
        }
        for (var sid in job.seeds) {
          if (/^scene_\d+$/.test(sid)) continue;
          data.params[sid] = job.seeds[sid];
        }
      }
      prefillForm(data);
      document.getElementById('rerunBanner').style.display = 'block';
      flashStatus('Imported');
    } catch (err) {
      showToast('Invalid JSON: ' + err.message, 5000, 'error');
    }
  }

  // Import button
  document.getElementById('importBtn').addEventListener('click', async function() {
    if ($ioTarget.value === 'clipboard') {
      try {
        var text = await navigator.clipboard.readText();
        importJobData(text);
      } catch(err) {
        showToast('Clipboard read failed: ' + err.message, 5000, 'error');
      }
    } else {
      document.getElementById('importJsonInput').click();
    }
  });

  // File import fallback
  document.getElementById('importJsonInput').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) { importJobData(ev.target.result); };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ── Export dropdown ──
  var $exportBtn = document.getElementById('exportBtn');
  var $exportMenu = document.getElementById('exportMenu');

  $exportBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    $exportMenu.style.display = $exportMenu.style.display === 'none' ? '' : 'none';
  });
  document.addEventListener('click', function() { $exportMenu.style.display = 'none'; });

  function outputJson(data, filename) {
    var jsonStr = JSON.stringify(data, null, 2);
    if ($ioTarget.value === 'clipboard') {
      copyToClipboard(jsonStr);
      flashStatus('Copied');
    } else {
      var blob = new Blob([jsonStr], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
      flashStatus('Downloaded');
    }
  }

  function gatherCurrentParams() {
    var params = {};
    $formPanel.querySelectorAll('[data-input-id]').forEach(function(el) {
      var id = el.dataset.inputId;
      if (el.type === 'file') return;
      if (el.classList.contains('scene-list')) { params[id] = getSceneListValue(id); }
      else if (el.classList.contains('lora-picker')) {
        params[id] = el.querySelector('.lora-dyn-slot') ? getLoraDynamicValue(id) : getLoraPickerValue(id);
      } else if (el.type === 'range') { params[id] = parseFloat(el.value); }
      else if (el.type === 'number') { params[id] = el.value ? Number(el.value) : null; }
      else { params[id] = el.value; }
    });
    return params;
  }

  async function exportBuild(format) {
    var params = gatherCurrentParams();
    for (var eid in existingImages) {
      var pk = eid === 'image' ? '_existing_input_image' : '_existing_' + eid;
      params[pk] = existingImages[eid];
    }
    var formData = new FormData();
    formData.append('params', JSON.stringify(params));
    for (var fid in inputFiles) {
      if (!existingImages[fid]) {
        formData.append(fid === 'image' ? 'input_image' : fid, inputFiles[fid]);
      }
    }
    try {
      var resp = await apiFetch('/api/run/' + encodeURIComponent(workflowId) + '/build?format=' + format, {
        method: 'POST', body: formData
      });
      if (!resp.ok) {
        var err = await resp.json().catch(function() { return {}; });
        showToast('Export error: ' + (err.detail || resp.status), 5000, 'error');
        return;
      }
      var data = await resp.json();
      outputJson(data, workflowId + '_' + format + '.json');
    } catch (e) {
      showToast('Export error: ' + e.message, 5000, 'error');
    }
  }

  document.querySelectorAll('.export-opt').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      $exportMenu.style.display = 'none';
      var format = btn.dataset.format;
      if (format === 'params') {
        var params = gatherCurrentParams();
        outputJson({ workflow_id: workflowId, params: params }, workflowId + '_params.json');
      } else {
        exportBuild(format);
      }
    });
  });

  // ── Save Preset ──
  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').substring(0, 50);
  }

  function showSavePresetDialog() {
    return new Promise(function(resolve) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:10000;display:flex;justify-content:center;align-items:center;';
      var box = document.createElement('div');
      box.style.cssText = 'background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:24px;width:450px;max-width:90vw;';
      box.innerHTML =
        '<h2 style="margin:0 0 16px;font-size:16px;">Save Preset</h2>' +
        '<div style="margin-bottom:12px;">' +
          '<label style="display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px;">Name</label>' +
          '<input type="text" id="presetDialogName" style="width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--mono);font-size:13px;" placeholder="My awesome preset">' +
        '</div>' +
        '<div style="margin-bottom:16px;">' +
          '<label style="display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:4px;">Description</label>' +
          '<textarea id="presetDialogDesc" rows="3" style="width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--mono);font-size:12px;resize:vertical;" placeholder="Optional description..."></textarea>' +
        '</div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
          '<button class="btn btn--sm" id="presetDialogCancel">Cancel</button>' +
          '<button class="btn" id="presetDialogSave">Save</button>' +
        '</div>';
      overlay.appendChild(box);
      document.body.appendChild(overlay);

      var nameInput = document.getElementById('presetDialogName');
      nameInput.focus();

      function close(result) {
        document.body.removeChild(overlay);
        resolve(result);
      }

      overlay.addEventListener('click', function(e) { if (e.target === overlay) close(null); });
      document.getElementById('presetDialogCancel').onclick = function() { close(null); };
      document.getElementById('presetDialogSave').onclick = function() {
        var name = nameInput.value.trim();
        if (!name) { nameInput.style.borderColor = 'var(--error)'; return; }
        close({name: name, description: document.getElementById('presetDialogDesc').value.trim()});
      };
      nameInput.onkeydown = function(e) {
        if (e.key === 'Enter') document.getElementById('presetDialogSave').click();
        if (e.key === 'Escape') close(null);
      };
    });
  }

  document.getElementById('savePresetBtn').addEventListener('click', async function() {
    var result = await showSavePresetDialog();
    if (!result) return;

    var params = gatherCurrentParams();
    delete params.input_image;
    delete params.image;

    var presetId = slugify(result.name);
    if (!presetId) presetId = 'preset-' + Date.now();

    try {
      var resp = await apiFetch('/api/admin/presets', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          id: presetId,
          name: result.name,
          description: result.description,
          workflow: {
            workflow_id: workflowId,
            workflow_name: manifest.name || workflowId,
            params: params
          }
        })
      });
      if (resp.ok) {
        showToast('Preset saved: ' + result.name, 3000, 'success');
      } else {
        var err = await resp.json().catch(function() { return {}; });
        showToast('Error: ' + (err.detail || resp.status), 5000, 'error');
      }
    } catch(e) {
      if (e.message !== 'auth') showToast('Save failed: ' + e.message, 5000, 'error');
    }
  });

  // ── Telemetry ──
  const $telemetryPanel = document.getElementById('telemetryPanel');

  function makeGauge(id, label) {
    return '<div class="gauge-card" id="' + id + '">' +
      '<div class="gauge-ring">' +
        '<svg viewBox="0 0 80 80"><circle class="gauge-bg" /><circle class="gauge-fill" /></svg>' +
        '<div class="gauge-value">--</div>' +
      '</div>' +
      '<div class="gauge-label">' + label + '</div>' +
      '<div class="gauge-sub">&nbsp;</div>' +
    '</div>';
  }

  function updateGauge(id, pct, sub) {
    var card = document.getElementById(id);
    if (!card) return;
    var fill = card.querySelector('.gauge-fill');
    var val = card.querySelector('.gauge-value');
    var subEl = card.querySelector('.gauge-sub');
    var p = Math.max(0, Math.min(100, pct || 0));
    var offset = 213.6 - (213.6 * p / 100);
    fill.style.strokeDashoffset = offset;
    fill.classList.remove('warn', 'crit');
    if (p > 85) fill.classList.add('crit');
    else if (p > 65) fill.classList.add('warn');
    val.textContent = Math.round(p) + '%';
    if (sub) subEl.textContent = sub;
  }

  async function pollTelemetry() {
    try {
      var resp = await apiFetch('/api/admin/telemetry');
      if (!resp.ok) return;
      var d = await resp.json();

      // Heartbeat flash on data received
      $telemetryPanel.style.background = 'rgba(232, 255, 71, 0.03)';
      setTimeout(function() { $telemetryPanel.style.background = ''; }, 300);

      if (!$telemetryPanel.innerHTML) {
        $telemetryPanel.innerHTML =
          makeGauge('gGpu', 'GPU Load') +
          makeGauge('gVram', 'VRAM') +
          makeGauge('gRam', 'System RAM') +
          makeGauge('gCpu', 'CPU') +
          makeGauge('gDisk', 'Disk');
      }

      if (d.gpu) {
        updateGauge('gGpu', d.gpu.util_percent, d.gpu.name + (d.gpu.temp_c ? ' \u00b7 ' + d.gpu.temp_c + '\u00b0C' : ''));
        updateGauge('gVram', d.gpu.vram_percent, fmtGB(d.gpu.vram_used) + ' / ' + fmtGB(d.gpu.vram_total));
      }
      updateGauge('gRam', d.ram_percent, fmtGB(d.ram_used) + ' / ' + fmtGB(d.ram_total));
      updateGauge('gCpu', d.cpu_percent, 'load');
      if (d.disk_total > 0) {
        updateGauge('gDisk', d.disk_percent, fmtGB(d.disk_used) + ' / ' + fmtGB(d.disk_total));
      }
    } catch (_) {}
  }

  // ── Boot ──
  initialLoad();
  pollTelemetry();
  setInterval(pollTelemetry, 3000);

})();
</script>
</body>
</html>
