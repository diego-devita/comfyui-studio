<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Studio — Login</title>
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/icons.css">
<style>
  .login-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 48px 40px;
    width: 400px;
    max-width: 100%;
    text-align: center;
  }

  .login-card h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .login-card h1 span { color: var(--accent); }

  .login-card .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .login-card .form-group {
    text-align: left;
    margin-bottom: 20px;
  }

  .login-card label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .login-card input[type="password"] {
    display: block;
    width: 100%;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
  }
  .login-card input[type="password"]:focus { border-color: var(--accent); }

  .login-card .error-msg {
    color: var(--error);
    font-size: 12px;
    font-family: var(--mono);
    margin-bottom: 16px;
    display: none;
  }

  .login-card .btn-login {
    display: block;
    width: 100%;
    padding: 12px 24px;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
  }
  .login-card .btn-login:hover:not(:disabled) { background: var(--accent); color: #0a0a0f; }
  .login-card .btn-login:disabled { border-color: var(--border); color: var(--muted); cursor: not-allowed; }
</style>
</head>
<body>

<div class="login-page">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>ComfyUI <span>Studio</span></h1>
    <p class="subtitle">Enter your API key to continue</p>

    <div class="form-group">
      <label for="apiKeyInput">API Key</label>
      <input type="password" id="apiKeyInput" placeholder="API Key" autocomplete="current-password" autofocus>
    </div>

    <div class="error-msg" id="errorMsg">Invalid API key</div>

    <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
  </form>
</div>

<script>
(function() {
  'use strict';

  const form = document.getElementById('loginForm');
  const input = document.getElementById('apiKeyInput');
  const error = document.getElementById('errorMsg');
  const btn = document.getElementById('loginBtn');

  // Get ?next= parameter from URL
  const params = new URLSearchParams(window.location.search);
  const nextUrl = params.get('next') || '/home';

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    error.style.display = 'none';

    try {
      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({api_key: input.value, next: nextUrl})
      });
      if (resp.ok) {
        window.location = nextUrl;
      } else {
        error.textContent = 'Invalid API key';
        error.style.display = 'block';
        input.focus();
        input.select();
      }
    } catch (e) {
      error.textContent = 'Connection error';
      error.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Sign In';
  });
})();
</script>
</body>
</html>
