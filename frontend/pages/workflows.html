<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Studio — Workflow Manager</title>
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/icons.css">
<style>
  /* Card grid: wider min for workflow cards */
  .card-grid {
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
  }

  .wf-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
    position: relative;
  }
  .wf-card.ready {
    border-color: var(--success);
    box-shadow: 0 0 16px rgba(68, 255, 136, 0.06);
  }
  .wf-card.models-missing {
    border-color: var(--queued);
    box-shadow: 0 0 16px rgba(255, 170, 68, 0.06);
  }
  .wf-card.nodes-missing {
    border-color: var(--error);
    box-shadow: 0 0 16px rgba(255, 68, 102, 0.06);
  }

  .wf-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .wf-card-info { flex: 1; min-width: 0; }

  .wf-badge {
    display: inline-block;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 12px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .wf-badge.t2i { background: #e8ff47; color: #0a0a0f; }
  .wf-badge.i2v { background: #47c8ff; color: #0a0a0f; }
  .wf-badge.i2i { background: #ff8f47; color: #0a0a0f; }
  .wf-badge.ipa { background: #c47aff; color: #0a0a0f; }

  .wf-card-name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 4px;
    line-height: 1.3;
    word-break: break-word;
  }

  .wf-card-version {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    white-space: nowrap;
    align-self: flex-start;
  }

  .wf-card-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .wf-card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── Dependency Bars ── */
  .wf-deps { display: flex; flex-direction: column; gap: 8px; }

  .dep-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 11px;
  }
  .dep-label {
    color: var(--muted);
    min-width: 52px;
    flex-shrink: 0;
  }
  .dep-dots {
    display: flex;
    gap: 3px;
    align-items: center;
    flex-shrink: 0;
  }
  .dep-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }
  .dep-dot.filled { background: var(--success); }
  .dep-dot.missing-dot { background: var(--border); }

  .dep-count {
    color: var(--muted);
    white-space: nowrap;
  }
  .dep-count.all-good { color: var(--success); }
  .dep-count.has-missing { color: var(--queued); }

  .dep-action { margin-left: auto; flex-shrink: 0; }

  /* ── Card Actions ── */
  .wf-type-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid;
  }
  .wf-type-badge.static { color: var(--muted); border-color: var(--border); background: var(--bg); }
  .wf-type-badge.dynamic { color: var(--accent); border-color: var(--accent); background: rgba(232,255,71,0.1); }

  .wf-card-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: auto;
    padding-top: 4px;
  }

  /* ── Details Expand ── */
  .wf-details {
    display: none;
    flex-direction: column;
    gap: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .wf-details.visible { display: flex; }

  .detail-section-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .detail-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .detail-item {
    padding: 3px 10px;
    font-family: var(--mono);
    font-size: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    color: var(--muted);
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .detail-item.present { border-color: var(--success); color: var(--success); }
  .detail-item.missing { border-color: var(--border); color: var(--muted); }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="main-nav">
  <a href="/home" class="nav-link">Home</a>
  <a href="/admin/nodes" class="nav-link">Nodes</a>
  <a href="/admin/models" class="nav-link">Models</a>
  <a href="/admin/loras" class="nav-link">LoRAs</a>
  <a href="/admin/workflows" class="nav-link active">Workflows</a>
  <a href="/admin/presets" class="nav-link">Presets</a>
  <a href="/admin/queue" class="nav-link">Queue</a>
  <a href="/admin/history" class="nav-link">History</a>
  <a href="/admin/assets" class="nav-link">Assets</a>
  <a href="/admin/llm" class="nav-link">LLM</a>
  <a href="/admin/settings" class="nav-link"><span class="icon icon-gear icon-lg"></span></a>
  <a href="#" class="nav-link nav-activity" id="activityToggle" onclick="event.preventDefault()"><span class="icon icon-bell icon-lg"></span><span class="activity-dot" id="activityDot"></span></a>
  <a id="docsLink" href="#" target="_blank" class="nav-link" title="Documentation" style="display:none"><span class="icon icon-circle-question icon-lg"></span></a>
  <a href="#" class="nav-link nav-logout" onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>window.location='/login')"><span class="icon icon-logout icon-lg"></span></a>
</nav>

<!-- Header -->
<header>
  <div class="logo">ComfyUI <span class="studio-word">Studio<span class="beta-badge">BETA</span></span> <small>Workflow Manager</small></div>
  <div class="header-actions"></div>
</header>

<!-- Main content -->
<main id="mainContent">
  <div class="loading-state" id="loadingState">
    <span class="spinner"></span>
    Loading workflows...
  </div>
  <div id="groupFilters" style="display:none;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;"></div>
  <div class="card-grid" id="cardGrid" style="display:none;"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <p>No workflows found. Click Sync to scan for workflow manifests.</p>
  </div>
</main>

<script src="/static/js/shared.js"></script>
<script>
(function() {
  'use strict';

  // ── State ──
  let workflows = [];
  let activeGroups = new Set(); // empty = show all

  // ── DOM refs ──
  const $main         = document.getElementById('mainContent');
  const $loading      = document.getElementById('loadingState');
  const $cardGrid     = document.getElementById('cardGrid');
  const $emptyState   = document.getElementById('emptyState');
  const $groupFilters = document.getElementById('groupFilters');

  // ── Initial load ──
  async function initialLoad() {
    try {
      const resp = await apiFetch('/api/admin/workflows');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const data = await resp.json();
      handleWorkflowData(data);
      $loading.style.display = 'none';
    } catch (e) {
      if (e.message !== 'auth') {
        console.error('Initial load error:', e);
      }
    }
  }

  // ── Data handling ──
  function handleWorkflowData(data) {
    workflows = Array.isArray(data) ? data : (data.workflows || []);
    buildGroupFilters();
    renderCards();
    _startPollIfNeeded();
  }

  function buildGroupFilters() {
    var groups = new Set();
    workflows.forEach(function(wf) { if (wf.group) groups.add(wf.group); });
    $groupFilters.innerHTML = '';
    if (groups.size < 2) { $groupFilters.style.display = 'none'; return; }
    $groupFilters.style.display = 'flex';
    // Initialize: all groups active
    if (activeGroups.size === 0) groups.forEach(function(g) { activeGroups.add(g); });
    groups.forEach(function(g) {
      var btn = document.createElement('button');
      btn.className = 'btn btn-sm' + (activeGroups.has(g) ? ' active' : '');
      btn.textContent = g;
      btn.style.cssText = 'padding:4px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;border-radius:20px;' +
        (activeGroups.has(g) ? 'background:var(--accent);color:var(--bg);' : 'background:var(--surface);color:var(--muted);border:1px solid var(--border);');
      btn.onclick = function() {
        if (activeGroups.has(g)) activeGroups.delete(g); else activeGroups.add(g);
        // Don't allow all off — re-enable all
        if (activeGroups.size === 0) groups.forEach(function(gg) { activeGroups.add(gg); });
        buildGroupFilters();
        renderCards();
      };
      $groupFilters.appendChild(btn);
    });
  }

  function renderCards() {
    $cardGrid.innerHTML = '';

    var filtered = workflows.filter(function(wf) {
      if (activeGroups.size === 0) return true;
      return activeGroups.has(wf.group || '');
    });

    if (filtered.length === 0) {
      $cardGrid.style.display = 'none';
      $emptyState.style.display = '';
      return;
    }

    $emptyState.style.display = 'none';
    $cardGrid.style.display = '';

    filtered.forEach(wf => {
      $cardGrid.appendChild(createWorkflowCard(wf));
    });
  }

  function createWorkflowCard(wf) {
    const card = document.createElement('div');
    card.className = 'wf-card';

    // Build model/node arrays from the API's status structure
    const ms = wf.models_status || {};
    const ns = wf.nodes_status || {};
    const modelsPresent = ms.present || 0;
    const modelsTotal = ms.total || 0;
    const nodesPresent = ns.installed || 0;
    const nodesTotal = ns.total || 0;

    // Build detail arrays: all required models with present/missing/downloading status
    const missingModels = new Set(ms.missing || []);
    const downloadingModels = new Set(ms.downloading || []);
    const downloadingCount = downloadingModels.size;
    const allRequiredModels = (wf.required_models || []).length > 0
      ? wf.required_models
      : [...(ms.missing || []), ...(ms.downloading || [])];
    const models = allRequiredModels.map(f => ({
      name: f,
      status: downloadingModels.has(f) ? 'downloading' : missingModels.has(f) ? 'missing' : 'present'
    }));

    const missingNodes = new Set(ns.missing || []);
    const allRequiredNodes = (wf.required_nodes || []).length > 0
      ? wf.required_nodes
      : [...(ns.missing || [])];
    const nodes = allRequiredNodes.map(n => ({
      name: n,
      installed: !missingNodes.has(n)
    }));

    const allModelsOk = modelsPresent === modelsTotal;
    const allNodesOk = nodesPresent === nodesTotal;

    if (!allNodesOk) {
      card.classList.add('nodes-missing');
    } else if (!allModelsOk) {
      card.classList.add('models-missing');
    } else {
      card.classList.add('ready');
    }

    const version = wf.version ? 'v' + wf.version : '';
    const date = wf.updated_at || wf.created_at || '';
    const author = wf.author || '';
    const dateStr = date ? date.substring(0, 10) : '';
    const metaParts = [dateStr, author ? 'by ' + author : ''].filter(Boolean).join(' \u00b7 ');
    const desc = wf.description || '';

    const modelCountClass = allModelsOk ? 'all-good' : 'has-missing';
    const nodeCountClass = allNodesOk ? 'all-good' : 'has-missing';

    var installBtn = '';
    if (downloadingCount > 0) {
      installBtn = '<button class="btn btn--sm dep-action" disabled><span class="spinner sm"></span> Downloading ' + (modelsPresent + downloadingCount) + '/' + modelsTotal + '</button>';
    } else if (!allModelsOk) {
      installBtn = '<button class="btn btn--sm dep-action" data-install="' + escHtml(wf.id) + '">Install Missing</button>';
    }

    card.innerHTML =
      '<div class="wf-card-top">' +
        '<div class="wf-card-info">' +
          (wf.category ? '<span class="wf-badge ' + escHtml(wf.category) + '">' + escHtml(wf.category) + '</span>' : '') +
          '<div class="wf-card-name" style="display:inline;">' + escHtml(wf.name || wf.id) + '</div>' +
          '<div class="wf-card-meta">' + escHtml(metaParts) + '</div>' +
        '</div>' +
        (version ? '<span class="wf-card-version">' + escHtml(version) + '</span>' : '') +
      '</div>' +
      (desc ? '<div class="wf-card-desc">' + escHtml(desc) + '</div>' : '') +
      '<div class="wf-deps">' +
        '<div class="dep-row">' +
          '<span class="dep-label">Models</span>' +
          '<span class="dep-count ' + modelCountClass + '">' + modelsPresent + '/' + modelsTotal + '</span>' +
          installBtn +
        '</div>' +
        '<div class="dep-row">' +
          '<span class="dep-label">Nodes</span>' +
          '<span class="dep-count ' + nodeCountClass + '">' + nodesPresent + '/' + nodesTotal + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="wf-card-actions">' +
        '<button class="btn btn--sm" data-run="' + escHtml(wf.id) + '"' + ((!allModelsOk || !allNodesOk) ? ' disabled title="All dependencies must be installed"' : '') + '">&#9654; Run</button>' +
        '<button class="btn btn--sm" data-details="' + escHtml(wf.id) + '" style="border-color:var(--border);color:var(--muted);">Details</button>' +
      '</div>' +
      '<div class="wf-details" data-details-panel="' + escHtml(wf.id) + '">' +
        buildDetailSection('Models', models) +
        buildDetailSection('Nodes', nodes) +
      '</div>' +
      '<span class="wf-type-badge ' + (wf.type === 'dynamic' ? 'dynamic' : 'static') + '">' + (wf.type === 'dynamic' ? 'Dynamic' : 'Static') + '</span>';

    // Event: Install Missing
    const installBtnEl = card.querySelector('[data-install]');
    if (installBtnEl) {
      installBtnEl.addEventListener('click', () => installMissingModels(wf.id, installBtnEl));
    }

    // Event: Run
    const runBtnEl = card.querySelector('[data-run]');
    runBtnEl.addEventListener('click', () => {
      window.location.href = '/run/' + encodeURIComponent(wf.id);
    });

    // Event: Details toggle
    const detailsBtnEl = card.querySelector('[data-details]');
    const detailsPanel = card.querySelector('[data-details-panel]');
    detailsBtnEl.addEventListener('click', (e) => {
      e.stopPropagation();
      const isVisible = detailsPanel.classList.contains('visible');
      detailsPanel.classList.toggle('visible');
      detailsBtnEl.textContent = isVisible ? 'Details' : 'Hide';
    });
    detailsPanel.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    return card;
  }

  function buildDetailSection(title, items) {
    if (!items || items.length === 0) return '';
    const itemsHtml = items.map(item => {
      const name = item.name || item.file || item.class_name || item.id || 'unknown';
      const isPresent = item.status === 'present' || item.installed;
      return '<span class="detail-item ' + (isPresent ? 'present' : 'missing') + '">' + escHtml(name) + '</span>';
    }).join('');
    return '<div>' +
      '<div class="detail-section-title">' + escHtml(title) + '</div>' +
      '<div class="detail-list">' + itemsHtml + '</div>' +
    '</div>';
  }

  // ── Actions ──
  async function installMissingModels(workflowId, btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm"></span> Installing...';
    try {
      const resp = await apiFetch('/api/admin/workflows/' + encodeURIComponent(workflowId) + '/install-models', {
        method: 'POST'
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        showToast('Install error: ' + (err.detail || err.error || resp.status), 5000, 'error');
        btn.disabled = false;
        btn.textContent = 'Install Missing';
      } else {
        // Reload to pick up new download state, then start polling
        initialLoad();
      }
    } catch (e) {
      if (e.message !== 'auth') {
        showToast('Error: ' + e.message, 5000, 'error');
        btn.disabled = false;
        btn.textContent = 'Install Missing';
      }
    }
  }

  // ── Auto-poll while downloads are active ──
  var _pollTimer = null;
  function _startPollIfNeeded() {
    if (_pollTimer) return;
    var hasActive = workflows.some(function(wf) {
      return wf.models_status && wf.models_status.downloading && wf.models_status.downloading.length > 0;
    });
    if (!hasActive) return;
    _pollTimer = setInterval(async function() {
      try {
        var resp = await apiFetch('/api/admin/workflows');
        if (!resp.ok) return;
        var data = await resp.json();
        var list = Array.isArray(data) ? data : (data.workflows || []);
        // Check if any workflow just became ready
        list.forEach(function(wf) {
          var old = workflows.find(function(o) { return o.id === wf.id; });
          if (old && !old.ready && wf.ready) {
            showToast('All models installed for ' + (wf.name || wf.id), 3000, 'success');
          }
        });
        workflows = list;
        renderCards();
        // Stop polling if no more active downloads
        var stillActive = list.some(function(wf) {
          return wf.models_status && wf.models_status.downloading && wf.models_status.downloading.length > 0;
        });
        if (!stillActive) {
          clearInterval(_pollTimer);
          _pollTimer = null;
        }
      } catch(e) {}
    }, 3000);
  }

  // ── Boot ──
  initialLoad();

})();
</script>
</body>
</html>
